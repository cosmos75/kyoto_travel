<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都大学 吉田校区 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#8c2a2a; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button,input{font:inherit}
button{cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.act{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 0 0}
.act:hover{background:var(--red);color:#fff}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#pVoice{margin:12px 0 0 6px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:6px 13px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,24,18,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:600px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#8c2a2a;border-color:#8c2a2a}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="app"></div>
<div id="labels"></div>
<header id="brand"><h1>京都大学</h1><small>KYOTO UNIVERSITY · 吉田キャンパス · 京都市左京区</small></header>

  <button class="tb" id="bOverview">总览布局</button>
  <button class="tb" id="bRoute">游览路线</button>
  <button class="tb on" id="bLabels">标签</button>
  <button class="tb" id="bSeason">季节：秋</button>
  <button class="tb" id="bTime">时间：白昼</button>
  <button class="tb on" id="bVoice">讲解：中文</button>

</div>

  <button id="pClose" aria-label="关闭">×</button>
  <div id="pNum"></div>
  <h2 id="pTitle"></h2>
  <div id="pJp"></div>
  <div id="pBody"></div>
  <div id="pExtra"></div>
  <button id="pGo">前往此处</button><button id="pVoice" style="display:none">▶ 播放讲解</button>
</aside>
<nav id="tour">
  <button class="nav" id="tPrev">‹ 上一处</button>
  <div id="dots"></div>
  <span id="stopName">—</span>
  <button class="nav" id="tNext">下一处 ›</button>
  <button class="nav play" id="tPlay">▶ 自动</button>
</nav>
<div id="tip">拖动旋转 · 滚轮缩放 · 右键平移 · 点击金色标记、建筑、骑车的学生互动 · ← → 切换景点</div>
<div id="toast"></div>
<div id="intro">
  <div class="card">
    <h2>京都大学</h2>
    <div class="sub">吉田キャンパス · 本部構内 · 吉田南構内 · 1897</div>
    <p>东山脚下、吉田山西麓，京都帝国大学于 1897 年在这里创立。<br>
    从东一条通的正门进去，楠树后面就是武田五一设计的时计台；<br>再走到百万遍路口，穿过东一条通去旧第三高等学校的吉田南，最后到乐友会馆。</p>
    <div class="btns">
      <button class="main" id="iTour">从正门开始参观</button>
      <button id="iFree">先看整体布局</button>
    </div>
    <div id="loading">正在生成校园……</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(1897);
const R = (a,b)=>a+(b-a)*rand();
const pickA = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;
const V3 = THREE.Vector3;
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 6000);
camera.position.set(560,540,600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.62; controls.minDistance = 0.3; controls.maxDistance = 1100;
controls.target.set(-20,0,-40);

const U = { uTime:{value:0}, uDusk:{value:0}, uNight:{value:0}, uSnow:{value:0} };

/* ---------------- site plan (x = east, z = south, metres; campus ground y = 0) ----------------
   本部構内 (main campus) lies between 今出川通 (north) and 東一条通 (south), east of 東大路通.
   The 正門 opens north off 東一条通 at x = 0; the クスノキ stands in a round bed in front of the
   時計台 (百周年時計台記念館), whose tower faces the gate. 吉田南構内 (the former 第三高等学校) lies
   across 東一条通 to the south, its own 正門 facing the main gate; 楽友会館 is at its south-west
   corner on 近衛通. 百万遍 is the 東大路 / 今出川 crossing at the north-west corner. 吉田山 rises east.
   Calibrated to the official campus maps (本部・西部構内 and 吉田南構内, kyoto-u.ac.jp, 2026): 1 map pixel ≈ 1 m,
   x = map x − 410, z = map y − 528. Buildings other than the named stops are simplified blocks. */
const EX=-215, EX0=-226, EX1=-204;          // 東大路通 (road x EX0..EX1, sidewalks 4 m either side)
const IZ=-448, IZ0=-458, IZ1=-438;          // 今出川通
const HZ0=-5, HZ1=5;                         // 東一条通 (road z HZ0..HZ1, sidewalks 3 m)
const KZ0=404, KZ1=412;                      // 近衛通
const HONBU={x0:-200,x1:345,z0:-434,z1:-8}, MINAMI={x0:-200,x1:70,z0:8,z1:400};
const MX=-25;                                // 吉田南正門 (map: slightly west of the main gate)
const XE=380;                                // east end of 東一条通 / 近衛通 at the foot of 吉田山
const KUSU={x:0,z:-42,r:8.5};
const TOWER={x:0,z:-87};
function segDist(px,pz,ax,az,bx_,bz){ const vx=bx_-ax, vz=bz-az; const t=Math.max(0,Math.min(1,((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz))); return Math.hypot(px-ax-vx*t,pz-az-vz*t); }
function polyDist(px,pz,P){ let d=1e9; for(let i=0;i<P.length-1;i++){ const q=segDist(px,pz,P[i][0],P[i][1],P[i+1][0],P[i+1][1]); if(q<d) d=q; } return d; }
const inR=(x,z,r,p=0)=>x>r.x0-p&&x<r.x1+p&&z>r.z0-p&&z<r.z1+p;
// campus lanes: [x0,z0,x1,z1,halfWidth]
const LANES=[[-110,-430,-110,-8,4],[85,-430,85,-70,4],[250,-430,250,-8,4],[-196,-70,340,-70,4.5],[-110,-183,340,-183,4],[-110,-273,340,-273,4],[-196,-345,340,-345,3.5],
  [-196,-226,-110,-226,3],[-196,-98,-110,-98,3],
  [-80,20,-80,396,3.5],[45,20,45,330,3.5],[-196,170,66,170,4],[-196,240,66,240,4],[-80,326,45,326,3]];
const PLAZA={x0:-58,x1:58,z0:-80,z1:-8}, PLAZA_S={x0:MX-12,x1:MX+22,z0:8,z1:82};
const FIELD={x0:-186,x1:-88,z0:26,z1:150}, COURTS={x0:-15,x1:62,z0:340,z1:392};
const LAWNS=[{x0:-46,x1:11,z0:96,z1:146},{x0:-104,x1:-66,z0:-60,z1:-16},{x0:-196,x1:-118,z0:-92,z1:-76}];
function cityRoad(x,z){
  if(x>EX0&&x<EX1) return true;
  if(z>IZ0&&z<IZ1) return true;
  if(z>HZ0&&z<HZ1&&x>EX1&&x<XE) return true;
  if(z>KZ0&&z<KZ1&&x>EX1&&x<XE) return true;
  return false;
}
function sidewalk(x,z){
  if((x>EX0-4&&x<EX0)||(x>EX1&&x<EX1+4)) return true;
  if((z>IZ0-4&&z<IZ0)||(z>IZ1&&z<IZ1+4)) return true;
  if(x>EX1&&x<XE&&((z>HZ0-3&&z<HZ0)||(z>HZ1&&z<HZ1+3))) return true;
  if(x>EX1&&x<XE&&((z>KZ0-4&&z<KZ0)||(z>KZ1&&z<KZ1+4))) return true;
  return false;
}
const laneD=(x,z)=>{ let d=1e9; for(const l of LANES){ const q=segDist(x,z,l[0],l[1],l[2],l[3])-l[4]; if(q<d) d=q; } return d; };
const inCampus=(x,z,p=0)=>inR(x,z,HONBU,p)||inR(x,z,MINAMI,p);
// 吉田山: a low wooded hill east of the campus (about 50 m above the campus)
function hill(x,z){ const a=(x-610)/170, b=(z+40)/300; const d=a*a+b*b; return 58*Math.exp(-d*1.4)*(1+0.08*Math.sin(x*0.03+z*0.02))+6*sm(400,500,x); }
function H(x,z){ if(x<XE) return 0; return hill(x,z)*sm(XE,XE+55,x); }
/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3a2a20',{roughness:.75}), woodMid:std('#6b4c33'), woodLight:std('#9b7a55',{roughness:.7}),
  plaster:std('#ece5d4',{roughness:.95}), stucco:std('#e6d8b8',{roughness:.95}),
  roof_tile:std('#4f5156',{roughness:.62,side:THREE.DoubleSide}), roof_orange:std('#c8683a',{roughness:.7,side:THREE.DoubleSide}),
  soffit:std('#5a4a3c',{roughness:.85,side:THREE.DoubleSide}), roofDark:std('#33353a',{roughness:.6}), roofOr:std('#b35a32',{roughness:.7}),
  stone:std('#9a958b',{roughness:.95}), granite:std('#c4bdb0',{roughness:.85}), foundation:std('#77726a'),
  ktile:std('#b9976e',{roughness:.88}), brick:std('#94523c',{roughness:.9}), brickStone:std('#9a4e38',{roughness:.9}), ashlar:std('#a49d90',{roughness:.95}),
  iron:std('#22262a',{roughness:.45,metalness:.6}), steel:std('#9aa1a6',{roughness:.35,metalness:.8}), bronze:std('#6a6a52',{roughness:.5,metalness:.6}),
  glass:std('#1c2630',{roughness:.08,metalness:.3}), glassLit:std('#1c2630',{roughness:.1,metalness:.2,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  frameW:std('#e8e4da',{roughness:.6}), white:std('#f2f0ea',{roughness:.7}), black:std('#1d1b19',{roughness:.6}),
  concrete:std('#b4b0a6',{roughness:.92}), asphalt:std('#46474a',{roughness:.9}), curb:std('#a19e96',{roughness:.9}),
  plywood:std('#ffffff',{roughness:.85}), bark:std('#4a3b30',{roughness:1}), pineBark:std('#5a4334',{roughness:1}),
  clockFace:std('#f4f0e2',{roughness:.5,emissive:new THREE.Color('#fff2cc'),emissiveIntensity:0}),
  lampGlow:std('#fff4dc',{emissive:new THREE.Color('#ffd79a'),emissiveIntensity:0}),
  hedge:std('#ffffff',{roughness:.85}), pedestal:std('#8f8a80',{roughness:.9}),
  bus:std('#2f7a52',{roughness:.45,metalness:.2}), busTop:std('#e8e2cc',{roughness:.5}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;
let _pk=0;
// generic onBeforeCompile patcher (world-space varyings, sway, colour/roughness/metal/normal/emissive hooks, snow cover)
function patchMat(mat,o){
  const key='pm'+(_pk++); mat.customProgramCacheKey=()=>key;
  const sn=o.snow||[0.55,0.85,1.0];
  const SNOW=o.noSnow?'':`{ float sk=uSnow*snowK*${sn[2].toFixed(2)}*smoothstep(${sn[0].toFixed(2)},${sn[1].toFixed(2)},vWN.y)*smoothstep(0.28,0.5,fbm(vW*1.7)*0.6+0.4*uSnow+0.08);
     diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.9,0.92,0.96),clamp(sk,0.,1.)); gSnowAmt=clamp(sk,0.,1.); }`;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uDusk=U.uDusk; sh.uniforms.uNight=U.uNight; sh.uniforms.uSnow=U.uSnow; Object.assign(sh.uniforms,o.uniforms||{});
    let v=sh.vertexShader, f=sh.fragmentShader;
    v=v.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+(o.vHead||''));
    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 dwp=vec4(transformed,1.0); vec3 dwn=objectNormal;
      #ifdef USE_INSTANCING
        dwp=instanceMatrix*dwp; mat3 dIm=mat3(instanceMatrix); dwn=dIm*(dwn/vec3(dot(dIm[0],dIm[0]),dot(dIm[1],dIm[1]),dot(dIm[2],dIm[2])));
      #endif
      vW=(modelMatrix*dwp).xyz; vWN=normalize(mat3(modelMatrix)*dwn);
      ${o.vBegin||''}`);
    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float swk=${o.sway};
      float gust=0.75+0.45*sin(uTime*0.37+mvPosition.x*0.05)*sin(uTime*0.23+1.7);
      mvPosition.x += sin(uTime*1.3+mvPosition.x*0.35+mvPosition.z*0.21)*swk*gust;
      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75*gust;
      mvPosition.y += sin(uTime*2.1+mvPosition.x*1.7)*swk*0.12;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    f=f.replace('#include <common>','#include <common>\nuniform float uTime; uniform float uDusk; uniform float uNight; uniform float uSnow;\nvarying vec3 vW; varying vec3 vWN; float snowK=1.0; float gSnowAmt=0.0;\n'+NOISE_GLSL+(o.fHead||''));
    f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+(o.color||'')+'\n'+SNOW);

 {id:'museum',name:'综合博物馆',jp:'京都大学総合博物館 · 東大路通',marker:[-171,18.5,-292],view:{p:[-213,1.7,-262],t:[-180,6,-292]},via:[[-150,1.7,-212],[-150,1.7,-226],[-202,1.7,-226],[-208,1.7,-240]],

 {id:'hyakumanben',name:'百万遍与立看板',jp:'百万遍交差点 · 石垣とタテカン',marker:[-200,4.8,-434],view:{p:[-229,1.7,-418],t:[-200,1.8,-431]},via:[[-212,1.7,-330],[-229,1.7,-400]],
  text:`<p>东大路通与今出川通交汇的路口，京都人叫它“百万遍”。名字来自路口旁的知恩寺：1331 年京都疫病流行，知恩寺的住持奉后醍醐天皇之命念佛百万遍，平息了疫病，寺院因此得赐“百万遍”之号。</p><p>本部构内西北角的石垣上，多年来立满学生社团手写的大幅立看板（タテカン），宣传活动、表达主张，被看作京大自由校风的一道风景。2017 年京都市依据屋外广告物条例对大学进行行政指导，京大于 2018 年起施行规程、限定设置地点，石垣上的看板大多被撤去，但至今仍不时有新的出现。</p>`,

  text:`<p>东一条通南侧、与本部正门隔街相对的，是吉田南构内的正门和门卫所。1897 年京都帝国大学创立时，原在本部校地的第三高等学校迁到东一条通南侧，这座门就是那时建起的三高正门。</p><p>旧制第三高等学校（三高）在 1949 年新制大学成立时并入京都大学，这片校区后来成为教养部，现在是综合人间学部的所在地。东一条通两侧相对的两座正门，见证了“京大”与“三高”的渊源。</p>`},

  // walkers and cyclists
  for(let i=0;i<WALKERS.length;i++){ const p=WALKERS[i]; p.s+=p.dir*p.v*dt; if(p.s>p.w.L){ p.s=p.w.L; p.dir=-1; } else if(p.s<0){ p.s=0; p.dir=1; }
    walkAt(p.w,p.s,_wk); const hx=_wk.dx*p.dir, hz=_wk.dz*p.dir; const x=_wk.x+(-_wk.dz)*p.off, z=_wk.z+_wk.dx*p.off;
    _q.setFromAxisAngle(_v.set(0,1,0),Math.atan2(hx,hz)); _m.compose(_v0.set(x,H(x,z)+0.16+Math.abs(Math.sin(t*7.2+x*1.7+z*1.3))*0.03,z),_q,_s.set(1,1,1)); walkBody.setMatrixAt(i,_m); walkHead.setMatrixAt(i,_m); }
  walkBody.instanceMatrix.needsUpdate=true; walkHead.instanceMatrix.needsUpdate=true;
  for(let i=0;i<RIDERS.length;i++){ const p=RIDERS[i]; p.s+=p.dir*p.v*dt; if(p.s>p.w.L){ p.s=p.w.L; p.dir=-1; } else if(p.s<0){ p.s=0; p.dir=1; }
    walkAt(p.w,p.s,_wk); const hx=_wk.dx*p.dir, hz=_wk.dz*p.dir; const x=_wk.x+(-_wk.dz)*p.off, z=_wk.z+_wk.dx*p.off;
    _q.setFromAxisAngle(_v.set(0,1,0),Math.atan2(hx,hz)-PI/2); _m.compose(_v0.set(x,H(x,z)+0.16,z),_q,_s.set(1,1,1)); rideBike.setMatrixAt(i,_m); rideBody.setMatrixAt(i,_m); rideHead.setMatrixAt(i,_m); if(p.ring) p.ring=Math.max(0,p.ring-dt); }
  rideBike.instanceMatrix.needsUpdate=true; rideBody.instanceMatrix.needsUpdate=true; rideHead.instanceMatrix.needsUpdate=true;
  // buses and cars
  { let bi=0, ci=0; for(const v of VEH){ v.s+=v.dir*v.v*dt; if(v.s>620) v.s=-620; if(v.s<-620) v.s=620;
      let x,z,ry; if(v.ax==='z'){ x=v.dir>0?EX+5:EX-5; z=v.s; ry=v.dir>0?-PI/2:PI/2; if(Math.abs(z-IZ)<14) { /* crossing 百万遍 */ } } else { z=v.dir>0?IZ-5:IZ+5; x=v.s; ry=v.dir>0?0:PI; }
      _q.setFromAxisAngle(_v.set(0,1,0),ry); _m.compose(_v0.set(x,0.03,z),_q,_s.set(1,1,1)); if(v.bus) busMesh.setMatrixAt(bi++,_m); else carMesh.setMatrixAt(ci++,_m); }
    busMesh.instanceMatrix.needsUpdate=true; carMesh.instanceMatrix.needsUpdate=true; }
  // falling ginkgo leaves / petals near the camera
  { let any=false; for(let i=0;i<FALL_N;i++){ const l=falls[i]; if(!l.on){ continue; } any=true;
      if(l.p.distanceToSquared(cp)>4000) spawnFall(l,false);
      const g=H(l.p.x,l.p.z)+0.06;
      if(l.p.y>g){ l.p.y-=l.v*dt; l.p.x+=Math.sin(t*1.3+l.ph)*0.5*dt+0.15*dt; l.p.z+=Math.cos(t*1.1+l.ph)*0.35*dt; l.rot.x+=l.spin*dt; l.rot.y+=l.spin*0.7*dt; }
      else { l.p.y=g; l.rest+=dt; l.rot.x=-PI/2; if(l.rest>8) spawnFall(l,false); }
      _q.setFromEuler(l.rot); _m.compose(l.p,_q,_s.setScalar(l.p.distanceToSquared(cp)<1.2?0:1)); fallMesh.setMatrixAt(i,_m); }
    fallMesh.visible=any; fallMesh.count=SEASONS[seasonIdx].fallN; if(any) fallMesh.instanceMatrix.needsUpdate=true; }
  if(snowPts.visible){ for(let i=0;i<SNOW_N;i++){ const s=snowSeed[i]; s.y-=s.v*dt; s.x+=Math.sin(t*0.8+s.ph)*0.3*dt; if(s.y<-5) s.y+=30;
      snowPos[i*3]=((s.x-cp.x)%70+105)%70-35+cp.x; snowPos[i*3+1]=cp.y-5+((s.y%30)+30)%30; snowPos[i*3+2]=((s.z-cp.z)%70+105)%70-35+cp.z; }
    snowGeo.attributes.position.needsUpdate=true; snowPts.material.uniforms.uScale.value=renderer.domElement.height/2/Math.tan(camera.fov*PI/360); }
  // sound levels
  if(actx&&windGain){ const road=Math.min(Math.abs(cp.x-EX),Math.abs(cp.z-IZ));
    windGain.gain.value=soundOn?0.04+0.03*Math.sin(t*0.3):0; trafficGain.gain.value=soundOn?0.1*sm(140,10,road)+0.015:0;
    chirpT-=dt; if(chirpT<0){ chirpT=R(1.5,5); if(SEASONS[seasonIdx].key!=='winter'&&timeIdx===0) chirp(); } }
  // markers & labels
  HS.forEach(h=>{
    if(!h.markerObj) return; const g=h.markerObj; const d=cp.distanceTo(g.position);
    g.position.y=g.userData.base+Math.sin(t*2+h.idx)*0.12; g.children[0].rotation.y=t*1.2;
    const s=Math.max(0.6,Math.min(14,d*0.035)); g.scale.setScalar(s); g.visible=d>2.5;
    const el=h.label; tmp.copy(g.position); tmp.y+=0.6*s; tmp.project(camera);
    const aerial=cp.y>30;
    if(!labelsOn||tmp.z>1||d<2.5||d>1200||(!aerial&&d>90&&!(cur>=0&&HS[cur]===h))){ setLbl(el,false); return; }
    setLbl(el,true,(tmp.x+1)/2*innerWidth,(1-tmp.y)/2*innerHeight,d>500?0.7:1);
  });
  perfShadows(t);
  if(quality==='high'&&composer) composer.render(); else renderer.render(scene,camera);
  if(!fpsChecked&&!window.__noAutoQuality&&$('#intro').classList.contains('gone')){ if(PERF.iv<34){ fpsAcc+=dt; fpsN++; } if(fpsAcc>5){ fpsChecked=true; if(fpsN/fpsAcc<24&&quality==='high'){ setQuality('std'); toast('已自动切换为标准画质以保持流畅'); } } }
  perfQueue();
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

for(const k of ['plaster','stucco']) M[k].envMapIntensity=0.4;
scene.traverse(o=>{ const m=o.material; if(m&&m.isMeshStandardMaterial&&m.envMapIntensity===1) m.envMapIntensity=0.75; });
setQuality(LOW_END?'std':'high');
applySeason();
frame();
$('#loading').textContent='场景已就绪';
$('#iTour').onclick=()=>{ $('#intro').classList.add('gone'); goStop(0); };
$('#iFree').onclick=()=>{ $('#intro').classList.add('gone'); showOverview(); };
window.__kyotou={perf:()=>({fps:Math.round(1000/PERF.iv),quality,frames:PERF.n|0}),HS,goStop,jump:i=>{ goStop(i); if(fly) fly.start=-1e9; },showOverview,scene,renderer,setQuality,camera,controls,flyTo,nextOrita,
  setSeason:i=>{ seasonIdx=i; applySeason(); }, setTime:i=>{ timeIdx=i; applyTime(); },
  stats:()=>({cards:Object.fromEntries(Object.entries(FOREST).map(([k,v])=>[k,v.cards.items.length])),blobs:Object.fromEntries(Object.entries(FOREST).map(([k,v])=>[k,v.blob.items.length])),branches:FB.length,trees:BIG.length,boxes:Object.fromEntries(Object.entries(BX).map(([k,v])=>[k,v.length])),info:renderer.info.render})};
</script>
