<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都六角堂 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#a3271b; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button,input{font:inherit}
button{cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.act{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 0 0}
.act:hover{background:var(--red);color:#fff}
.wish{display:flex;gap:6px;margin-top:6px}
.wish input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font-size:13px}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(200,150,46,.08);font-size:14px}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#pVoice{margin:12px 0 0 6px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:6px 13px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,24,18,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:580px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#a3271b;border-color:#a3271b}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<body>
<div id="app"></div>
<div id="labels"></div>
<header id="brand"><h1>六角堂</h1><small>ROKKAKUDŌ · 紫雲山 頂法寺 · 京都六角通</small></header>
<div id="toolbar">
  <button class="tb" id="bOverview">总览布局</button>
  <button class="tb" id="bRoute">游览路线</button>
  <button class="tb on" id="bLabels">标签</button>
  <button class="tb" id="bSeason">季节：春樱</button>
  <button class="tb" id="bTime">时间：白昼</button>
  <button class="tb on" id="bVoice">讲解：中文</button>
  <button class="tb" id="bSound">声音：关</button>
  <button class="tb" id="bQuality">画质：高</button>
</div>
<aside id="panel" class="hidden">
  <button id="pClose" aria-label="关闭">×</button>
  <div id="pNum"></div>
  <h2 id="pTitle"></h2>
  <div id="pJp"></div>
  <div id="pBody"></div>
  <div id="pExtra"></div>
  <button id="pGo">前往此处</button><button id="pVoice" style="display:none">▶ 播放讲解</button>
</aside>
<nav id="tour">
  <button class="nav" id="tPrev">‹ 上一处</button>
  <div id="dots"></div>
  <span id="stopName">—</span>
  <button class="nav" id="tNext">下一处 ›</button>

<div id="tip">拖动旋转 · 滚轮缩放 · 右键平移 · 点击金色标记、建筑、鸽子或钟楼互动 · ← → 切换景点</div>
<div id="toast"></div>
<div id="intro">
  <div class="card">
    <h2>六角堂</h2>
    <div class="sub">紫雲山 頂法寺 · 京都のへそ · 伝 587</div>
    <p>在京都市中心、写字楼环绕的六角通上，藏着一座平面呈六角形的观音堂。<br>
    相传圣德太子在此池中沐浴而建堂；寺里世代向观音供花的僧人住在池边，<br>称为“池坊”，日本花道由此发端。从山门进去，看看京都的“肚脐”。</p>
    <div class="btns">
      <button class="main" id="iTour">从山门开始参观</button>
      <button id="iFree">先看整体布局</button>
    </div>
    <div id="loading">正在生成场景……</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(587060);
const R = (a,b)=>a+(b-a)*rand();
const pickA = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;
const V3 = THREE.Vector3;
const smoothstep01=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.08, 2500);
camera.position.set(48,58,72);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.62; controls.minDistance = 0.3; controls.maxDistance = 300;
controls.target.set(0,0,-4);

const U = { uTime:{value:0}, uDusk:{value:0} };

/* ---------------- site plan (x = east, z = south, metres) ----------------
   六角通 runs east–west at z≈26–32; the 山門 opens south onto it at x=0.
   本堂 (hexagon) centre (0,-2) with the 拝堂 in front; pond and 太子堂 behind (north);
   池坊会館 north of the pond; 鐘楼 diagonally across the street.                  */
const HC={x:0,z:-2};
const POND={x:-2,z:-23,rx:8.5,rz:5.2};
const pondWob=a=>1+0.1*Math.sin(a*3+0.7)+0.06*Math.sin(a*5+2.1);
function pondE(x,z){ const a=Math.atan2((z-POND.z)/POND.rz,(x-POND.x)/POND.rx); return Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz)/pondWob(a); }
function H(x,z){ const e=pondE(x,z); if(e>1.2) return 0; return -1.0*sm(1.12,0.72,e); }
const WATER_Y=-0.3;

/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3a2a20',{roughness:.75}),
  woodMid:std('#6b4c33'),
  woodLight:std('#9b7a55',{roughness:.7}),
  woodFloor:std('#6f5139'),
  woodRed:std('#a8321f',{roughness:.6}),
  plaster:std('#ece5d4',{roughness:.95}),
  paper:std('#f4eedf',{roughness:.9,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  roof:std('#4f5156',{roughness:.62,side:THREE.DoubleSide}),
  soffit:std('#5a3f2c',{roughness:.85,side:THREE.DoubleSide}),
  roofDark:std('#33353a',{roughness:.6}),
  stone:std('#8f8b83',{roughness:.95}),
  stoneDark:std('#615e58',{roughness:.95}),
  granite:std('#a8a49a',{roughness:.9}),
  foundation:std('#77726a'),
  gold:std('#c99a3a',{roughness:.35,metalness:.85,emissive:new THREE.Color('#7a4a10'),emissiveIntensity:0.15}),
  bronze:std('#5c6a58',{roughness:.55,metalness:.6}),
  bark:std('#4a3b30',{roughness:1}),
  willowBark:std('#5a4a3c',{roughness:1}),
  lanternGlow:std('#d8c9a0',{emissive:new THREE.Color('#ffb24d'),emissiveIntensity:0}),
  chochin:std('#f2e8d2',{roughness:.8,emissive:new THREE.Color('#ffaa55'),emissiveIntensity:0.05}),
  black:std('#1d1b19',{roughness:.6}),
  white:std('#f2f0ea',{roughness:.7}),
  rope:std('#c9b27a',{roughness:1}),
  glass:new THREE.MeshPhysicalMaterial({color:'#bcd2da',roughness:0.05,metalness:0,transmission:0,transparent:true,opacity:0.22,depthWrite:false,side:THREE.DoubleSide}),
  steel:std('#9aa1a6',{roughness:.35,metalness:.8}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;
let _pk=0;
// generic onBeforeCompile patcher (world-space varyings, optional sway, colour / roughness / normal / emissive hooks)
function patchMat(mat,o){
  const key='pm'+(_pk++); mat.customProgramCacheKey=()=>key;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uDusk=U.uDusk; Object.assign(sh.uniforms,o.uniforms||{});
    let v=sh.vertexShader, f=sh.fragmentShader;
    v=v.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+(o.vHead||''));
    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 dwp=vec4(transformed,1.0); vec3 dwn=objectNormal;
      #ifdef USE_INSTANCING
        dwp=instanceMatrix*dwp; dwn=mat3(instanceMatrix)*dwn;
      #endif
      vW=(modelMatrix*dwp).xyz; vWN=normalize(mat3(modelMatrix)*dwn);
      ${o.vBegin||''}`);
    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float swk=${o.sway};
      float gust=0.75+0.45*sin(uTime*0.37+mvPosition.x*0.05)*sin(uTime*0.23+1.7);
      mvPosition.x += sin(uTime*1.3+mvPosition.x*0.35+mvPosition.z*0.21)*swk*gust;
      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75*gust;
      mvPosition.y += sin(uTime*2.1+mvPosition.x*1.7)*swk*0.12;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    f=f.replace('#include <common>','#include <common>\nuniform float uTime; uniform float uDusk;\nvarying vec3 vW; varying vec3 vWN;\n'+NOISE_GLSL+(o.fHead||''));
    if(o.color) f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+o.color);
    if(o.rough) f=f.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+o.rough);
    if(o.normal) f=f.replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+o.normal);
    if(o.emissive) f=f.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n'+o.emissive);
    sh.vertexShader=v; sh.fragmentShader=f;
  };
  return mat;
}
const bumpGLSL=(freq,amt)=>`{ vec3 q=vW*${freq.toFixed(2)}; vec3 pn=vec3(vnoise(q),vnoise(q+17.1),vnoise(q+31.7))-0.5; normal=normalize(normal+pn*${amt.toFixed(2)}); }`;
// screen-space derivative bump mapping from a procedural height (world metres)
const bumpH=(hexpr,k)=>`{ vec3 bp=-vViewPosition; vec3 dpx=dFdx(bp), dpy=dFdy(bp); float bh=(${hexpr})*${k.toFixed(3)};
  float bhx=dFdx(bh), bhy=dFdy(bh); vec3 r1=cross(dpy,normal), r2=cross(normal,dpx); float det=dot(dpx,r1);
  vec3 gr=sign(det)*(bhx*r1+bhy*r2); normal=normalize(abs(det)*normal-gr); }`;
function leafy(mat,freq,amt,ca,trans=0.12){
  return patchMat(mat,{
    color:`float ln=fbm(vW*${freq.toFixed(2)}); diffuseColor.rgb*=(1.0-${ca.toFixed(2)})+${(ca*2).toFixed(2)}*ln;
           diffuseColor.rgb*=mix(0.55,1.05,smoothstep(-0.5,0.7,vWN.y));`,
    normal:bumpGLSL(freq*2.3,amt),
    emissive:`totalEmissiveRadiance+=diffuseColor.rgb*${trans.toFixed(2)};`});
}
function woodGrain(mat,amp){ return patchMat(mat,{color:`diffuseColor.rgb*=1.0-${amp.toFixed(2)}+${(amp*2).toFixed(2)}*fbm(vec3(vW.x*1.5,vW.y*9.0,vW.z*1.5)+vec3(vW.z*3.0,0.,vW.x*3.0));
  diffuseColor.rgb*=0.9+0.1*smoothstep(0.2,0.0,abs(fract(vW.y*0.5)-0.5));`}); }
// roof tiles: aT = (metres along the eave, metres up the slope)
patchMat(M.roof,{vHead:'attribute vec2 aT; varying vec2 vT;', vBegin:'vT=aT;', fHead:'varying vec2 vT;',
  color:`float tu=fract(vT.x*3.4+0.5*step(0.5,fract(vT.y*0.0))); float tv=fract(vT.y*3.0);
    float crest=0.5-0.5*cos(tu*6.2832);
    diffuseColor.rgb*=0.6+0.45*crest;
    diffuseColor.rgb*=0.8+0.2*smoothstep(0.0,0.14,tv);
    diffuseColor.rgb*=0.84+0.3*fbm(vW*0.7+vec3(floor(vT.x*3.4)*0.37,0.,0.));
    float lich=smoothstep(0.62,0.84,fbm(vW*0.45+3.0)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.36,0.37,0.3),lich*0.35);
    diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.2,0.19,0.18),smoothstep(0.6,0.0,vT.y)*0.25);`,
  rough:`roughnessFactor=mix(0.38,0.75,fbm(vW*1.3));`,
  normal:bumpH('(0.5-0.5*cos(fract(vT.x*3.4)*6.2832))*0.045+smoothstep(0.86,1.0,fract(vT.y*3.0))*0.018',1.0)});
for(const k of ['woodDark','woodMid','woodLight','woodFloor','bark','soffit']) woodGrain(M[k],k==='bark'?0.3:0.15);
patchMat(M.willowBark,{color:`diffuseColor.rgb*=0.6+0.6*fbm(vec3(vW.x*9.,vW.y*1.6,vW.z*9.));`,normal:bumpGLSL(9.0,0.9)});
patchMat(M.woodRed,{color:`diffuseColor.rgb*=0.85+0.22*fbm(vW*2.2); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.35,0.2,0.15),smoothstep(0.62,0.85,fbm(vW*1.1+5.))*0.4);`});
patchMat(M.plaster,{color:`diffuseColor.rgb*=0.92+0.1*fbm(vW*1.7); diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(0.85,0.82,0.75),smoothstep(0.9,0.0,vW.y)*0.5);`});
for(const k of ['stone','stoneDark','granite','foundation']) patchMat(M[k],{color:`diffuseColor.rgb*=0.78+0.42*fbm(vW*3.2); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.26,0.31,0.16),smoothstep(0.5,0.95,vWN.y)*smoothstep(0.5,0.7,fbm(vW*1.7))*0.5);`, normal:bumpGLSL(6.0,0.3)});
patchMat(M.bronze,{color:`diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.3,0.5,0.42),smoothstep(0.45,0.75,fbm(vW*4.0))*0.55); diffuseColor.rgb*=0.8+0.3*fbm(vW*9.0);`, rough:`roughnessFactor=mix(0.35,0.8,fbm(vW*5.0));`});

function mapleLeafGeo(size){
  const pts=[], lobes=[[-150,0.42],[-100,0.66],[-50,0.9],[0,1.0],[50,0.9],[100,0.66],[150,0.42]];
  pts.push(new THREE.Vector2(0,-0.08));
  lobes.forEach(([a,r],i)=>{ const ar=a*PI/180; pts.push(new THREE.Vector2(Math.sin(ar)*r,Math.cos(ar)*r));
    if(i<lobes.length-1){ const an=(a+25)*PI/180; pts.push(new THREE.Vector2(Math.sin(an)*0.34,Math.cos(an)*0.34)); } });
  const g=new THREE.ShapeGeometry(new THREE.Shape(pts)); g.scale(size,size,size); return g;
}
function lanceLeafGeo(len,w){
  return new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(0,0),new THREE.Vector2(w,len*0.3),new THREE.Vector2(w*0.7,len*0.65),new THREE.Vector2(0,len),new THREE.Vector2(-w*0.7,len*0.65),new THREE.Vector2(-w,len*0.3)]));
}
function diamondLeafGeo(len,w){ return new THREE.ShapeGeometry(new THREE.Shape([new THREE.Vector2(0,0),new THREE.Vector2(w,len*0.38),new THREE.Vector2(0,len),new THREE.Vector2(-w,len*0.38)])); }
function blossomGeo(r){ const g=new THREE.CircleGeometry(r,10); const p=g.attributes.position;
  for(let i=1;i<p.count;i++){ const x=p.getX(i),y=p.getY(i),a=Math.atan2(y,x),k=0.45+0.55*Math.pow(Math.abs(Math.cos(a*2.5)),0.6); p.setXY(i,x*k,y*k); }
  // a pale centre, pink petals
  const ca=new Float32Array(p.count*3); for(let i=0;i<p.count;i++){ const k=i===0?0.82:1; ca[i*3]=k; ca[i*3+1]=k*(i===0?0.75:1); ca[i*3+2]=k*(i===0?0.6:1); } g.setAttribute('color',new THREE.BufferAttribute(ca,3)); return g; }
function withColor(g,k,kr=1){ const cnt=g.attributes.position.count, ca=new Float32Array(cnt*3); for(let j=0;j<cnt;j++){ ca[j*3]=k*kr; ca[j*3+1]=k; ca[j*3+2]=k*0.95; } g.setAttribute('color',new THREE.BufferAttribute(ca,3)); return g; }
function leafCluster(leafGeo,n,spread,tilt,shade=0.25){
  const parts=[]; const qq=new THREE.Quaternion(), ee=new THREE.Euler(), mm=new THREE.Matrix4();
  for(let i=0;i<n;i++){
    const g=leafGeo.clone(); const a=i/n*6.283+R(-0.3,0.3), r=R(0.25,1)*spread;
    ee.set(-PI/2+R(-tilt,tilt),R(-0.4,0.4),a); qq.setFromEuler(ee);
    mm.compose(new V3(Math.cos(a)*r,R(-0.03,0.05),Math.sin(a)*r),qq,new V3(1,1,1)); g.applyMatrix4(mm);
    if(!g.attributes.color) withColor(g,1-shade+R(0,shade*1.6),R(0.95,1.08));
    parts.push(g.index?g.toNonIndexed():g);
  }
  const out=mergeGeometries(parts); out.computeVertexNormals(); return out;
}
function canopyNormals(g,k=0.8){ const n=g.attributes.normal; for(let i=0;i<n.count;i++){ _v0.set(n.getX(i),Math.abs(n.getY(i))+k,n.getZ(i)).normalize(); n.setXYZ(i,_v0.x,_v0.y,_v0.z);} return g; }
// one hanging strand (willow / weeping cherry). Hangs from y=0 down to y=-len, curving slightly outward (+x) at the top
function strandGeo(len,leafGeo,step,perStep,droop,spread=0.03){
  const parts=[], n=Math.floor(len/step);
  const qq=new THREE.Quaternion(), ee=new THREE.Euler(), mm=new THREE.Matrix4();
  const curve=t=>0.35*Math.sin(Math.min(1,t*4)*PI/2)+0.05*t;
  for(let i=1;i<n;i++){ const t=i/n, y=-t*len, x=curve(t);
    for(let k=0;k<perStep;k++){ const g=leafGeo.clone(); const side=(i+k)%2?1:-1;
      ee.set(R(-0.4,0.4),R(0,6.28),PI+side*R(droop*0.5,droop)); qq.setFromEuler(ee);
      mm.compose(new V3(x+R(-spread,spread),y+R(-step*0.4,step*0.4),R(-spread,spread)),qq,new V3(1,1,1).multiplyScalar(R(0.75,1.15)*(1-0.35*t))); g.applyMatrix4(mm);
      if(!g.attributes.color) withColor(g,R(0.78,1.1),R(0.95,1.06));
      parts.push(g.index?g.toNonIndexed():g); } }
  // the twig itself as a thin ribbon
  const tw=[]; for(let i=0;i<n;i++){ const t0=i/n,t1=(i+1)/n; const x0=curve(t0),x1=curve(t1),y0=-t0*len,y1=-t1*len,w=0.006;
    tw.push(x0-w,y0,0, x0+w,y0,0, x1-w,y1,0, x0+w,y0,0, x1+w,y1,0, x1-w,y1,0); }
  const tg=new THREE.BufferGeometry(); tg.setAttribute('position',new THREE.Float32BufferAttribute(tw,3)); tg.computeVertexNormals(); withColor(tg,0.55,1.1);
  const ref=parts[0]; for(const name of Object.keys(ref.attributes)) if(!tg.attributes[name]) tg.setAttribute(name,new THREE.Float32BufferAttribute(new Float32Array(tg.attributes.position.count*ref.attributes[name].itemSize),ref.attributes[name].itemSize));
  parts.push(tg);
  const out=mergeGeometries(parts); out.computeVertexNormals();
  const nn=out.attributes.normal, pp=out.attributes.position; for(let i=0;i<nn.count;i++){ _v0.set(pp.getX(i)*0.4+nn.getX(i)*0.4,0.75,nn.getZ(i)*0.4+R(-0.3,0.3)).normalize(); nn.setXYZ(i,_v0.x,_v0.y,_v0.z); }
  return out;
}

/* ---------------- camera flight ---------------- */
let fly=null;
const V=a=>new V3(...a);
function flyTo(view,via){
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=V(view.p), t1=V(view.t);
  const d=p0.distanceTo(p1); const pts=[p0];
  const mid=p0.clone().lerp(p1,0.5); mid.y+=Math.min(14,d*0.2); mid.y=Math.max(mid.y,Math.min(p0.y,p1.y));
  if(d>6) pts.push(mid);
  if(via && p0.distanceTo(V(via))>3) pts.push(V(via));
  pts.push(p1);
  fly={curve:pts.length>2?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null,p0,p1,t0,t1,start:performance.now(),dur:Math.min(4200,Math.max(1300,900+d*45))};
  controls.enabled=false;
}
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function goStop(i){
  if(i<0||i>=HS.length) return;

  [...dots.children].forEach((b,k)=>{ b.classList.toggle('cur',k===i); b.classList.toggle('done',k<i); });
  $('#stopName').textContent=h.name;
  HS.forEach(x=>x.label&&x.label.classList.toggle('cur',x===h));
  routeMesh.visible=$('#bRoute').classList.contains('on');
  inOverview=false;

/* ---------------- narration: pre-generated Azure TTS (zh/en/ja), one shared <audio>, loaded on demand ---------------- */
const NARR_LANGS=[['off','讲解：关'],['zh','讲解：中文'],['en','讲解：English'],['ja','讲解：日本語']];
let narrLang='zh'; try{ const v=localStorage.getItem('kyotoNarrLang'); if(NARR_LANGS.some(l=>l[0]===v)) narrLang=v; }catch(e){}
const narrAu=new Audio(); narrAu.preload='none';
let narrId=null, narrPanelH=null, narrLast=null, narrErr=false;
function narrUI(){
  $('#bVoice').textContent=NARR_LANGS.find(l=>l[0]===narrLang)[1]; $('#bVoice').classList.toggle('on',narrLang!=='off');
  const b=$('#pVoice'), id=narrPanelH&&HS.includes(narrPanelH)?narrPanelH.id:null;
  b.style.display=narrLang!=='off'&&id?'':'none';
  b.textContent=narrErr&&narrLast===id?'讲解加载失败，点此重试':narrId===id&&!narrAu.paused?'❚❚ 暂停讲解':'▶ 播放讲解';
}
function narrate(id){
  narrAu.pause(); narrId=null; narrLast=id; narrErr=false; narrAu.muted=false;
  if(narrLang!=='off'&&id){ narrId=id; narrAu.src=`audio/${id}.${narrLang}.mp3`; narrAu.play().catch(()=>{ narrId=null; narrUI(); }); }
  narrUI();
}
function narrStop(){ narrAu.pause(); narrId=null; narrLast=null; narrUI(); }
// iOS/Safari only let a media element play after it has been started inside a tap: start it muted on the first tap so later stops can play
addEventListener('pointerdown',()=>{ if(narrAu.src) return; narrAu.muted=true; narrAu.src=`audio/${HS[0].id}.zh.mp3`; narrAu.play().then(()=>{ if(narrId===null){ narrAu.pause(); } narrAu.muted=false; },()=>{ narrAu.muted=false; }); },{once:true,capture:true});
const narrBusy=()=>narrId!==null&&!narrAu.paused;
narrAu.onplay=narrAu.onpause=narrUI;
narrAu.onended=()=>{ narrId=null; narrUI(); if(playing&&!fly) scheduleNext(1500); };
narrAu.onerror=()=>{ if(!narrAu.src||narrId===null) return; narrId=null; narrErr=true; narrUI(); if(playing&&!fly) scheduleNext(); };
$('#bVoice').onclick=()=>{
  narrLang=NARR_LANGS[(NARR_LANGS.findIndex(l=>l[0]===narrLang)+1)%NARR_LANGS.length][0];
  try{ localStorage.setItem('kyotoNarrLang',narrLang); }catch(e){}
  if(narrLang==='off') narrStop(); else if(cur>=0) narrate(HS[cur].id); else narrUI();
};
$('#pVoice').onclick=()=>{ const id=narrPanelH&&narrPanelH.id; if(!id) return; if(narrId===id) narrAu.paused?narrAu.play().catch(()=>{}):narrAu.pause(); else narrate(id); };
narrUI();
function setPlaying(v){ playing=v; $('#tPlay').classList.toggle('on',v); $('#tPlay').textContent=v?'❚❚ 暂停':'▶ 自动'; clearTimeout(playTimer); if(v&&!fly) scheduleNext(); if(v&&cur<0) goStop(0); }
function scheduleNext(d){ clearTimeout(playTimer); playTimer=setTimeout(()=>{ if(!playing||narrBusy()) return; if(cur<HS.length-1) goStop(cur+1); else setPlaying(false); },d??7500); }
$('#tPrev').onclick=()=>goStop(Math.max(0,cur-1));
$('#tNext').onclick=()=>goStop(Math.min(HS.length-1,cur+1));
$('#tPlay').onclick=()=>setPlaying(!playing);
$('#pClose').onclick=()=>{ $('#panel').classList.add('hidden'); narrStop(); };
$('#bOverview').onclick=showOverview;
$('#bRoute').onclick=e=>{ e.target.classList.toggle('on'); routeMesh.visible=inOverview||e.target.classList.contains('on'); };
let labelsOn=true; $('#bLabels').onclick=e=>{ labelsOn=!labelsOn; e.target.classList.toggle('on',labelsOn); markerGroup.visible=labelsOn; };
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight') $('#tNext').click(); else if(e.key==='ArrowLeft') $('#tPrev').click(); else if(e.key==='o'||e.key==='O') showOverview(); else if(e.key===' '){ e.preventDefault(); setPlaying(!playing);} });

    else { l.p.y=g; l.rest+=dt; l.rot.x=-PI/2; if(g<WATER_Y+0.05) l.p.x+=0.05*dt; if(l.rest>9) spawnFall(l,false); }
    _q.setFromEuler(l.rot); const nearCam=l.p.distanceToSquared(camera.position)<1.6; _m.compose(l.p,_q,_s.setScalar(nearCam?0:1)); fm.setMatrixAt(i,_m); }
  fm.instanceMatrix.needsUpdate=true;
  if(actx&&cityGain){ cityGain.gain.value=soundOn?0.05+0.12*sm(18,4,Math.abs(camera.position.z-29)):0; }
  // markers & labels
  HS.forEach(h=>{
    if(!h.markerObj) return; const g=h.markerObj; const d=camera.position.distanceTo(g.position);
    g.position.y=g.userData.base+Math.sin(t*2+h.idx)*0.12; g.children[0].rotation.y=t*1.2;
    const s=Math.max(0.6,Math.min(4,d*0.035)); g.scale.setScalar(s); g.visible=d>2.5;
    const el=h.label; tmp.copy(g.position); tmp.y+=0.6*s; tmp.project(camera);
    const aerial=camera.position.y>16;
    if(!labelsOn||tmp.z>1||d<2.5||d>190||(!aerial&&d>34&&!(cur>=0&&HS[cur]===h))){ setLbl(el,false); return; }
    setLbl(el,true,(tmp.x+1)/2*innerWidth,(1-tmp.y)/2*innerHeight,d>120?0.6:1);
  });
  perfShadows(t);
  if(quality==='high'&&composer) composer.render(); else renderer.render(scene,camera);
  if(!fpsChecked&&!window.__noAutoQuality&&$('#intro').classList.contains('gone')){ if(PERF.iv<34){ fpsAcc+=dt; fpsN++; } if(fpsAcc>5){ fpsChecked=true; if(fpsN/fpsAcc<24&&quality==='high'){ setQuality('std'); toast('已自动切换为标准画质以保持流畅'); } } }
  perfQueue();
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

for(const k of ['plaster','paper']) M[k].envMapIntensity=0.35;
scene.traverse(o=>{ const m=o.material; if(m&&m.isMeshStandardMaterial&&m.envMapIntensity===1) m.envMapIntensity=0.8; });
setQuality(LOW_END?'std':'high');
applySeason(); applyTime();
frame();
$('#loading').textContent='场景已就绪';
$('#iTour').onclick=()=>{ $('#intro').classList.add('gone'); goStop(0); };
$('#iFree').onclick=()=>{ $('#intro').classList.add('gone'); showOverview(); };
window.__rokkakudo={perf:()=>({fps:Math.round(1000/PERF.iv),quality,frames:PERF.n|0}),HS,goStop,showOverview,scene,renderer,setQuality,camera,controls,ringBell,scatterPigeons,pondMat};
</script>

setTimeout(()=>{ const l=document.getElementById('loading'); if(l && l.textContent.indexOf('就绪')<0) l.textContent='若长时间未加载，请检查网络能否访问 cdn.jsdelivr.net（Three.js）。'; },12000);
