<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都大原三千院 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#a3271b; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button,input{font:inherit}
button{cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.act{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 0 0}
.act:hover{background:var(--red);color:#fff}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(200,150,46,.08);font-size:14px}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,24,18,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:600px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#a3271b;border-color:#a3271b}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    <p>京都东北的山间盆地大原，雾气常年笼罩着杉林。<br>
    天台宗门迹寺院三千院就坐落在这里：青苔铺满庭园，平安时代的往生极乐院里，金色的阿弥陀三尊静静等待。<br>从参道“三千院道”出发，沿着吕川走进御殿门。</p>
    <div class="btns">
      <button class="main" id="iTour">从三千院道开始</button>
      <button id="iFree">先看整体布局</button>
    </div>

  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(3000);
const R = (a,b)=>a+(b-a)*rand();
const pickA = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;
const V3 = THREE.Vector3;
const smoothstep01=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.08, 6000);
camera.position.set(-80,105,128);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.62; controls.minDistance = 0.3; controls.maxDistance = 1400;
controls.target.set(45,8,-4);

const U = { uTime:{value:0}, uDusk:{value:0}, uSnow:{value:0} };

/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3a2a20',{roughness:.75}),
  woodMid:std('#6b4c33'),
  woodLight:std('#9b7a55',{roughness:.7}),
  woodNat:std('#7d6248',{roughness:.78}),
  woodFloor:std('#6f5139'),
  woodRed:std('#a8321f',{roughness:.6}),
  plaster:std('#ece5d4',{roughness:.95}),
  paper:std('#f4eedf',{roughness:.9,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  roof_tile:std('#4f5156',{roughness:.62,side:THREE.DoubleSide}),
  roof_shingle:std('#5e4a3a',{roughness:.9,side:THREE.DoubleSide}),
  roof_thatch:std('#7d6a4c',{roughness:1,side:THREE.DoubleSide}),
  fas_shingle:std('#4a3a2e',{roughness:.95}),
  fas_thatch:std('#6c5a3e',{roughness:1}),
  soffit:std('#5a3f2c',{roughness:.85,side:THREE.DoubleSide}),
  roofDark:std('#33353a',{roughness:.6}),
  shingleCap:std('#3e3128',{roughness:.9}),
  stone:std('#8f8b83',{roughness:.95}),
  stoneDark:std('#615e58',{roughness:.95}),
  granite:std('#a8a49a',{roughness:.9}),
  foundation:std('#77726a'),
  gold:std('#ffcf5e',{roughness:.3,metalness:0.88,side:THREE.DoubleSide,emissive:new THREE.Color('#b07818'),emissiveIntensity:0.3}),
  lacquer:std('#141210',{roughness:.3}),
  interior:std('#140f0c',{roughness:1}),
  bronze:std('#5c6a58',{roughness:.55,metalness:.6}),
  copper:std('#4f7a68',{roughness:.6,metalness:.4}),
  bark:std('#4a3b30',{roughness:1}),
  pineBark:std('#5a4334',{roughness:1}),
  lanternGlow:std('#d8c9a0',{emissive:new THREE.Color('#ffb24d'),emissiveIntensity:0}),
  chochin:std('#c8321f',{roughness:.8,emissive:new THREE.Color('#ff7744'),emissiveIntensity:0.05}),
  black:std('#1d1b19',{roughness:.6}),
  white:std('#f2f0ea',{roughness:.7}),
  rope:std('#c9b27a',{roughness:1}),
  bamboo:std('#a8955f',{roughness:.6}),
  felt:std('#b4241c',{roughness:1}),
  steel:std('#9aa1a6',{roughness:.35,metalness:.8}),
  asphalt:std('#46474a',{roughness:.9}),
  shu:std('#c43a22',{roughness:.55}),
  goldF:std('#e8b85a',{roughness:.35,metalness:.85}),
  roof_hiwada:std('#5a4232',{roughness:.92,side:THREE.DoubleSide}),
  fas_hiwada:std('#3e2e24',{roughness:.95}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;
let _pk=0;
// generic onBeforeCompile patcher (world-space varyings, sway, colour/roughness/normal/emissive hooks, and snow cover)
function patchMat(mat,o){
  const key='pm'+(_pk++); mat.customProgramCacheKey=()=>key;
  const sn=o.snow||[0.55,0.85,1.0];
  const SNOW=o.noSnow?'':`{ float sk=uSnow*snowK*${sn[2].toFixed(2)}*smoothstep(${sn[0].toFixed(2)},${sn[1].toFixed(2)},vWN.y)*smoothstep(0.28,0.5,fbm(vW*1.7)*0.6+0.4*uSnow+0.08);
     diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.9,0.92,0.96),clamp(sk,0.,1.)); gSnowAmt=clamp(sk,0.,1.); }`;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uDusk=U.uDusk; sh.uniforms.uSnow=U.uSnow; Object.assign(sh.uniforms,o.uniforms||{});
    let v=sh.vertexShader, f=sh.fragmentShader;
    v=v.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+(o.vHead||''));
    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 dwp=vec4(transformed,1.0); vec3 dwn=objectNormal;
      #ifdef USE_INSTANCING
        dwp=instanceMatrix*dwp; { mat3 im=mat3(instanceMatrix); vec3 sc=vec3(dot(im[0],im[0]),dot(im[1],im[1]),dot(im[2],im[2])); dwn=im*(dwn/max(sc,vec3(1e-6))); }
      #endif
      vW=(modelMatrix*dwp).xyz; vWN=normalize(mat3(modelMatrix)*dwn);
      ${o.vBegin||''}`);
    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float swk=${o.sway};
      float gust=0.75+0.45*sin(uTime*0.37+mvPosition.x*0.05)*sin(uTime*0.23+1.7);
      mvPosition.x += sin(uTime*1.3+mvPosition.x*0.35+mvPosition.z*0.21)*swk*gust;
      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75*gust;
      mvPosition.y += sin(uTime*2.1+mvPosition.x*1.7)*swk*0.12;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    f=f.replace('#include <common>','#include <common>\nuniform float uTime; uniform float uDusk; uniform float uSnow;\nvarying vec3 vW; varying vec3 vWN; float snowK=1.0; float gSnowAmt=0.0;\n'+NOISE_GLSL+(o.fHead||''));
    f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+(o.color||'')+'\n'+SNOW);
    f=f.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+(o.rough||'')+'\nroughnessFactor=mix(roughnessFactor,0.82,gSnowAmt);');
    if(!o.noSnow) f=f.replace('#include <metalnessmap_fragment>','#include <metalnessmap_fragment>\nmetalnessFactor=mix(metalnessFactor,0.0,gSnowAmt);');
    if(o.normal) f=f.replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+o.normal);
    if(o.emissive) f=f.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n'+o.emissive);
    sh.vertexShader=v; sh.fragmentShader=f;
  };
  return mat;
}
const bumpGLSL=(freq,amt)=>`{ vec3 q=vW*${freq.toFixed(2)}; vec3 pn=vec3(vnoise(q),vnoise(q+17.1),vnoise(q+31.7))-0.5; normal=normalize(normal+pn*${amt.toFixed(2)}); }`;
const bumpH=(hexpr,k)=>`{ vec3 bp=-vViewPosition; vec3 dpx=dFdx(bp), dpy=dFdy(bp); float bh=(${hexpr})*${k.toFixed(3)};
  float bhx=dFdx(bh), bhy=dFdy(bh); vec3 r1=cross(dpy,normal), r2=cross(normal,dpx); float det=dot(dpx,r1);
  vec3 gr=sign(det)*(bhx*r1+bhy*r2); normal=normalize(abs(det)*normal-gr); }`;
function leafy(mat,freq,amt,ca,trans=0.12,snow){
  return patchMat(mat,{snow,
    color:`float ln=fbm(vW*${freq.toFixed(2)}); diffuseColor.rgb*=(1.0-${ca.toFixed(2)})+${(ca*2).toFixed(2)}*ln;
           diffuseColor.rgb*=mix(0.55,1.05,smoothstep(-0.5,0.7,vWN.y));`,
    normal:bumpGLSL(freq*2.3,amt),
    emissive:`totalEmissiveRadiance+=diffuseColor.rgb*${trans.toFixed(2)}*(1.0-gSnowAmt);`});
}
function woodGrain(mat,amp){ return patchMat(mat,{color:`diffuseColor.rgb*=1.0-${amp.toFixed(2)}+${(amp*2).toFixed(2)}*fbm(vec3(vW.x*1.5,vW.y*9.0,vW.z*1.5)+vec3(vW.z*3.0,0.,vW.x*3.0));
  diffuseColor.rgb*=0.9+0.1*smoothstep(0.2,0.0,abs(fract(vW.y*0.5)-0.5));`,snow:[0.7,0.95,0.9]}); }
// roof tiles / shingles / thatch: aT = (metres along the eave, metres up the slope)
patchMat(M.roof_tile,{vHead:'attribute vec2 aT; varying vec2 vT;', vBegin:'vT=aT;', fHead:'varying vec2 vT;',snow:[0.25,0.5,1.0],
  color:`float tu=fract(vT.x*3.4); float tv=fract(vT.y*3.0);
    float crest=0.5-0.5*cos(tu*6.2832);
    diffuseColor.rgb*=0.6+0.45*crest;
    diffuseColor.rgb*=0.8+0.2*smoothstep(0.0,0.14,tv);
    diffuseColor.rgb*=0.84+0.3*fbm(vW*0.7+vec3(floor(vT.x*3.4)*0.37,0.,0.));
    float lich=smoothstep(0.62,0.84,fbm(vW*0.45+3.0)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.36,0.37,0.3),lich*0.35);`,
  rough:`roughnessFactor=mix(0.38,0.75,fbm(vW*1.3));`,
  normal:bumpH('(0.5-0.5*cos(fract(vT.x*3.4)*6.2832))*0.045+smoothstep(0.86,1.0,fract(vT.y*3.0))*0.018',1.0)});
// 杮葺: thin cypress shingles laid in fine courses
patchMat(M.roof_shingle,{vHead:'attribute vec2 aT; varying vec2 vT;', vBegin:'vT=aT;', fHead:'varying vec2 vT;',snow:[0.2,0.45,1.0],
  color:`float cv=vT.y*11.0; float course=floor(cv); float tv=fract(cv);
    float sw=fract(vT.x*(5.0+hash3(vec3(course,1.,2.))*3.0)+hash3(vec3(course,5.,1.)));
    diffuseColor.rgb*=0.82+0.22*hash3(vec3(course,floor(vT.x*6.0+hash3(vec3(course,3.,3.))*3.0),7.));
    diffuseColor.rgb*=0.78+0.22*smoothstep(0.0,0.2,tv);
    diffuseColor.rgb*=0.9+0.1*smoothstep(0.0,0.05,sw);
    diffuseColor.rgb*=0.82+0.3*fbm(vec3(vT.x*0.5,vT.y*0.5,vW.y));
    float lich=smoothstep(0.6,0.85,fbm(vW*0.6+9.0)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.32,0.33,0.24),lich*0.4);`,

 {id:'sando',name:'三千院道·吕川',jp:'三千院道 · 呂川',marker:[-100,6,82],view:{p:E(-138,1.65,118),t:[-96,4,84]},
  text:`<p>从大原的巴士站往东北走，参道沿着一条叫“吕川”的小溪缓缓上坡，步行约10分钟到三千院。两旁是卖紫苏腌菜（柴渍）、各色渍物、抹茶甜点和土产的老铺，店头摆着一桶桶腌菜。</p>
  <p>大原是京都东北方向的山间盆地，自古是隐遁与修行之地。三千院南北各有一条小溪：南边的<b>吕川</b>与北边的<b>律川</b>，名字取自天台声明（佛教唱诵）的音律术语“吕”与“律”。大原是声明的修行中心，别称“鱼山”；日语形容口齿不清的“ろれつが回らない”（吕律不通），据说就源于此。</p>
  <p>点一下溪水可以看到涟漪。</p>`},
 {id:'gate',name:'御殿门',jp:'御殿門 · 穴太積の石垣',marker:[GATE.x,TERRACE_Y+9.5,GATE.z],view:{p:E(-80,1.65,-7),t:[-54,9.5,-10]},
  text:`<p>三千院的正门。门前高大的石垣出自近江坂本的“穴太众”之手：他们是以堆砌城郭石墙闻名的石匠集团，石块基本不加切割，按天然形状层层咬合，叫“穴太积”。石垣与门楼让三千院看上去像一座城郭，也显出“门迹寺院”（由皇族或摄关家子弟出任住持的寺院）的格调。进门后左手边是接待处，在这里买票，然后脱鞋进入客殿。</p>
  <p>门两侧土塀上的五条白线叫“筋塀”，五条是最高的等级，用于与皇室渊源深厚的寺院。</p>
  <p>三千院是天台宗三门迹之一（另两座是青莲院、妙法院），起源可追溯到传教大师最澄在比叡山东塔南谷所建的“圆融房”。此后几经迁移，明治时代以大原的“政所”为本坊，才正式称为“三千院”，名称取自梶井门迹的持佛堂“一念三千院”。</p>`},
 {id:'kyakuden',name:'客殿·聚碧园',jp:'客殿 · 聚碧園',marker:[-25,TERRACE_Y+3.2,3],view:{p:[-21.2,KYAKU.f+1.0,-13.6],t:[-24.5,TERRACE_Y+0.2,6]},
  text:`<p>进门后先进入客殿。坐在客殿里向南望，便是“聚碧园”：以水池为中心的池泉观赏式庭园，据传江户时代由茶人金森宗和修整，为京都市指定名胜。修剪成圆团的杜鹃层层叠叠，背后是高大的杉树，柱子与屋檐像画框一样框住庭园。</p>
  <p>客殿可以点一碗抹茶配点心，坐在缘侧边喝边看庭园。客殿的隔扇画出自明治时代京都画坛的画家之手。</p>`,acts:[['点一碗抹茶',()=>{ toast('一碗薄茶配一枚和果子，在聚碧园前慢慢喝完'); chime(); }]]},
 {id:'shinden',name:'宸殿',jp:'宸殿 · 御懺法講',marker:[HALLS.shinden.x,SHIN.top+2,HALLS.shinden.z],view:{p:E(28,1.65,7),t:[17,10.5,-17]},
  text:`<p>宸殿是三千院的主殿，1926年（大正15年）仿照京都御所的紫宸殿建造，用来举行三千院最重要的法会“御忏法讲”。御忏法讲始于平安时代的宫中，以天台声明的唱诵为中心，每年5月30日在这里举行。</p>
  <p>殿内供奉三千院的本尊药师琉璃光如来（秘佛）。宸殿正面的蔀户向上掀起，殿前向南铺开的，就是苔庭“有清园”。</p>`,acts:[['听一段声明',()=>shomyo()]]},
 {id:'yusei',name:'有清园',jp:'有清園 · 杉木立と苔',marker:[26,10,18],view:{p:[25,SHIN.f+1.25,-8.6],t:[35,5.5,30]},
  text:`<p>从宸殿的缘侧往南望，杉树与桧树笔直挺立，地面铺满青苔，这就是“有清园”：从宸殿前一直延伸到往生极乐院的池泉回游式庭园，也是京都市指定名胜。寺方介绍，园名取自中国南朝诗人谢灵运的诗句“山水有清音”。</p>
  <p>青苔要靠湿润的空气和树荫养护，大原盆地多雾，正适合青苔生长。春夏是一片新绿，秋天枫叶落满苔面，冬天积雪后整座庭园变白，四季景色完全不同。可以试试右上角的“季节”与“时间”，晨雾时杉林间会透下光束。</p>`,acts:[['晨雾中的杉林',()=>{ timeIdx=1; applyTime(); toast('大原的晨雾，光束从杉树间透下来'); }]]},
 {id:'ojo',name:'往生极乐院',jp:'往生極楽院 · 阿弥陀三尊（国宝）',marker:[HALLS.ojo.x,OJO.top+1.6,HALLS.ojo.z],view:{p:E(38.6,2.0,48),t:[38,OJO.f+2.4,29]},
  text:`<p>苔庭深处这座小小的阿弥陀堂，是三千院最古老的建筑，平安时代末期创建，为重要文化财，屋顶是桧皮葺的入母屋造，入口开在山墙一侧（妻入）。寺传说是惠心僧都源信所建，一般认为是12世纪后半叶真如房尼为亡夫所建。</p>
  <p>堂内的阿弥陀三尊像是国宝：中央的阿弥陀如来结来迎印，左右的观音菩萨（双手捧莲台）与势至菩萨（合掌）上身前倾、跪坐，称为“大和坐”，像是正要起身迎接往生者。据像内墨书，造于1148年（久安4年）。为了容下高大的佛像，堂内顶棚做成中间隆起的“船底天井”，原本绘满极彩色的天女与菩萨。</p>`,acts:[['进入堂内看船底天井',()=>enterOjo()],['复原天井的彩绘',()=>toggleRestore()]]},
 {id:'jizo',name:'童地藏·弁天池',jp:'わらべ地蔵 · 弁天池',marker:[JIZO.x,H(JIZO.x,JIZO.z)+2.2,JIZO.z],view:{p:E(51.2,0.9,41.3),t:[51.5,H(JIZO.x,JIZO.z)+0.25,36.4]},
  text:`<p>往生极乐院南边、弁天池旁的苔地上，散落着几尊小小的石地藏：有的趴在苔上托着腮，有的并肩而坐，有的双手合十，脸上都带着微笑，这就是“童地藏”（わらべ地蔵），出自石雕家杉村孝之手。</p>
  <p>青苔慢慢爬上它们的头和肩膀，像是从苔庭里长出来的一样，是三千院最受欢迎的拍照点之一。点一下池面，看看涟漪。</p>`,acts:[['和童地藏打招呼',()=>{ jizoWave=2.5; toast('童地藏好像笑得更开心了'); chime(); }]]},
 {id:'benten',name:'弁财天',jp:'弁財天',marker:[BENZAI.x,BZ_Y+3.6,BENZAI.z],view:{p:E(54.6,1.65,42.4),t:[BENZAI.x,BZ_Y+1.2,BENZAI.z]},
  text:`<p>从童地藏继续往东，穿过朱红的鸟居、走上几级石阶，就是供奉弁财天的小祠。弁财天是掌管音乐、辩才与财富的女神，这里是“京都七福神”之一。</p>
  <p>按寺方境内图的顺路，从这里往北走，就到金色不动堂。不动堂的朱印（朱印1）同时写有“金色不动明王”和“弁财天”。</p>`},
 {id:'fudo',name:'金色不动堂',jp:'金色不動堂 · 朱印1',marker:[HALLS.fudo.x,FUDO.top+1.6,HALLS.fudo.z],view:{p:E(80,1.7,21),t:[80,FUDO.f+2.8,-6.5]},
  text:`<p>1989年（平成元年）建成的祈愿道场，堂前是铺着碎石的宽阔前庭，两座大石灯笼分立左右。本尊金色不动明王是秘佛，平时藏在厨子里，只在每年4月的不动明王大祭期间开扉约一个月。</p>
  <p>堂内每天都有护摩祈祷。这里也是领取朱印的地方之一（朱印1：金色不动明王·弁财天）。前庭东边的石阶往上，就是观音堂。</p>`},
 {id:'kannon',name:'观音堂·慈眼之庭',jp:'観音堂 · 小観音 · 慈眼の庭',marker:[HALLS.kannon.x,KANNON.top+1.6,HALLS.kannon.z],view:{p:[103.2,H(103.2,-4.8)+1.7,-4.8],t:[HALLS.kannon.x,KANNON.f+2.4,HALLS.kannon.z+2]},
  text:`<p>登上石阶，正面是1998年（平成10年）建成的观音堂，堂内安置着高约3米的金色观音像（朱印2：观音菩萨）。观音堂两旁的“小观音堂”里，层层排列着信众供奉的无数小观音像，金光点点。</p>
  <p>观音堂北边是“慈眼之庭”：二十五尊石雕菩萨散立在青苔上，表现观音的净土。顺路从这里往北下坡，去律川对岸的卖炭翁石佛。</p>`,acts:[['供奉一尊小观音',()=>offerKannon()]]},
 {id:'sekibutsu',name:'卖炭翁石佛',jp:'阿弥陀石仏（売炭翁石仏）',marker:[BAITAN.x,H(BAITAN.x,BAITAN.z)+5.2,BAITAN.z],view:{p:[63.2,H(63.5,-62)+1.6,-61.5],t:[BAITAN.x,H(BAITAN.x,BAITAN.z)+1.9,BAITAN.z]},
  text:`<p>从金色不动堂往北，走过架在律川上的石桥，对岸坐着一尊巨大的阿弥陀石佛，是镰仓时代的作品。相传这一带曾住着一位烧炭卖炭的老翁，当地人便称它“卖炭翁石佛”。</p>
  <p>律川是三千院北侧的小溪，和南侧的吕川一样，名字取自天台声明的音律术语。点一下溪水可以看到涟漪。</p>`},
 {id:'ajisai',name:'紫阳花苑',jp:'あじさい苑',marker:[56,H(56,-12)+5,-12],view:{p:E(52.2,1.7,-31),t:[50.6,H(50.6,-15)+0.6,-15]},
  text:`<p>回程从石佛折返，穿过往生极乐院东北边的山坡“紫阳花苑”往下走。杉林下的整片山坡种满了数千株绣球花（紫阳花），蓝、紫、粉、白成片相间，6月中旬到7月盛开，梅雨天里尤其好看。到了秋天，残留的花头会褪成带红晕的“秋色紫阳花”。</p>
  <p>花苑的小路一直通回弁财天下方的鸟居。</p>`,acts:[['看绣球花开（6月）',()=>{ seasonIdx=1; applySeason(); toast('梅雨时节，紫阳花开满山坡'); }]]},
 {id:'enyu',name:'圆融藏·出口',jp:'円融蔵 · 朱印3',marker:[HALLS.enyu.x,ENYU.top+1.6,HALLS.enyu.z],view:{p:E(-29,1.65,41),t:[-40,ENYU.f+2.4,56]},
  text:`<p>回程沿寺院南侧往西走，左手边南墙上的红色小门是“朱雀门”：往生极乐院还是本堂时的正门，现在关闭。再经过写经道场“圆融房”，就到了圆融藏。</p>
  <p>圆融藏是三千院的收藏库兼展示馆，2006年（平成18年）秋开馆。馆内按原尺寸复原了往生极乐院的船底天井：依据红外线调查，重现了当年用极彩色画成的天女与菩萨。这里也领取朱印（朱印3：药师如来·阿弥陀三尊，其他各种朱印也在这里受理）。看完沿西侧走回御殿门出寺。</p>`,acts:[['看复原的天井彩绘',()=>{ restoreTo=1; enterOjo(); toast('依据红外线调查复原的极彩色天井'); }]]},
];
const OVERVIEW={name:'三千院 全景',jp:'三千院門跡 · 京都市左京区大原来迎院町',view:{p:[-80,105,128],t:[45,8,-4]},
  text:`<p><b>三千院门迹</b>，天台宗三门迹之一，位于京都东北的大原。起源可追溯到最澄在比叡山建的圆融房，平安后期起由皇族子弟（法亲王）出任住持，几经迁移，明治时代定于大原。寺内有国宝阿弥陀三尊、重要文化财往生极乐院，以青苔、杉林与红叶著称。</p>
  <p>参观路线（依寺方境内图的箭头顺路）：<b>三千院道 → 御殿门·接待处 → 客殿·聚碧园 → 宸殿 → 有清园 → 往生极乐院 → 童地藏·弁天池 → 弁财天 → 金色不动堂 → 观音堂·慈眼之庭 → 卖炭翁石佛 → 紫阳花苑 → 圆融藏 → 御殿门出寺</b>。金色线为路线。</p>
  <p style="font-size:12px;color:#7a6f63">注：场景依据公开资料做示意复原。各建筑的先后顺序与大致方位参照实际，尺寸、坡度、树木与参道商店为推定。</p>`};

const nearView=(x,z,r)=>VIEWPTS.some(([vx,vz])=>Math.hypot(x-vx,z-vz)<r)||VIEWLANES.some(([ax,az,bx_,bz])=>segDist(x,z,ax,az,bx_,bz)<r*0.55);

/* ================= trees, moss, hydrangeas ================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const CHUNKED=[];
function makeChunks(geo,mat,items,o={}){
  const band=o.band??60, groups={}; items.forEach((it,i)=>{ const k=Math.floor(it.p[2]/band)+'_'+Math.floor(it.p[0]/(o.bandX??60)); (groups[k]??=[]).push(i); });
  const list=[]; for(const k in groups){ const idx=shuffle(groups[k]); const im=makeInst(geo,mat,idx.map(i=>items[i]),o.shadow??true); im.userData.idx=idx; im.userData.full=idx.length; list.push(im); }
  const ch={list,items,lod:o.lod??1}; CHUNKED.push(ch); return ch;
}
function recolor(ch,fn){ for(const im of ch.list){ im.userData.idx.forEach((ii,j)=>im.setColorAt(j,fn(ch.items[ii],ii))); if(im.instanceColor) im.instanceColor.needsUpdate=true; } }
function setChunkVisible(ch,v){ for(const im of ch.list) im.visible=v; }

// bark: cedar is reddish and stringy in long vertical strips; maple bark is smooth and grey

  color:`float ang=atan(vWN.z,vWN.x); float str=vnoise(vec3(ang*9.0,vW.y*0.35,vW.x*0.2+vW.z*0.2));
    float isSugi=step(2.6,vColor.r/(vColor.b+0.005));
    diffuseColor.rgb*=mix(0.8+0.3*fbm(vW*2.0),0.6+0.55*smoothstep(0.2,0.75,str),isSugi);
    float moss=smoothstep(2.5,0.0,vW.y-0.0)*0.0+smoothstep(0.1,-0.7,vWN.z)*0.35*smoothstep(0.42,0.65,fbm(vW*1.9+3.0));
    diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.25,0.33,0.13)*(0.8+0.4*vnoise(vW*9.0)),clamp(moss,0.,0.7));`,
  normal:bumpH('smoothstep(0.2,0.75,vnoise(vec3(atan(vWN.z,vWN.x)*9.0,vW.y*0.35,vW.x*0.2+vW.z*0.2)))*0.035+vnoise(vW*7.0)*0.01',1.0)});
const FB=[];
function fbranch(a,b,r,c){ FB.push([a.clone(),b.clone(),r,c]); }
function flushForestBranches(){
  const mkGeo=(rs,hs,open)=>{ const g=new THREE.CylinderGeometry(1,1,1,rs,hs,open); g.translate(0,0.5,0); const pp=g.attributes.position;

function flyTo(view){

  const d=p0.distanceTo(p1); const pts=[p0]; const ground=isGround(p0)&&isGround(p1);
  if(ground&&d>12){ let [i0,d0]=walkIdx(p0.x,p0.z), [i1,d1]=walkIdx(p1.x,p1.z);
    if(walkAt!==null){ const q=WALK[walkAt], dq=Math.hypot(q[0]-p0.x,q[1]-p0.z); if(dq<30){ i0=walkAt; d0=dq; } }
    if(view.wi!==undefined){ i1=view.wi; d1=Math.hypot(WALK[i1][0]-p1.x,WALK[i1][1]-p1.z); }
    if(d0<30&&d1<30&&Math.abs(i1-i0)>1){ const st=i1>i0?1:-1; for(let i=i0+st;i!==i1;i+=st){ const [x,z]=WALK[i]; const q=new V3(x,H(x,z)+1.75,z); if(q.distanceTo(p0)>2.5&&q.distanceTo(p1)>2.5) pts.push(q); } } }
  if(pts.length===1&&d>6){ const mid=p0.clone().lerp(p1,0.5); mid.y+=Math.min(60,d*0.25); mid.y=Math.max(mid.y,Math.min(p0.y,p1.y)); pts.push(mid); }
  pts.push(p1);
  const curve=pts.length>2?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null; const L=curve?curve.getLength():d;
  const walk=ground&&pts.length>3; walkAt=view.wi??null;
  fly={curve,p0,p1,t0,t1,start:performance.now(),dur:Math.min(walk?16000:6000,Math.max(1400,900+L*(walk?38:28))),ground:walk};
  controls.enabled=false;
}

let actx=null, soundOn=false, waterGain=null, windGain=null, cicadaGain=null;
function noiseBuf(sec,lp){ const len=actx.sampleRate*sec, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=lp?(last+0.02*w)/1.02:w; d[i]=lp?last*3.5:w*0.5; } return buf; }

  const s2=actx.createBufferSource(); s2.buffer=noiseBuf(4,true); s2.loop=true; const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  windGain=actx.createGain(); windGain.gain.value=0; s2.connect(lp).connect(windGain).connect(actx.destination); s2.start();
  const s3=actx.createBufferSource(); s3.buffer=noiseBuf(2,false); s3.loop=true; const hp=actx.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=5200; hp.Q.value=3;

  cicadaGain=actx.createGain(); cicadaGain.gain.value=0; s3.connect(hp).connect(am).connect(cicadaGain).connect(actx.destination); s3.start();
}

  for(let i=0;i<n;i++){ const o=actx.createOscillator(), g=actx.createGain(); const t0=t+i*0.11; o.frequency.setValueAtTime(base,t0); o.frequency.exponentialRampToValueAtTime(base*(1.3+Math.random()*0.3),t0+0.06);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.05,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.08); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.1); } }

function chime(){ bellTone(1560,0.06,2.5); }
// 声明: a few male voices sustaining a slow, ornamented line through vowel formants
function shomyo(){ toast('天台声明：吕与律的旋律在宸殿里回响'); if(!soundOn){ toast('先打开右上角的“声音”，再听声明'); return; } if(!actx) return;
  const t=actx.currentTime, notes=[0,0,2,0,-2,0,3,2,0], out=actx.createGain(); out.gain.value=0.0001; out.connect(actx.destination); out.gain.exponentialRampToValueAtTime(0.16,t+1.5); out.gain.setValueAtTime(0.16,t+15); out.gain.exponentialRampToValueAtTime(0.0001,t+18);

/* ---------------- picking ---------------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downPos=null;

  if(!downPos||Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>6) return;

  if(hit.water&&hit.point){ addRipple(hit.point.x,hit.point.z,1); chime(); if(hit.hs==='sando'||hit.hs==='sekibutsu'||hit.hs==='yusei'||hit.hs==='kyakuden') return; }

function pick(e){

const reflCam=new THREE.PerspectiveCamera(); const _rp=new THREE.Plane(), _cp=new THREE.Vector4(), _qv=new THREE.Vector4();
let reflScale=0.4, reflFrame=0, reflNear=false;
function renderReflection(){
  const cp=camera.position; if(cp.y<WATER_Y+0.05||!REFL.on.value||!reflNear){ return; }
  if(quality!=='high'&&(reflFrame++%2)) return;
  const w=Math.max(64,Math.floor(renderer.domElement.width*reflScale)), h=Math.max(64,Math.floor(renderer.domElement.height*reflScale));
  if(reflRT.width!==w||reflRT.height!==h) reflRT.setSize(w,h);
  reflCam.position.set(cp.x,2*WATER_Y-cp.y,cp.z);
  const look=new V3(0,0,-1).applyQuaternion(camera.quaternion).add(cp); look.y=2*WATER_Y-look.y;
  const up=new V3(0,1,0).applyQuaternion(camera.quaternion); up.y=-up.y;
  reflCam.up.copy(up); reflCam.lookAt(look); reflCam.far=260; reflCam.updateMatrixWorld();
  reflCam.projectionMatrix.copy(camera.projectionMatrix); reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock(); const tmp=new V3();
let composer=null, gtao=null, quality='high';
function buildComposer(){

  composer=new EffectComposer(renderer,rt);

$('#bQuality').onclick=()=>setQuality(quality==='high'?'std':'high');
let fpsAcc=0,fpsN=0,fpsChecked=false, shadowSpan=0, chirpT=3;

  { const span=Math.round(Math.min(130,Math.max(30,cp.distanceTo(controls.target)*1.2))/4)*4;

  { let any=false; for(let i=0;i<FALL_N;i++){ const l=falls[i]; if(!l.on){ _m.makeScale(0,0,0); fallMesh.setMatrixAt(i,_m); continue; } any=true;
      if(l.p.distanceToSquared(cp)>3000) spawnFall(l,false);

      if(l.p.y>g){ l.p.y-=l.v*dt; l.p.x+=Math.sin(t*1.3+l.ph)*0.5*dt+0.12*dt; l.p.z+=Math.cos(t*1.1+l.ph)*0.35*dt; l.rot.x+=l.spin*dt; l.rot.y+=l.spin*0.7*dt; }
