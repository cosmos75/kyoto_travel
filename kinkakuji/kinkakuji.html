<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都金阁寺 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#a3271b; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button,input{font:inherit}
button{cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.act{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 0 0}
.act:hover{background:var(--red);color:#fff}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(200,150,46,.08);font-size:14px}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#pVoice{margin:12px 0 0 6px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:6px 13px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,24,18,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:600px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#a3271b;border-color:#a3271b}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
</style>

<div id="app"></div>

<div id="intro">
  <div class="card">
    <h2>金閣寺</h2>
    <div class="sub">北山 鹿苑禅寺 · 舎利殿 · 1397</div>
    <p>京都北山脚下，一座贴满金箔的三层楼阁立在镜湖池畔，倒影与真身相映。<br>
    这里原是室町幕府将军足利义满的山庄“北山殿”，义满死后改为禅寺。<br>从总门进去，沿着单向的回游路线走一圈。</p>
    <div class="btns">
      <button class="main" id="iTour">从总门开始参观</button>
      <button id="iFree">先看整体布局</button>
    </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(1397);
const R = (a,b)=>a+(b-a)*rand();
const pickA = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;
const V3 = THREE.Vector3;
const smoothstep01=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.08, 3000);
camera.position.set(80,70,110);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.62; controls.minDistance = 0.3; controls.maxDistance = 420;
controls.target.set(10,0,0);

const U = { uTime:{value:0}, uDusk:{value:0}, uSnow:{value:0} };

/* ---------------- site plan (x = east, z = south, metres; Kyōko-chi water level y = 0) ----------------
   金閣 (舎利殿) stands at the origin on the north shore, facing south across 鏡湖池.
   The 総門 opens east at x≈114; the approach runs west past the 鐘楼 and 庫裏 to the pond's SE shore.
   The garden path then follows the east shore to the pavilion, passes the 方丈 (陸舟の松), goes behind
   the pavilion (銀河泉・巌下水), climbs past 龍門滝 to 安民沢 and 夕佳亭, and comes down to 不動堂.  */
const WATER_Y=0;
const PE=[[-18,30,40,18],[14,27,14,12],[2,12,13,8.5],[-12,6,10,8],[-52,22,14,12]];
function pondE(x,z){ let e=9; for(const [cx,cz,rx,rz] of PE){ const dx=(x-cx)/rx, dz=(z-cz)/rz; const a=Math.atan2(dz,dx); const w=1+0.06*Math.sin(a*3+cx)+0.045*Math.sin(a*5+cz*0.3); const d=Math.hypot(dx,dz)/w; if(d<e) e=d; } return e; }
const ISL=[
  {x:-24,z:28,rx:15,rz:5.5,h:0.9,name:'ashi'},  // 葦原島
  {x:-46,z:16,rx:4.2,rz:2.5,h:0.75,name:'tsuru'}, // 鶴島
  {x:-40,z:34,rx:4.6,rz:3.1,h:0.75,name:'kame'},  // 亀島
  {x:8,z:29,rx:2.4,rz:1.6,h:0.55,name:'awaji'},  // 淡路島
  {x:-5,z:15.5,rx:2.0,rz:1.4,h:0.45,name:'dekame'},
];
const ANM={x:0,z:-62,rx:12,rz:6.5};   // 安民沢
const KNOLL={x:42,z:-53};             // 夕佳亭の丘
const STREAM=[[14,-34.5],[10,-29],[4,-22],[-2,-15],[-9,-9],[-13,-2],[-14,4]];
function segDist(px,pz,ax,az,bx_,bz){ const vx=bx_-ax, vz=bz-az; const t=Math.max(0,Math.min(1,((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz))); return Math.hypot(px-ax-vx*t,pz-az-vz*t); }
function polyDist(px,pz,P){ let d=1e9; for(let i=0;i<P.length-1;i++){ const q=segDist(px,pz,P[i][0],P[i][1],P[i+1][0],P[i+1][1]); if(q<d) d=q; } return d; }
function hillH(x,z,withBasin=true){
  const fx=sm(90,58,x);
  let h=10*sm(-14,-56,z)*fx + 3.2*Math.exp(-((x-KNOLL.x)**2+(z-KNOLL.z)**2)/110)*fx;
  const ae=Math.hypot((x-ANM.x)/ANM.rx,(z-ANM.z)/ANM.rz);
  h+=(Math.sin(x*0.09)+Math.sin(z*0.11+x*0.05))*0.7*sm(-22,-45,z)*fx*sm(0.9,1.8,ae);
  if(withBasin) h-=1.5*sm(1.12,0.72,ae);
  // west bank toward 衣笠山 and the wooded south shore
  h+=5*sm(-70,-115,x)+3.2*sm(56,88,z)*sm(70,40,x);
  return h;
}
let POOL_L=NaN;
function H(x,z){
  let h=0.5-1.45*sm(1.12,0.74,pondE(x,z));
  for(const I of ISL){ const ie=Math.hypot((x-I.x)/I.rx,(z-I.z)/I.rz); if(ie<1.5){ let t=-0.95+(I.h+0.95)*sm(1.35,0.55,ie); if(I.rx>8) t+=0.25*sm(0.9,0.3,ie)*(0.5+0.5*Math.sin(x*0.6)*Math.sin(z*0.9)); h=Math.max(h,t); } }
  h+=hillH(x,z);
  const ds=polyDist(x,z,STREAM); if(ds<2.2) h-=0.55*sm(2.2,0.5,ds);
  const dq=Math.hypot(x-14,z+34.9); if(dq<3.6&&POOL_L===POOL_L){ const k=sm(3.6,2.1,dq); h=h*(1-k)+(POOL_L-0.5)*k; }
  return h;
}
const ANM_Y=hillH(ANM.x,ANM.z,false)+0.5-0.35;
const GY=0.5; POOL_L=H(14,-34.9);

/* paths */
const APPROACH=[[160,41],[118,41],[100,41],[80,41],[66,43],[50,45],[38,44]];
const GARDEN=[[38,44],[33,32],[28,20],[22,11],[19,5],[21,-4],[25,-11],[18,-17],[6,-19.5],[-8,-19],[-15,-23],[-10,-29],[-1,-30],[7,-31],[9,-36],[7,-42],[8,-49],[16,-53],[24,-55],[32,-50],[38,-46],[48,-42],[58,-36],[66,-30],[74,-26],[86,-24],[98,-14],[106,6],[110,30],[114,38]];
function pathD(x,z){ return Math.min(polyDist(x,z,APPROACH)-1.2,polyDist(x,z,GARDEN)); }

/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3a2a20',{roughness:.75}),
  woodMid:std('#6b4c33'),
  woodLight:std('#9b7a55',{roughness:.7}),
  woodNat:std('#7d6248',{roughness:.78}),
  woodFloor:std('#6f5139'),
  woodRed:std('#a8321f',{roughness:.6}),
  plaster:std('#ece5d4',{roughness:.95}),
  paper:std('#f4eedf',{roughness:.9,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  roof_tile:std('#4f5156',{roughness:.62,side:THREE.DoubleSide}),
  roof_shingle:std('#5e4a3a',{roughness:.9,side:THREE.DoubleSide}),
  roof_thatch:std('#7d6a4c',{roughness:1,side:THREE.DoubleSide}),
  fas_shingle:std('#4a3a2e',{roughness:.95}),
  fas_thatch:std('#6c5a3e',{roughness:1}),
  soffit:std('#5a3f2c',{roughness:.85,side:THREE.DoubleSide}),
  roofDark:std('#33353a',{roughness:.6}),
  shingleCap:std('#3e3128',{roughness:.9}),
  stone:std('#8f8b83',{roughness:.95}),
  stoneDark:std('#615e58',{roughness:.95}),
  granite:std('#a8a49a',{roughness:.9}),
  foundation:std('#77726a'),
  gold:std('#ffcf5e',{roughness:.3,metalness:0.88,side:THREE.DoubleSide,emissive:new THREE.Color('#b07818'),emissiveIntensity:0.3}),
  lacquer:std('#141210',{roughness:.3}),
  interior:std('#140f0c',{roughness:1}),
  bronze:std('#5c6a58',{roughness:.55,metalness:.6}),
  copper:std('#4f7a68',{roughness:.6,metalness:.4}),
  bark:std('#4a3b30',{roughness:1}),
  pineBark:std('#5a4334',{roughness:1}),
  lanternGlow:std('#d8c9a0',{emissive:new THREE.Color('#ffb24d'),emissiveIntensity:0}),
  chochin:std('#c8321f',{roughness:.8,emissive:new THREE.Color('#ff7744'),emissiveIntensity:0.05}),
  black:std('#1d1b19',{roughness:.6}),
  white:std('#f2f0ea',{roughness:.7}),
  rope:std('#c9b27a',{roughness:1}),
  bamboo:std('#a8955f',{roughness:.6}),
  felt:std('#b4241c',{roughness:1}),
  steel:std('#9aa1a6',{roughness:.35,metalness:.8}),
  asphalt:std('#46474a',{roughness:.9}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;
let _pk=0;
// generic onBeforeCompile patcher (world-space varyings, sway, colour/roughness/normal/emissive hooks, and snow cover)
function patchMat(mat,o){
  const key='pm'+(_pk++); mat.customProgramCacheKey=()=>key;
  const sn=o.snow||[0.55,0.85,1.0];
  const SNOW=o.noSnow?'':`{ float sk=uSnow*snowK*${sn[2].toFixed(2)}*smoothstep(${sn[0].toFixed(2)},${sn[1].toFixed(2)},vWN.y)*smoothstep(0.28,0.5,fbm(vW*1.7)*0.6+0.4*uSnow+0.08);
     diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.9,0.92,0.96),clamp(sk,0.,1.)); gSnowAmt=clamp(sk,0.,1.); }`;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; sh.uniforms.uDusk=U.uDusk; sh.uniforms.uSnow=U.uSnow; Object.assign(sh.uniforms,o.uniforms||{});
    let v=sh.vertexShader, f=sh.fragmentShader;
    v=v.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+(o.vHead||''));
    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 dwp=vec4(transformed,1.0); vec3 dwn=objectNormal;
      #ifdef USE_INSTANCING
        dwp=instanceMatrix*dwp; dwn=mat3(instanceMatrix)*dwn;
      #endif
      vW=(modelMatrix*dwp).xyz; vWN=normalize(mat3(modelMatrix)*dwn);
      ${o.vBegin||''}`);
    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float swk=${o.sway};
      float gust=0.75+0.45*sin(uTime*0.37+mvPosition.x*0.05)*sin(uTime*0.23+1.7);
      mvPosition.x += sin(uTime*1.3+mvPosition.x*0.35+mvPosition.z*0.21)*swk*gust;
      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75*gust;
      mvPosition.y += sin(uTime*2.1+mvPosition.x*1.7)*swk*0.12;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    f=f.replace('#include <common>','#include <common>\nuniform float uTime; uniform float uDusk; uniform float uSnow;\nvarying vec3 vW; varying vec3 vWN; float snowK=1.0; float gSnowAmt=0.0;\n'+NOISE_GLSL+(o.fHead||''));
    f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+(o.color||'')+'\n'+SNOW);
    f=f.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+(o.rough||'')+'\nroughnessFactor=mix(roughnessFactor,0.82,gSnowAmt);');

 {id:'gate',name:'总门·参道',jp:'総門 · 鹿苑寺への参道',marker:[114,8.5,41],view:{p:E(136,1.65,42.5),t:[112,3.2,41]},
  text:`<p>鹿苑寺（通称金阁寺）的总门朝东开着，门旁的告示板写着“五戒”：不杀生、不偷盗、不邪淫、不妄语、不饮酒。</p><p>进门后是一段两旁种满枫树的参道，秋天这里会变成一条红色的隧道（右上角“季节”切到秋叶看看）。金阁寺属临济宗相国寺派，正式名称“北山鹿苑禅寺”，“鹿苑”取自足利义满的法号“鹿苑院殿”。</p>`},
 {id:'bell',name:'钟楼',jp:'鐘楼 · 鎌倉時代の梵鐘',marker:[BELL.x,9.5,BELL.z],view:{p:E(95.5,1.7,43.2),t:[BELL.x,3.6,BELL.z]},

 {id:'kuri',name:'庫裏·唐门·门票护符',jp:'庫裏 · 唐門 · 拝観受付',marker:[64,12.5,21],view:{p:E(76,1.65,46.5),t:[60,4.5,20]},

 {id:'kyoko',name:'镜湖池·经典正面',jp:'鏡湖池 · 葦原島と石組',marker:[14,3.5,27],view:{p:E(31.5,1.75,36),t:[-1,4.6,1]},
  text:`<p>走进庭园，第一眼就是这个经典角度：隔着镜湖池望金阁。池面约6600平方米，水面平静时金阁倒映其中，正如“镜湖”之名（试试点水面）。</p><p>池中最大的岛叫苇原岛，象征日本国土；还有鹤岛、龟岛寓意长寿，以及据说由畠山、赤松、细川等大名进献的名石。金阁前四块排成一列的“夜泊石”，象征夜泊港湾、等待驶向蓬莱仙岛的船；金阁正前方竖立的“九山八海石”象征佛教世界中心的须弥山。西南方的衣笠山被“借景”进庭园。</p>`},
 {id:'kinkaku',name:'舍利殿（金阁）',jp:'舎利殿 · 法水院 / 潮音洞 / 究竟頂',marker:[0,15.2,0],view:{p:E(19,1.7,12.5),t:[0,6.6,0.5]},
  text:`<p>金阁正式名为“舍利殿”，三层各用一种风格：一层<b>法水院</b>是平安贵族的寝殿造，原木与白墙不贴金，蔀户向外挑起；二层<b>潮音洞</b>是武家造，供奉岩屋观音；三层<b>究竟顶</b>是禅宗佛殿造，开着钟形的花头窗，内外贴满金箔，安放佛舍利。一、二层之间没有屋檐，所以称“二重三阶”。</p><p>屋顶是宝形造的柿葺（桧木薄板层层铺成），顶端立着金凤凰。全高约12.5米。西侧伸向水面的小亭叫“漱清”。</p><p>1950年7月2日，一名见习僧人纵火烧毁了金阁（三岛由纪夫的小说《金阁寺》即取材于此），1955年重建；1986–87年重新贴金，金箔厚度约为原来的5倍、用金约20公斤；2003年更换屋顶。</p>`,acts:[['环绕观赏',()=>orbitKinkaku()]]},
 {id:'pine',name:'陆舟之松',jp:'陸舟の松 · 京都三松',marker:[RIKU.x-2,7,RIKU.z],view:{p:E(29.2,2.3,-12.2),t:[RIKU.x-2.5,1.6,RIKU.z]},
  text:`<p>方丈北侧的这株五叶松，相传是足利义满爱用的盆栽移植后培育而成，树龄约600年。枝干被修剪成一艘帆船的形状，船头朝西，据说寓意驶向西方净土。</p><p>它是京都市指定天然纪念物，与宝泉院的五叶松、善峰寺的游龙松并称“京都三松”。下面的木杖支撑着沉重的“船身”。</p>`},
 {id:'ginga',name:'银河泉·岩下水',jp:'銀河泉 · 巌下水 · 金閣の背面',marker:[-11,3.6,-29],view:{p:E(-4,2.3,-20.5),t:[-16,0.9,-27.5]},
  text:`<p>绕到金阁背后，能看到金阁的北面和伸向水面的“漱清”。路边石框围起的小泉叫“银河泉”，据说足利义满用它的水点茶；稍远处岩石间的一汪清水叫“岩下水”（巌下水），相传是义满洗手用的。</p>`},
 {id:'ryumon',name:'龙门瀑·鲤鱼石',jp:'龍門滝 · 鯉魚石',marker:[FALL.x,fallTop+3,FALL.z],view:{p:E(8.5,1.7,-31),t:[FALL.x,poolY+1.2,FALL.z+0.5]},
  text:`<p>落差约2.3米的龙门瀑，名字来自中国“鲤鱼跃龙门”的传说：逆流而上、越过龙门的鲤鱼会化身为龙。瀑布下水潭里斜立的那块石头就是“鲤鱼石”，表现鲤鱼奋力向上的样子，寓意立身出世。</p>`},
 {id:'anmin',name:'安民泽·白蛇冢',jp:'安民沢 · 白蛇の塚',marker:[HAKUJA.x,ANM_Y+5.2,HAKUJA.z],view:{p:E(15.5,1.7,-55.5),t:[HAKUJA.x+1,ANM_Y+1.0,HAKUJA.z]},
  text:`<p>沿坡而上，是被树林环绕的池塘“安民泽”，相传西园寺家时代就已存在，据说大旱之年也不会干涸。</p><p>池中小岛上的石塔叫“白蛇冢”，供奉作为弁才天使者的白蛇，是西园寺家的守护神。游客常把硬币投向塔前的钵里许愿。</p>`,acts:[['投一枚硬币',()=>tossCoin()]]},
 {id:'sekka',name:'夕佳亭',jp:'夕佳亭 · 南天の床柱',marker:[SEKKA.x,H(SEKKA.x,SEKKA.z)+6.5,SEKKA.z],view:{p:E(31.5,2.0,-43.5),t:[SEKKA.x,H(SEKKA.x,SEKKA.z)+1.8,SEKKA.z]},

 {id:'fudo',name:'不动堂·茶所',jp:'不動堂 · 石不動明王',marker:[FUDO.x,H(FUDO.x,FUDO.z)+8.5,FUDO.z],view:{p:E(76,1.7,-21.5),t:[FUDO.x,H(FUDO.x,FUDO.z)+2.6,FUDO.z]},

/* ---------------- camera flight ---------------- */
let fly=null;
const V=a=>new V3(...a);
function flyTo(view,via){
  controls.autoRotate=false;
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=V(view.p), t1=V(view.t);
  const d=p0.distanceTo(p1); const pts=[p0];
  const mid=p0.clone().lerp(p1,0.5); mid.y+=Math.min(22,d*0.22); mid.y=Math.max(mid.y,Math.min(p0.y,p1.y),H(mid.x,mid.z)+6);
  if(d>6) pts.push(mid);
  if(via && p0.distanceTo(V(via))>3) pts.push(V(via));
  pts.push(p1);
  fly={curve:pts.length>2?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null,p0,p1,t0,t1,start:performance.now(),dur:Math.min(5200,Math.max(1400,900+d*38))};
  controls.enabled=false;
}
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  { const pa=mistGeo.attributes.position; for(let i=0;i<mistN;i++){ const m=mist[i]; m.t+=dt*0.6; if(m.t>1) m.t=0; pa.setXYZ(i,FALL.x+Math.sin(i*7.3)*0.5*(0.4+m.t),poolY+0.05+m.t*0.9,FALL.z+0.9+Math.cos(i*3.1)*0.4*(0.4+m.t)); } pa.needsUpdate=true; mistPts.material.opacity=0.55; }
  // coins
  for(let i=coins.length-1;i>=0;i--){ const c=coins[i]; c.t+=dt/c.dur; const k=Math.min(1,c.t); c.m.position.copy(c.curve.getPoint(k)); c.m.rotation.x+=dt*14; c.m.rotation.z+=dt*9;
    if(k>=1){ if(!c.hit){ addRipple(c.m.position.x,c.m.position.z,0.6); plop(); scene.remove(c.m); } else { c.m.rotation.set(0.1,0,0.05); } coinOut(c.hit); coins.splice(i,1); } }
  // falling petals / leaves
  const fm=fallMeshPetal.visible?fallMeshPetal:fallMeshLeaf;
  if(fallMeshPetal.visible||fallMeshLeaf.visible){
    for(let i=0;i<FALL_N;i++){ const l=falls[i];
      if(!l.on){ _m.makeScale(0,0,0); fm.setMatrixAt(i,_m); continue; }
      const g=Math.max(H(l.p.x,l.p.z),WATER_Y)+0.02;
      if(l.p.y>g){ l.p.y-=l.v*dt; l.p.x+=Math.sin(t*1.3+l.ph)*0.5*dt+0.15*dt; l.p.z+=Math.cos(t*1.1+l.ph)*0.35*dt; l.rot.x+=l.spin*dt; l.rot.y+=l.spin*0.7*dt; }
      else { l.p.y=g; l.rest+=dt; l.rot.x=-PI/2; if(l.rest>9) spawnFall(l,false); }
      _q.setFromEuler(l.rot); const nearCam=l.p.distanceToSquared(camera.position)<1.6; _m.compose(l.p,_q,_s.setScalar(nearCam?0:1)); fm.setMatrixAt(i,_m); }
    fm.instanceMatrix.needsUpdate=true; }
  // snowflakes around the camera
  if(snowPts.visible){ const cp=camera.position; for(let i=0;i<SNOW_N;i++){ const s=snowSeed[i]; s.y-=s.v*dt; s.x+=Math.sin(t*0.8+s.ph)*0.3*dt; if(s.y<-5) s.y+=30;
      let x=((s.x-cp.x)%70+105)%70-35+cp.x, z=((s.z-cp.z)%70+105)%70-35+cp.z; snowPos[i*3]=x; snowPos[i*3+1]=cp.y-5+((s.y%30)+30)%30; snowPos[i*3+2]=z; }
    snowGeo.attributes.position.needsUpdate=true; snowPts.material.uniforms.uScale.value=renderer.domElement.height/2/Math.tan(camera.fov*PI/360); }
  // sound levels
  if(actx&&waterGain){ const dw=camera.position.distanceTo(tmp.set(FALL.x,poolY,FALL.z)); waterGain.gain.value=soundOn?0.22*sm(30,3,dw):0; windGain.gain.value=soundOn?0.05+0.04*Math.sin(t*0.3):0; }
  // markers & labels
  HS.forEach(h=>{
    if(!h.markerObj) return; const g=h.markerObj; const d=camera.position.distanceTo(g.position);
    g.position.y=g.userData.base+Math.sin(t*2+h.idx)*0.12; g.children[0].rotation.y=t*1.2;
    const s=Math.max(0.6,Math.min(5,d*0.035)); g.scale.setScalar(s); g.visible=d>2.5;
    const el=h.label; tmp.copy(g.position); tmp.y+=0.6*s; tmp.project(camera);
    const aerial=camera.position.y>22;
    if(!labelsOn||tmp.z>1||d<2.5||d>300||(!aerial&&d>48&&!(cur>=0&&HS[cur]===h))){ setLbl(el,false); return; }
    setLbl(el,true,(tmp.x+1)/2*innerWidth,(1-tmp.y)/2*innerHeight,d>160?0.6:1);
  });
  perfShadows(t);
  renderReflection();
  if(quality==='high'&&composer) composer.render(); else renderer.render(scene,camera);
  if(!fpsChecked&&!window.__noAutoQuality&&$('#intro').classList.contains('gone')){ if(PERF.iv<34){ fpsAcc+=dt; fpsN++; } if(fpsAcc>5){ fpsChecked=true; if(fpsN/fpsAcc<24&&quality==='high'){ setQuality('std'); toast('已自动切换为标准画质以保持流畅'); } } }
  perfQueue();
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

for(const k of ['plaster','paper']) M[k].envMapIntensity=0.35;
scene.traverse(o=>{ const m=o.material; if(m&&m.isMeshStandardMaterial&&m.envMapIntensity===1&&m!==M.gold) m.envMapIntensity=0.8; });
M.gold.envMapIntensity=1.25;
setQuality(LOW_END?'std':'high');
applySeason();
frame();
$('#loading').textContent='场景已就绪';
$('#iTour').onclick=()=>{ $('#intro').classList.add('gone'); goStop(0); };
$('#iFree').onclick=()=>{ $('#intro').classList.add('gone'); showOverview(); };
window.__kinkakuji={perf:()=>({fps:Math.round(1000/PERF.iv),quality,frames:PERF.n|0}),HS,goStop,showOverview,scene,renderer,setQuality,camera,controls,ringBell,tossCoin,heronFly,
  setSeason:i=>{ seasonIdx=i; applySeason(); }, setDusk:v=>{ dusk=v; applyTime(); }, flyTo};
</script>

setTimeout(()=>{ const l=document.getElementById('loading'); if(l && l.textContent.indexOf('就绪')<0) l.textContent='若长时间未加载，请检查网络能否访问 cdn.jsdelivr.net（Three.js）。'; },12000);
