<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>京都名所遊覧圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* ============ 昭和复古配色 ============ */
:root{
  --paper:#efe3c4; --paper2:#f6ecd2; --ink:#3a2a1c; --ink2:#6b5238; --mute:#8b7456;
  --red:#c2412b; --red2:#9e2e1d; --gold:#c7983f; --water:#83b3c0; --water2:#4d7f8f;
  --green:#97a978; --green2:#6f8a5d; --shadow:rgba(58,42,28,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2119;color:var(--ink);
  font-family:"Shippori Mincho","Noto Serif SC","Songti SC","STSong","Hiragino Mincho ProN","Yu Mincho",serif;}
button{font:inherit;cursor:pointer}

#stage{position:fixed;inset:0;display:flex}
#mapWrap{position:relative;flex:1;overflow:hidden;background:
  radial-gradient(ellipse at center,#3a2e22 0%,#1f1812 100%);touch-action:none;cursor:grab}
#mapWrap.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}

/* ============ 侧栏（像折页导览册） ============ */
#side{width:300px;flex:none;background:var(--paper2);border-right:3px double var(--ink2);
  display:flex;flex-direction:column;position:relative;z-index:4;box-shadow:4px 0 18px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.035) 0 1px,transparent 1px 3px)}
#sideHead{padding:22px 20px 14px;border-bottom:2px solid var(--ink2);text-align:center;position:relative}
#sideHead .kicker{font-size:11px;letter-spacing:.5em;color:var(--red);font-weight:700}
#sideHead h1{margin:6px 0 2px;font-size:30px;letter-spacing:.18em;font-weight:800;line-height:1.15}
#sideHead .sub{font-size:12px;color:var(--ink2);letter-spacing:.2em}
#sideHead .stamp{position:absolute;right:14px;top:14px;width:42px;height:42px;border:2px solid var(--red);
  color:var(--red);border-radius:6px;font-size:12px;line-height:1.05;display:grid;place-items:center;
  transform:rotate(8deg);font-weight:800;opacity:.85;letter-spacing:.05em;padding-top:2px}
#sideBody{flex:1;overflow:auto;padding:14px 16px 10px}
.secT{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.3em;color:var(--ink2);margin:6px 0 10px;font-weight:700}
.secT::before,.secT::after{content:"";flex:1;height:1px;background:var(--ink2);opacity:.5}
.site{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fbf4e0;border:1.5px solid var(--ink2);
  border-radius:4px;padding:10px 12px;margin-bottom:10px;color:var(--ink);box-shadow:3px 3px 0 rgba(107,82,56,.25);transition:transform .15s,box-shadow .15s}
.site:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(158,46,29,.35);border-color:var(--red2)}
.site .no{flex:none;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff6e4;display:grid;place-items:center;
  font-size:17px;font-weight:800;border:2px solid #fff6e4;box-shadow:0 0 0 1.5px var(--red2)}
.site b{display:block;font-size:17px;letter-spacing:.12em}
.site small{display:block;font-size:11.5px;color:var(--mute);letter-spacing:.05em;margin-top:2px}
.soon{font-size:12.5px;color:var(--mute);line-height:1.9;padding:2px 4px 8px;letter-spacing:.05em}
.soon span{display:inline-block;border:1px dashed var(--mute);border-radius:3px;padding:0 6px;margin:2px 3px 2px 0}
#legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink2);padding:4px 4px 0}
#legend svg{display:block}
#sideFoot{padding:10px 16px 14px;font-size:11px;color:var(--mute);border-top:1px solid rgba(107,82,56,.4);letter-spacing:.08em;line-height:1.7}

/* ============ 控件 ============ */
#zoomBox{position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoomBox button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink2);background:var(--paper2);color:var(--ink);
  font-size:20px;font-weight:700;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
#zoomBox button:hover{background:var(--red);color:#fff;border-color:var(--red2)}
#zoomBox #zReset{font-size:13px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(58,42,28,.82);color:#f6ecd2;
  font-size:12.5px;padding:6px 14px;border-radius:999px;letter-spacing:.12em;pointer-events:none;transition:opacity 1s;z-index:3;white-space:nowrap}
#sideToggle{display:none}

/* ============ 景点卡片 ============ */
#card{position:absolute;z-index:6;width:340px;max-width:calc(100% - 24px);background:var(--paper2);border:2px solid var(--ink);
  box-shadow:6px 6px 0 rgba(58,42,28,.45);padding:0;transition:opacity .25s,transform .25s;
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.04) 0 1px,transparent 1px 3px)}
#card.hidden{opacity:0;transform:translateY(8px) scale(.98);pointer-events:none}
#card .band{background:var(--red);color:#fff6e4;padding:9px 14px 8px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink)}
#card .band .no{font-size:13px;letter-spacing:.2em;opacity:.9}
#card .band h2{margin:0;font-size:24px;letter-spacing:.2em;font-weight:800}
#card .band .jp{margin-left:auto;font-size:11px;letter-spacing:.1em;opacity:.9}
#card .cb{padding:12px 16px 14px}
#card .meta{font-size:11.5px;color:var(--ink2);border-bottom:1px dashed var(--ink2);padding-bottom:8px;margin-bottom:8px;line-height:1.7}
#card .meta i{font-style:normal;color:var(--red2);font-weight:700;margin-right:4px}
#card .desc{font-family:"Noto Serif SC","Songti SC",serif;font-size:13.5px;line-height:1.85;text-align:justify}
#card .desc p{margin:.3em 0}
#card .tags{margin:8px 0 2px}
#card .tags span{display:inline-block;font-size:11px;border:1px solid var(--ink2);padding:0 6px;margin:0 4px 4px 0;border-radius:2px;color:var(--ink2)}
#card .acts{display:flex;gap:8px;margin-top:10px}
#card .go{flex:1;background:var(--ink);color:var(--paper2);border:0;padding:10px 12px;font-size:15px;letter-spacing:.25em;font-weight:700;
  box-shadow:3px 3px 0 var(--red)}
#card .go:hover{background:var(--red2)}
#card .alt{background:none;border:1.5px solid var(--ink2);color:var(--ink2);padding:8px 10px;font-size:12px}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#fff6e4;font-size:22px;line-height:1}

/* ============ 场景浏览层 ============ */
#viewer{position:fixed;inset:0;z-index:20;background:#111;display:flex;flex-direction:column;
  transition:opacity .45s,clip-path .6s cubic-bezier(.7,0,.2,1);clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}
#viewer.hidden{opacity:0;pointer-events:none;clip-path:circle(0% at var(--cx,50%) var(--cy,50%))}
#vBar{flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--paper2);
  border-bottom:3px double var(--ink2)}
#vBar button,#vBar a{background:var(--ink);color:var(--paper2);border:0;padding:6px 12px;font-size:13px;letter-spacing:.15em;text-decoration:none;font-weight:700}
#vBar button:hover,#vBar a:hover{background:var(--red)}
#vBar a{background:none;color:var(--ink2);border:1px solid var(--ink2);font-weight:500}
#vTitle{font-size:16px;letter-spacing:.25em;font-weight:800;color:var(--ink)}
#vTitle small{font-size:11px;color:var(--mute);letter-spacing:.1em;margin-left:8px;font-weight:500}
#vBar .sp{flex:1}
#vFrame{flex:1;border:0;width:100%;background:#1b1a17}

/* ============ 地图内 SVG 样式 ============ */
.lbl{font-family:"Shippori Mincho","Noto Serif SC",serif;fill:var(--ink);paint-order:stroke;stroke:#f3e8cb;stroke-width:3px;stroke-linejoin:round}
.lbl.road{font-size:9px;fill:#7a5c3a;letter-spacing:1.5px;stroke-width:2.4px}
.lbl.lm{font-size:12px;font-weight:700;letter-spacing:1px}
.lbl.big{font-size:17px;font-weight:800;letter-spacing:3px}
.lbl.river{font-size:11px;fill:#3d6c7c;font-weight:700;letter-spacing:3px;stroke:#e8ecdc}
.lbl.mt{font-size:13px;font-weight:800;fill:#3f5236;letter-spacing:2px;stroke:#d9dcbc}
.lbl.area{font-size:15px;fill:#a0805a;font-weight:700;letter-spacing:8px;stroke:none;opacity:.8}
.minor{opacity:0;transition:opacity .3s}
svg[data-z="2"] .minor,svg[data-z="3"] .minor{opacity:1}
.site-mk{cursor:pointer}
.site-mk .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.site-mk:hover .disc{fill:var(--red2)}
.site-mk:hover .flag rect{fill:var(--red2)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ============ 窄屏 ============ */
@media (max-width:760px){
  #stage{flex-direction:column}
  #side{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:58%;border-right:0;border-top:3px double var(--ink2);
    transform:translateY(calc(100% - 64px));transition:transform .35s;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  #side.open{transform:none}
  #sideHead{padding:10px 16px 8px;cursor:pointer}
  #sideHead h1{font-size:20px;margin:2px 0 0}
  #sideHead .kicker,#sideHead .stamp{display:none}
  #sideHead .sub{font-size:11px}
  #sideToggle{display:block;position:absolute;right:14px;top:16px;background:none;border:1.5px solid var(--ink2);font-size:12px;padding:3px 8px;color:var(--ink2)}
  #zoomBox{bottom:80px;right:12px}
  #hint{bottom:78px;font-size:11.5px}
  #card{left:12px !important;right:12px;top:auto !important;bottom:76px;width:auto}
  #vTitle small{display:none}
  #vBar a{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <aside id="side">
    <div id="sideHead">
      <div class="kicker">昭和懐古 · 立體導覽</div>
      <h1>京都名所遊覧圖</h1>
      <div class="sub">KYOTO · ILLUSTRATED GUIDE MAP</div>
      <div class="stamp">京都<br>観光</div>
      <button id="sideToggle">景点 ▴</button>
    </div>
    <div id="sideBody">
      <div class="secT">已開放 3D 導覽</div>
      <div id="siteList"></div>
      <div class="secT">籌備中</div>
      <div class="soon" id="soonList"></div>
      <div class="secT">圖例</div>
      <div id="legend"></div>
    </div>
    <div id="sideFoot">点击地图上的朱红印章或左侧景点卡片，即可进入该处的 3D 导览。拖动平移，滚轮或双指缩放。</div>
  </aside>
  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" data-z="1"></svg>
    <div id="card" class="hidden"></div>
    <div id="zoomBox">
      <button id="zIn" title="放大">＋</button>
      <button id="zOut" title="缩小">－</button>
      <button id="zReset" title="全图">全</button>
    </div>
    <div id="hint">点击朱红印章 · 进入 3D 导览</div>
  </div>
</div>

<div id="viewer" class="hidden">
  <div id="vBar">
    <button id="vBack">← 返回地图</button>
    <div id="vTitle"></div>
    <div class="sp"></div>
    <a id="vOpen" href="#" target="_blank" rel="noopener">在新标签页打开</a>
  </div>
  <iframe id="vFrame" title="3D 导览" allowfullscreen></iframe>
</div>

<script>
/* =====================================================================
   景点数据：以后新增景点只需在 SITES 里追加一项。
   href 为相对本文件的路径（请保持文件夹结构）；lat/lon 为真实经纬度。
   ===================================================================== */
const SITES = [
  {
    id:'shisendo', no:'壹', name:'詩仙堂', cn:'诗仙堂', jp:'しせんどう · 丈山寺',
    lat:35.0441, lon:135.7966, href:'shisendo/shisendo.html',
    addr:'左京区一乗寺門口町 27', access:'叡山电车「一乗寺」站步行约 15 分钟',
    era:'宽永十八年（1641）',
    desc:[
      '江户初期文人石川丈山辞官隐居时所筑山庄「凹凸窠」，因堂内「诗仙之间」悬挂狩野探幽所绘中国三十六位诗人像、并由丈山亲题诗句而得名。',
      '白砂与皋月杜鹃修剪成的唐样庭园层层下沉，园中「僧都（鹿威）」竹筒定时敲石，清响回荡于一乘寺的山脚。初夏杜鹃与深秋红叶最负盛名。'
    ],
    tags:['曹洞宗','唐样庭园','鹿威','红叶名所']
  },
  {
    id:'rokkakudo', no:'貳', name:'六角堂', cn:'六角堂 · 顶法寺', jp:'ろっかくどう · 頂法寺',
    lat:35.0068, lon:135.7600, href:'rokkakudo/rokkakudo.html',
    addr:'中京区六角通東洞院西入堂之前町 248', access:'地铁「乌丸御池」站步行约 3 分钟',
    era:'传为用明天皇二年（587）',
    desc:[
      '相传圣德太子为供奉护身的如意轮观音而建，本堂呈六角形，故俗称六角堂。门前「脐石」相传标记着平安京的中心，被视为「京都之脐」。',
      '历代住持池坊家在此向佛前供花，发展出日本最古老的花道流派「池坊」，六角堂因而被尊为花道发祥地；亲鸾上人亦曾在此闭关百日。'
    ],
    tags:['西国三十三所第十八番','花道发祥地','脐石','都心古刹']
  }
];
const SOON = ['清水寺','金閣寺','銀閣寺','伏見稲荷','南禅寺','龍安寺'];

/* ===================== 投影：经纬度 → 图面坐标 ===================== */
const LON0=135.72, LAT0=35.07, KX=91.2*90, KY=111*90; // 每公里 90 单位
const P=(lon,lat)=>[(lon-LON0)*KX,(LAT0-lat)*KY];
const W=985, H=999; // 东至 135.84，南至 34.97

/* ===================== 小工具 ===================== */
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function g(parent,attrs){return el('g',attrs||{},parent)}
let seed=20261015; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const r=(a,b)=>a+(b-a)*rnd();
function smooth(pts,closed){ // Catmull-Rom → 贝塞尔
  if(pts.length<3) return 'M'+pts.map(p=>p.join(',')).join('L');
  const n=pts.length, at=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  let d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    d+='C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+','+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+
         (p2[0]-(p3[0]-p1[0])/6).toFixed(1)+','+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0].toFixed(1)+','+p2[1].toFixed(1);
  }
  return closed?d+'Z':d;
}
const LL=a=>a.map(([lo,la])=>P(lo,la));
function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];
  if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function text(parent,x,y,str,cls,extra){const t=el('text',Object.assign({x,y,class:'lbl '+(cls||''),'text-anchor':'middle'},extra||{}),parent);t.textContent=str;return t}
function vtext(parent,x,y,str,cls,gap){ // 竖排文字
  const gg=g(parent);[...str].forEach((ch,i)=>text(gg,x,y+i*(gap||14),ch,cls));return gg}

/* ===================== SVG defs ===================== */
const defs=el('defs',{},svg);
defs.innerHTML=`
<filter id="paperTex" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" result="n"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .16 0"/>
</filter>
<filter id="blotch" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".006" numOctaves="3" seed="3"/>
  <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 .55 -.18"/>
</filter>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="11" result="t"/>
  <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
</filter>
<radialGradient id="vign" cx="50%" cy="50%" r="72%">
  <stop offset="62%" stop-color="#5a3a18" stop-opacity="0"/>
  <stop offset="100%" stop-color="#5a3a18" stop-opacity=".38"/>
</radialGradient>
<pattern id="blocks" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#ead9b2"/>
  <rect x="1" y="1" width="7" height="7" fill="#e3cfa2"/>
</pattern>
<pattern id="fields" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
  <rect width="14" height="14" fill="#e6dcb0"/>
  <path d="M0 4h14M0 9h14" stroke="#c9bd88" stroke-width=".7"/>
</pattern>
<pattern id="forest" width="10" height="10" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#9fb07f"/>
  <circle cx="3" cy="3" r="2.1" fill="#7f9765"/><circle cx="8" cy="7.5" r="2.1" fill="#7f9765"/>
</pattern>
<pattern id="waves" width="16" height="6" patternUnits="userSpaceOnUse">
  <path d="M0 4 Q4 1 8 4 T16 4" fill="none" stroke="#ecf2e6" stroke-width=".8" opacity=".8"/>
</pattern>
<linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8eccb"/><stop offset="1" stop-color="#ead39a"/>
</linearGradient>
<clipPath id="mapClip"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>
<symbol id="temple" viewBox="-12 -12 24 20" overflow="visible">
  <path d="M-11 -2 Q-6 -3 -4 -9 L4 -9 Q6 -3 11 -2 Z" fill="#5b4330"/>
  <rect x="-7" y="-2" width="14" height="7" fill="#f2e6c8" stroke="#5b4330" stroke-width="1"/>
  <path d="M-3 5V0h6v5" fill="none" stroke="#5b4330" stroke-width="1"/>
</symbol>
<symbol id="torii" viewBox="-12 -12 24 22" overflow="visible">
  <path d="M-11 -8 Q0 -11 11 -8 L10 -6 Q0 -8.5 -10 -6Z" fill="#c2412b" stroke="#6a1e12" stroke-width=".7"/>
  <rect x="-8" y="-4.5" width="16" height="1.8" fill="#c2412b"/>
  <rect x="-6.5" y="-6" width="2.2" height="15" fill="#c2412b"/><rect x="4.3" y="-6" width="2.2" height="15" fill="#c2412b"/>
</symbol>
<symbol id="pagoda" viewBox="-10 -24 20 28" overflow="visible">
  <g fill="#5b4330"><path d="M-9 0h18l-3-3h-12z"/><path d="M-8 -6h16l-3-3h-10z"/><path d="M-7 -12h14l-3-3h-8z"/><path d="M-6 -18h12l-3-3h-6z"/>
  <rect x="-.6" y="-25" width="1.2" height="5"/></g>
  <g fill="#f2e6c8"><rect x="-4" y="-3" width="8" height="3"/><rect x="-3.5" y="-9" width="7" height="3"/><rect x="-3" y="-15" width="6" height="3"/></g>
</symbol>
<symbol id="castle" viewBox="-12 -16 24 20" overflow="visible">
  <rect x="-10" y="-1" width="20" height="5" fill="#8a7a66"/>
  <path d="M-9 -1 Q-4 -2 -3 -6 h6 Q4 -2 9 -1Z" fill="#5b4330"/><rect x="-5" y="-6" width="10" height="4" fill="#f2e6c8"/>

/* ===================== 平移 / 缩放 ===================== */
const wrap=document.getElementById('mapWrap');
const FULL={x:-70,y:-70,w:W+140,h:H+140};
let vb={...FULL};
function minW(){return 160}
function apply(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r=wrap.clientWidth/wrap.clientHeight, eff=Math.max(vb.w,vb.h*r);
  svg.dataset.z=eff<520?3:eff<820?2:1;
  if(!card.classList.contains('hidden')&&cur)placeCard(cur);
}
svg.setAttribute('preserveAspectRatio','xMidYMid meet');
function clamp(){
  vb.w=Math.max(minW(),Math.min(FULL.w*1.6,vb.w));vb.h=vb.w*FULL.h/FULL.w;
  const mx=FULL.x+FULL.w, my=FULL.y+FULL.h;
  vb.x=Math.max(FULL.x-vb.w*.4,Math.min(mx-vb.w*.6,vb.x));vb.y=Math.max(FULL.y-vb.h*.4,Math.min(my-vb.h*.6,vb.y));
}
function toSvg(cx,cy){const pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function toScreen(x,y){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const p=pt.matrixTransform(svg.getScreenCTM());const r=wrap.getBoundingClientRect();return{x:p.x-r.left,y:p.y-r.top}}
function zoomAt(f,cx,cy){const p=toSvg(cx,cy);const nw=Math.max(minW(),Math.min(FULL.w*1.6,vb.w*f));const k=nw/vb.w;
  vb.x=p.x-(p.x-vb.x)*k;vb.y=p.y-(p.y-vb.y)*k;vb.w=nw;vb.h=nw*FULL.h/FULL.w;clamp();apply()}
let anim=null;
function flyTo(x,y,w,done){
  cancelAnimationFrame(anim);const a={...vb},b={w,h:w*FULL.h/FULL.w};b.x=x-b.w/2;b.y=y-b.h/2;
  const t0=performance.now(),D=900;
  (function step(t){let k=Math.min(1,(t-t0)/D);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    vb={x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,w:a.w+(b.w-a.w)*k,h:a.h+(b.h-a.h)*k};apply();
    if(k<1)anim=requestAnimationFrame(step);else done&&done()})(t0);
}
wrap.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let last=null,moved=0,pinch0=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('#card,#zoomBox'))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===1){last={x:e.clientX,y:e.clientY};wrap.classList.add('drag')}
  if(ptrs.size===2){const[p,q]=[...ptrs.values()];pinch0={d:Math.hypot(p.x-q.x,p.y-q.y),w:vb.w}}});
wrap.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){const[p,q]=[...ptrs.values()];const d=Math.hypot(p.x-q.x,p.y-q.y);zoomAt((pinch0.w*pinch0.d/d)/vb.w,(p.x+q.x)/2,(p.y+q.y)/2);moved+=10;return}
  if(moved>6&&!wrap.hasPointerCapture(e.pointerId))wrap.setPointerCapture(e.pointerId);
  if(ptrs.size===1&&last){const a=toSvg(last.x,last.y),b=toSvg(e.clientX,e.clientY);vb.x-=b.x-a.x;vb.y-=b.y-a.y;moved+=Math.abs(e.clientX-last.x)+Math.abs(e.clientY-last.y);last={x:e.clientX,y:e.clientY};clamp();apply()}});
function up(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(ptrs.size===1){const v=[...ptrs.values()][0];last={x:v.x,y:v.y}}if(!ptrs.size){last=null;wrap.classList.remove('drag')}}
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
// 拖动后不触发点击
wrap.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault();return}
  if(!e.target.closest('#card,.site-mk'))closeCard()},true);
document.getElementById('zIn').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(.7,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zOut').onclick=()=>{const r=wrap.getBoundingClientRect();zoomAt(1/.7,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zReset').onclick=()=>{closeCard();flyTo(FULL.x+FULL.w/2,FULL.y+FULL.h/2,FULL.w)};
addEventListener('resize',apply);

/* ===================== 景点卡片 ===================== */
const card=document.getElementById('card');let cur=null;
function openCard(s){
  cur=s;
  card.innerHTML=`<div class="band"><span class="no">其${s.no}</span><h2>${s.name}</h2><span class="jp">${s.jp}</span><button class="x" aria-label="关闭">×</button></div>
  <div class="cb"><div class="meta"><div><i>创建</i>${s.era}</div><div><i>所在</i>${s.addr}</div><div><i>交通</i>${s.access}</div></div>
  <div class="desc">${s.desc.map(p=>'<p>'+p+'</p>').join('')}</div>
  <div class="tags">${s.tags.map(t=>'<span>'+t+'</span>').join('')}</div>
  <div class="acts"><button class="go">进入 3D 导览 ▸</button><button class="alt">新标签页</button></div></div>`;
  card.querySelector('.x').onclick=closeCard;
  card.querySelector('.go').onclick=()=>openScene(s);
  card.querySelector('.alt').onclick=()=>window.open(s.href,'_blank','noopener');
  card.classList.remove('hidden');placeCard(s);
}
function placeCard(s){
  if(innerWidth<=760)return;
  const p=toScreen(s.x,s.y),cw=card.offsetWidth,ch=card.offsetHeight,ww=wrap.clientWidth,wh=wrap.clientHeight;
  const flagLeft=s.id==='rokkakudo'; // 卡片放在旗标的另一侧，避免遮住
  let x=flagLeft?p.x+34:p.x-34-cw,y=p.y-ch/2;if(x<12)x=p.x+34+(flagLeft?0:s.name.length*17+40);if(x+cw>ww-12)x=p.x-34-cw;x=Math.max(12,Math.min(ww-cw-12,x));y=Math.max(12,Math.min(wh-ch-12,y));
  card.style.left=x+'px';card.style.top=y+'px';
}
function closeCard(){card.classList.add('hidden');cur=null}

/* ===================== 场景浏览层 ===================== */
const viewer=document.getElementById('viewer'),vFrame=document.getElementById('vFrame');
function openScene(s){
  const p=toScreen(s.x,s.y),r=wrap.getBoundingClientRect();
  viewer.style.setProperty('--cx',(p.x+r.left)+'px');viewer.style.setProperty('--cy',(p.y+r.top)+'px');
  document.getElementById('vTitle').innerHTML=`${s.name}<small>${s.jp}</small>`;
  document.getElementById('vOpen').href=s.href;
  vFrame.src=s.href;viewer.classList.remove('hidden');
  history.pushState({site:s.id},'','#'+s.id);
}
function closeScene(fromPop){viewer.classList.add('hidden');setTimeout(()=>{if(viewer.classList.contains('hidden'))vFrame.src='about:blank'},650);
  if(!fromPop&&location.hash)history.back()}
document.getElementById('vBack').onclick=()=>closeScene(false);
addEventListener('popstate',()=>{const s=SITES.find(x=>'#'+x.id===location.hash);if(s){openCard(s);openScene(s)}else if(!viewer.classList.contains('hidden'))closeScene(true)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!viewer.classList.contains('hidden'))closeScene(false);else closeCard()}});

/* ===================== 启动 ===================== */
if(innerWidth<=760){vb={x:150,y:120,w:720,h:720*FULL.h/FULL.w}}
apply();
setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);
{const s=SITES.find(x=>'#'+x.id===location.hash);if(s){history.replaceState(null,'',location.pathname);openCard(s);openScene(s)}}
window.__kyotoMap={SITES,openCard,openScene,flyTo,closeScene};
