<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>京都名所遊覧圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* ============ 昭和复古配色 ============ */
:root{
  --paper:#efe3c4; --paper2:#f6ecd2; --ink:#3a2a1c; --ink2:#6b5238; --mute:#8b7456;
  --red:#c2412b; --red2:#9e2e1d; --gold:#c7983f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2119;color:var(--ink);
  font-family:"Shippori Mincho","Noto Serif SC","Songti SC","STSong","Hiragino Mincho ProN","Yu Mincho",serif;}
button{font:inherit;cursor:pointer}

#stage{position:fixed;inset:0;display:flex}
#mapWrap{position:relative;flex:1;overflow:hidden;background:#d9c69c;touch-action:none;cursor:grab}
#mapWrap.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}

/* ============ 侧栏（折页导览册） ============ */
#side{width:300px;flex:none;background:var(--paper2);border-right:3px double var(--ink2);
  display:flex;flex-direction:column;position:relative;z-index:4;box-shadow:4px 0 18px rgba(0,0,0,.35);
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.035) 0 1px,transparent 1px 3px)}
#sideHead{padding:20px 20px 12px;border-bottom:2px solid var(--ink2);text-align:center;position:relative}
#sideHead .kicker{font-size:11px;letter-spacing:.5em;color:var(--red);font-weight:700}
#sideHead h1{margin:6px 0 2px;font-size:30px;letter-spacing:.18em;font-weight:800;line-height:1.15}
#sideHead .sub{font-size:11px;color:var(--ink2);letter-spacing:.2em}
#sideHead .stamp{position:absolute;right:12px;top:12px;width:42px;height:42px;border:2px solid var(--red);
  color:var(--red);border-radius:6px;font-size:12px;line-height:1.05;display:grid;place-items:center;
  transform:rotate(8deg);font-weight:800;opacity:.85;padding-top:2px}
#sideBody{flex:1;overflow:auto;padding:12px 16px 10px}
.secT{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.3em;color:var(--ink2);margin:8px 0 10px;font-weight:700}
.secT::before,.secT::after{content:"";flex:1;height:1px;background:var(--ink2);opacity:.5}
.site{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fbf4e0;border:1.5px solid var(--ink2);
  border-radius:4px;padding:9px 12px;margin-bottom:9px;color:var(--ink);box-shadow:3px 3px 0 rgba(107,82,56,.25);transition:transform .15s,box-shadow .15s}
.site:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(158,46,29,.35);border-color:var(--red2)}
.site .no{flex:none;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff6e4;display:grid;place-items:center;
  font-size:16px;font-weight:800;border:2px solid #fff6e4;box-shadow:0 0 0 1.5px var(--red2)}
.site b{display:block;font-size:17px;letter-spacing:.12em}
.site small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.area{margin:0 0 8px}
.area h4{margin:0 0 4px;font-size:12px;color:var(--red2);letter-spacing:.3em}
.chip{display:inline-block;font-size:12.5px;border:1px solid rgba(107,82,56,.55);background:#fbf4e0;border-radius:3px;padding:1px 7px;margin:0 4px 5px 0;color:var(--ink)}
.chip:hover{background:var(--ink);color:var(--paper2)}
#legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--ink2);padding:4px 4px 0}
#legend svg{display:block}
#sideFoot{padding:9px 16px 12px;font-size:11px;color:var(--mute);border-top:1px solid rgba(107,82,56,.4);line-height:1.7}

/* ============ 控件 ============ */
#zoomBox{position:absolute;right:16px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoomBox button{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink2);background:var(--paper2);color:var(--ink);
  font-size:20px;font-weight:700;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
#zoomBox button:hover{background:var(--red);color:#fff;border-color:var(--red2)}
#zoomBox #zReset{font-size:13px}
#hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(58,42,28,.85);color:#f6ecd2;
  font-size:12.5px;padding:6px 14px;border-radius:999px;letter-spacing:.12em;pointer-events:none;transition:opacity 1s;z-index:3;white-space:nowrap}
#sideToggle{display:none}

/* ============ 名所卡片 ============ */
#card{position:absolute;z-index:6;width:340px;max-width:calc(100% - 24px);background:var(--paper2);border:2px solid var(--ink);
  box-shadow:6px 6px 0 rgba(58,42,28,.45);transition:opacity .25s,transform .25s;
  background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.04) 0 1px,transparent 1px 3px)}
#card.hidden{opacity:0;transform:translateY(8px) scale(.98);pointer-events:none}
#card .band{background:var(--red);color:#fff6e4;padding:9px 34px 8px 14px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink)}
#card.lm .band{background:var(--ink)}
#card .band .no{font-size:13px;letter-spacing:.2em;opacity:.9;white-space:nowrap}
#card .band h2{margin:0;font-size:22px;letter-spacing:.16em;font-weight:800}
#card .band .jp{margin-left:auto;font-size:11px;letter-spacing:.06em;opacity:.9;text-align:right}
#card .cb{padding:12px 16px 14px}
#card .meta{font-size:11.5px;color:var(--ink2);border-bottom:1px dashed var(--ink2);padding-bottom:8px;margin-bottom:8px;line-height:1.7}
#card .meta i{font-style:normal;color:var(--red2);font-weight:700;margin-right:4px}
#card .desc{font-family:"Noto Serif SC","Songti SC",serif;font-size:13.5px;line-height:1.85;text-align:justify}
#card .desc p{margin:.3em 0}
#card .tags{margin:8px 0 2px}
#card .tags span{display:inline-block;font-size:11px;border:1px solid var(--ink2);padding:0 6px;margin:0 4px 4px 0;border-radius:2px;color:var(--ink2)}
#card .acts{display:flex;gap:8px;margin-top:10px}
#card .go{flex:1;background:var(--ink);color:var(--paper2);border:0;padding:10px 12px;font-size:15px;letter-spacing:.25em;font-weight:700;box-shadow:3px 3px 0 var(--red)}
#card .go:hover{background:var(--red2)}
#card .go[disabled]{background:#b9a888;box-shadow:none;cursor:default;letter-spacing:.15em;font-size:13px}
#card .alt{background:none;border:1.5px solid var(--ink2);color:var(--ink2);padding:8px 10px;font-size:12px}
#card .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#fff6e4;font-size:22px;line-height:1}

/* ============ 场景浏览层 ============ */
#viewer{position:fixed;inset:0;z-index:20;background:#111;display:flex;flex-direction:column;
  transition:opacity .45s,clip-path .6s cubic-bezier(.7,0,.2,1);clip-path:circle(150% at var(--cx,50%) var(--cy,50%))}
#viewer.hidden{opacity:0;pointer-events:none;clip-path:circle(0% at var(--cx,50%) var(--cy,50%))}
#vBar{flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--paper2);border-bottom:3px double var(--ink2)}
#vBar button,#vBar a{background:var(--ink);color:var(--paper2);border:0;padding:6px 12px;font-size:13px;letter-spacing:.15em;text-decoration:none;font-weight:700}
#vBar button:hover,#vBar a:hover{background:var(--red)}
#vBar a{background:none;color:var(--ink2);border:1px solid var(--ink2);font-weight:500}
#vTitle{font-size:16px;letter-spacing:.25em;font-weight:800;color:var(--ink)}
#vTitle small{font-size:11px;color:var(--mute);letter-spacing:.1em;margin-left:8px;font-weight:500}
#vBar .sp{flex:1}
#vFrame{flex:1;border:0;width:100%;background:#1b1a17}

/* ============ 地图内 SVG 样式 ============ */
.lbl{font-family:"Shippori Mincho","Noto Serif SC",serif;fill:var(--ink);paint-order:stroke;stroke:#f3e8cb;stroke-width:3px;stroke-linejoin:round}
.lbl.road{font-size:9px;fill:#7a5c3a;letter-spacing:1.5px;stroke-width:2.4px}
.lbl.lm{font-size:11.5px;font-weight:700;letter-spacing:1px}
.lbl.lm1{font-size:13px;font-weight:800;letter-spacing:1px}
.lbl.big{font-size:17px;font-weight:800;letter-spacing:3px}
.lbl.river{font-size:11px;fill:#3d6c7c;font-weight:700;letter-spacing:3px;stroke:#e8ecdc}
.lbl.mt{font-size:13px;font-weight:800;fill:#3f5236;letter-spacing:2px;stroke:#dfe0c2}
.lbl.area{font-size:16px;fill:#8e6c45;font-weight:800;letter-spacing:7px;stroke:#efe3c4;stroke-width:4px;opacity:.85}
.lmk{cursor:pointer}
.lmk:hover .lbl{fill:var(--red2)}
.z2,.z3{opacity:0;transition:opacity .3s;pointer-events:none}
svg[data-z="2"] .z2,svg[data-z="3"] .z2,svg[data-z="3"] .z3{opacity:1;pointer-events:auto}
svg[data-z="3"] .hideZ3{opacity:0}
.site-mk{cursor:pointer}
.site-mk:focus,.lmk:focus{outline:none}
.site-mk .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.site-mk:hover .disc,.site-mk:hover .flag rect:first-child{fill:var(--red2)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ============ 窄屏 ============ */
@media (max-width:760px){
  #stage{flex-direction:column}
  #side{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62%;border-right:0;border-top:3px double var(--ink2);
    transform:translateY(calc(100% - 64px));transition:transform .35s;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  #side.open{transform:none}
  #sideHead{padding:10px 16px 8px;cursor:pointer}
  #sideHead h1{font-size:20px;margin:2px 0 0}
  #sideHead .kicker,#sideHead .stamp{display:none}
  #sideToggle{display:block;position:absolute;right:14px;top:16px;background:none;border:1.5px solid var(--ink2);font-size:12px;padding:3px 8px;color:var(--ink2)}
  #zoomBox{bottom:80px;right:12px}
  #hint{bottom:78px;font-size:11.5px}
  #card{left:12px !important;right:12px;top:auto !important;bottom:76px;width:auto;max-height:60%;overflow:auto}
  #vTitle small{display:none}
  #vBar a{display:none}
}
</style>
</head>
<body>
<div id="stage">
  <aside id="side">
    <div id="sideHead">
      <div class="kicker">昭和懐古 · 立體導覽</div>
      <h1>京都名所遊覧圖</h1>
      <div class="sub">KYOTO · ILLUSTRATED GUIDE MAP</div>
      <div class="stamp">京都<br>観光</div>
      <button id="sideToggle">名所 ▴</button>
    </div>
    <div id="sideBody">
      <div class="secT">已開放 3D 導覽</div>
      <div id="siteList"></div>
      <div class="secT">名所一覧</div>
      <div id="areaList"></div>
      <div class="secT">圖例</div>
      <div id="legend"></div>
    </div>
    <div id="sideFoot">朱红印章为已开放 3D 导览的景点，黑色名所可点击查看简介。拖动平移，滚轮或双指缩放，放大后会显示更多名所与街道。</div>
  </aside>
  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" data-z="1"></svg>
    <div id="card" class="hidden"></div>
    <div id="zoomBox">
      <button id="zIn" title="放大">＋</button>
      <button id="zOut" title="缩小">－</button>
      <button id="zReset" title="全图">全</button>
    </div>
    <div id="hint">点击朱红印章 · 进入 3D 导览</div>
  </div>
</div>

<div id="viewer" class="hidden">
  <div id="vBar">
    <button id="vBack">← 返回地图</button>
    <div id="vTitle"></div>
    <div class="sp"></div>
    <a id="vOpen" href="#" target="_blank" rel="noopener">在新标签页打开</a>
  </div>
  <iframe id="vFrame" title="3D 导览" allowfullscreen></iframe>
</div>

<script>
/* =====================================================================
   已开放 3D 导览的景点：以后新增景点只需在 SITES 里追加一项
   （并把 LANDMARKS 里同名的一项删掉）。href 为相对本文件的路径。
   ===================================================================== */
const SITES = [
  {
    id:'shisendo', no:'壹', name:'詩仙堂', cn:'诗仙堂', jp:'しせんどう · 丈山寺', flag:'r',
    lat:35.0441, lon:135.7966, href:'shisendo/shisendo.html',
    addr:'左京区一乗寺門口町 27', access:'叡山电车「一乗寺」站步行约 15 分钟',
    era:'宽永十八年（1641）',
    desc:[
      '江户初期文人石川丈山辞官隐居时所筑山庄「凹凸窠」，因堂内「诗仙之间」悬挂狩野探幽所绘中国三十六位诗人像、并由丈山亲题诗句而得名。',
      '白砂与皋月杜鹃修剪成的唐样庭园层层下沉，园中「僧都（鹿威）」竹筒定时敲石，清响回荡于一乘寺的山脚。初夏杜鹃与深秋红叶最负盛名。'
    ],
    tags:['曹洞宗','唐样庭园','鹿威','红叶名所']
  },
  {
    id:'rokkakudo', no:'貳', name:'六角堂', cn:'六角堂 · 顶法寺', jp:'ろっかくどう · 頂法寺', flag:'l',
    lat:35.0068, lon:135.7600, href:'rokkakudo/rokkakudo.html',
    addr:'中京区六角通東洞院西入堂之前町 248', access:'地铁「乌丸御池」站步行约 3 分钟',
    era:'传为用明天皇二年（587）',
    desc:[
      '相传圣德太子为供奉护身的如意轮观音而建，本堂呈六角形，故俗称六角堂。门前「脐石」相传标记着平安京的中心，被视为「京都之脐」。',
      '历代住持池坊家在此向佛前供花，发展出日本最古老的花道流派「池坊」，六角堂因而被尊为花道发祥地；亲鸾上人亦曾在此闭关百日。'
    ],
    tags:['西国三十三所第十八番','花道发祥地','脐石','都心古刹']
  }
];

/* 名所：[地图标注, 中文名, 经度, 纬度, 图标, 显示级别(1全图可见/2放大后/3再放大), 区域, 简介, 标注dx, 标注dy] */
const LANDMARKS = [
  ['三千院','三千院',135.8345,35.1197,'temple',1,'洛北','天台宗门迹寺院，往生极乐院的阿弥陀三尊、有清园的青苔与秋日红叶闻名，是大原山里的代表名刹。'],
  ['寂光院','寂光院',135.8188,35.1203,'temple',2,'洛北','《平家物语》中建礼门院出家隐居之所，书末「大原御幸」的舞台，静谧的尼寺。'],
  ['鞍馬寺','鞍马寺',135.7708,35.1176,'temple',1,'洛北','鞍马山中的古刹，相传牛若丸（源义经）幼年在此随天狗习武；山路穿过杉林通往贵船。'],
  ['貴船神社','贵船神社',135.7629,35.1218,'torii',1,'洛北','供奉水神的古社，石阶两侧朱红灯笼最为上镜，夏季溪上「川床」料理消暑。',-34,4],
  ['延暦寺','比叡山延历寺',135.8410,35.0705,'temple',1,'洛北','最澄于 788 年开创的天台宗总本山，根本中堂的「不灭法灯」千年不熄，被称为日本佛教之母山。世界遗产。'],
  ['修學院離宮','修学院离宫',135.8028,35.0544,'temple',2,'洛北','17 世纪后水尾上皇营建的山麓离宫，上中下三座茶屋层层借景，需预约参观。'],
  ['曼殊院','曼殊院',135.8036,35.0566,'temple',3,'洛北','天台宗门迹寺院，书院与枯山水庭园清雅，被称作「小桂离宫」。',30,4],
  ['圓通寺','圆通寺',135.7778,35.0670,'temple',3,'洛北','以远处比叡山为借景的枯山水庭园而著称。'],
  ['實相院','实相院',135.7863,35.0753,'temple',2,'洛北','岩仓的门迹寺院，漆黑地板倒映窗外枫叶的「床红叶」十分有名。'],
  ['上賀茂神社','上贺茂神社',135.7524,35.0602,'torii',1,'洛北','京都最古老的神社之一，与下鸭神社合称贺茂社，每年五月葵祭的终点。世界遗产。'],
  ['下鴨神社','下鸭神社',135.7728,35.0389,'torii',1,'洛北','坐落在鸭川与高野川交汇处的原生林「纠之森」中，世界遗产。',28,2],
  ['大德寺','大德寺',135.7461,35.0440,'temple',2,'洛北','临济宗大德寺派大本山，塔头众多，与千利休及茶道渊源深厚。'],
  ['金閣寺','金阁寺',135.7292,35.0394,'temple',1,'洛北','足利义满的北山山庄，贴满金箔的舍利殿倒映于镜湖池中。正式名鹿苑寺，世界遗产。'],
  ['京都府立植物園','京都府立植物园',135.7642,35.0495,null,3,'洛北','1924 年开园的日本最早公立植物园，紧邻鸭川半木之道。'],

  ['龍安寺','龙安寺',135.7183,35.0345,'temple',1,'洛西','以十五块石头排列的枯山水石庭闻名于世，从任何角度都无法同时看见全部石头。世界遗产。'],
  ['仁和寺','仁和寺',135.7138,35.0312,'temple',2,'洛西','宇多天皇创建的皇室门迹寺院，花期最晚的低矮樱花「御室樱」著名。世界遗产。',-26,8],
  ['妙心寺','妙心寺',135.7200,35.0230,'temple',2,'洛西','临济宗妙心寺派大本山，寺域辽阔，法堂天井有狩野探幽绘的「云龙图」。'],
  ['北野天滿宮','北野天满宫',135.7353,35.0312,'torii',2,'洛西','供奉学问之神菅原道真，早春梅花与每月 25 日的天神市闻名。'],
  ['廣隆寺','广隆寺',135.7065,35.0157,'temple',2,'洛西','京都最古老的寺院之一，藏有日本国宝第一号「弥勒菩萨半跏思惟像」。'],
  ['渡月橋','岚山 · 渡月桥',135.6776,35.0128,'bridge',1,'洛西','桂川上的名桥，与岚山的樱花、红叶构成京都最著名的风景之一。',0,16],
  ['天龍寺','天龙寺',135.6738,35.0158,'temple',1,'洛西','足利尊氏为悼念后醍醐天皇所建，梦窗疏石设计的曹源池庭园借景岚山。世界遗产。',-24,-6],
  ['竹林之道','嵯峨野竹林之道',135.6719,35.0170,null,3,'洛西','野宫神社通往大河内山庄的竹林小径，风过竹梢沙沙作响。',-30,-4],
  ['常寂光寺','常寂光寺',135.6707,35.0222,'temple',3,'洛西','小仓山麓的红叶名所，多宝塔掩映在枫林之中。'],

  vb.x=lim(cx,vb.w/2,FULL.x,FULL.x+FULL.w)-vb.w/2; vb.y=lim(cy,vb.h/2,FULL.y,FULL.y+FULL.h)-vb.h/2;

  if(s.kind==='site'){
    card.className='';
    card.innerHTML=`<div class="band"><span class="no">其${s.no}</span><h2>${s.name}</h2><span class="jp">${s.jp}</span><button class="x" aria-label="关闭">×</button></div>
    <div class="cb"><div class="meta"><div><i>创建</i>${s.era}</div><div><i>所在</i>${s.addr}</div><div><i>交通</i>${s.access}</div></div>
    <div class="desc">${s.desc.map(p=>'<p>'+p+'</p>').join('')}</div>
    <div class="tags">${s.tags.map(t=>'<span>'+t+'</span>').join('')}</div>
    <div class="acts"><button class="go">进入 3D 导览 ▸</button><button class="alt">新标签页</button></div></div>`;
    card.querySelector('.go').onclick=()=>openScene(s);
    card.querySelector('.alt').onclick=()=>window.open(s.href,'_blank','noopener');
  }else{
    card.className='lm';
    card.innerHTML=`<div class="band"><span class="no">${s.area}</span><h2>${s.cn}</h2><button class="x" aria-label="关闭">×</button></div>
    <div class="cb"><div class="desc"><p>${s.desc}</p></div>
    <div class="acts"><button class="go" disabled>3D 导览筹备中</button></div></div>`;
  }
  card.querySelector('.x').onclick=closeCard;
  placeCard(s);
}
function placeCard(s){
  if(innerWidth<=760)return;
  const p=toScreen(s.x,s.y),cw=card.offsetWidth,ch=card.offsetHeight,ww=wrap.clientWidth,wh=wrap.clientHeight;
  let x,y=p.y-ch/2;
  if(s.kind==='site'){ // 卡片放在旗标的另一侧
    const flagLeft=s.flag==='l';x=flagLeft?p.x+34:p.x-34-cw;
    if(x<12)x=p.x+s.name.length*17+50; if(x+cw>ww-12)x=p.x-34-cw;
  }else{ // 名所标注可能在左或右，卡片避开 ±70
    x=p.x+70; if(x+cw>ww-12)x=p.x-70-cw;
  }
  x=Math.max(12,Math.min(ww-cw-12,x));y=Math.max(12,Math.min(wh-ch-12,y));
  card.style.left=x+'px';card.style.top=y+'px';
}
function closeCard(){card.classList.add('hidden');cur=null}

/* ===================== 场景浏览层 ===================== */
const viewer=document.getElementById('viewer'),vFrame=document.getElementById('vFrame');
function openScene(s){
  const p=toScreen(s.x,s.y),r=wrap.getBoundingClientRect();
  viewer.style.setProperty('--cx',(p.x+r.left)+'px');viewer.style.setProperty('--cy',(p.y+r.top)+'px');
  document.getElementById('vTitle').innerHTML=`${s.name}<small>${s.jp}</small>`;
  document.getElementById('vOpen').href=s.href;
  vFrame.src=s.href;viewer.classList.remove('hidden');
  history.pushState({site:s.id},'','#'+s.id);
}
function closeScene(fromPop){viewer.classList.add('hidden');setTimeout(()=>{if(viewer.classList.contains('hidden'))vFrame.src='about:blank'},650);
  if(!fromPop&&location.hash)history.back()}
document.getElementById('vBack').onclick=()=>closeScene(false);
addEventListener('popstate',()=>{const s=SITES.find(x=>'#'+x.id===location.hash);if(s){openCard(s);openScene(s)}else if(!viewer.classList.contains('hidden'))closeScene(true)});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!viewer.classList.contains('hidden'))closeScene(false);else closeCard()}});
document.getElementById('sideHead').onclick=()=>{if(innerWidth<=760)side.classList.toggle('open')};

/* ===================== 启动：默认铺满屏幕，聚焦洛中洛外 ===================== */

  const[cx,cy]=P(135.762,35.030);
  const w=innerWidth<=760?820:Math.min(maxW(),Math.max(1050,1180*Math.min(1,aspect())));
  vb={x:cx-w/2,y:cy-w/aspect()/2,w,h:w/aspect()};clamp();apply();

setTimeout(()=>document.getElementById('hint').style.opacity=0,6000);

window.__kyotoMap={SITES,LANDMARKS,openCard,openScene,flyTo,closeScene,P};
