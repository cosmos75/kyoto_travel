<!doctype html>
<html lang="zh-CN">

<title>京都下鸭神社 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#a3271b; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button,input{font:inherit}
button{cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.act{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 0 0}
.act:hover{background:var(--red);color:#fff}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(200,150,46,.08);font-size:14px}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#pVoice{margin:12px 0 0 6px;border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:6px 13px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(30,24,18,.82);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.show{opacity:1}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:600px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#a3271b;border-color:#a3271b}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
#eto{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#eto button{border:1px solid var(--line);background:var(--paper2);border-radius:6px;padding:4px 0;width:38px;font-size:13px}
#eto button:hover,#eto button.on{background:var(--red);color:#fff}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(1863);
const R = (a,b)=>a+(b-a)*rand();
const pickA = a=>a[Math.floor(rand()*a.length)];
const PI = Math.PI;
const V3 = THREE.Vector3;
const smoothstep01=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x);};
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.08, 6000);
camera.position.set(250,300,760);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.62; controls.minDistance = 0.3; controls.maxDistance = 950;
controls.target.set(-5,0,250);

const U = { uTime:{value:0}, uDusk:{value:0}, uSnow:{value:0} };

/* ---------------- site plan (x = east, z = south, metres; forest floor y ≈ 0) ----------------
   The 楼門 stands at the origin facing south. The 表参道 runs about 500 m south through 糺の森 to the
   南口 near 河合神社, where the forest narrows to the tip between the 鴨川 (west) and 高野川 (east).
   One stream threads the whole site: it rises in 御手洗池, flows south as 御手洗川 under 輪橋 and 橋殿,
   leaves the precinct as 奈良の小川 and runs the length of the forest, east of the approach, as 瀬見の小川.
   泉川 is the stone-lined channel along the forest's east edge; the 馬場 runs parallel to the west.  */
const GY=0;
const WATER_Y=-0.38;       // 御手洗池 / 御手洗川 / 奈良の小川 / 瀬見の小川 share one level (planar reflection)
const IZUMI_Y=-1.0, RIVER_Y=-2.7;
const STREAM=[[30,-57],[28,-50],[25,-40],[24,-28],[24,-12],[24,2],[27,16],[30,34],[29,55],[24,80],[18,105],[14,130],[12,160],[15,195],[11,230],[14,270],[9,310],[12,350],[8,390],[11,430],[16,462],[27,494],[45,526],[66,552],[80,572]];
const NARA_I=5, SEMI_I=11;  // vertex where 御手洗川 becomes 奈良の小川, and 奈良の小川 becomes 瀬見の小川
const IZUMI=[[86,-130],[85,0],[89,100],[85,200],[88,300],[84,400],[80,470],[73,520],[84,566]];
const KAMO=[[-150,-600],[-140,0],[-128,300],[-102,460],[-66,585],[-16,690],[12,800],[24,1200]];
const TAKA=[[250,-600],[208,0],[182,250],[150,430],[104,575],[34,688],[12,800]];
const MITA_POND={x:30,z:-62,rx:6.4,rz:4.6};
const APPROACH=[[0,600],[0,560],[0,520],[-1,480],[1,430],[3,380],[2,330],[0,280],[1,230],[0,180],[0,130],[0,80],[0,48],[0,20],[0,4]];
const KAWAI={x:-30,z:470};
const KAWAI_P=[[-1,476],[-10,472],[-17,471]];
const SIDE=[[2,300],[22,302],[46,306],[70,300],[83,296]];
const BABA={x:-24,z0:66,z1:436,w:7};
const PREC={x0:-52,x1:48,z0:-92,z1:52};   // gravel precinct around 楼門 / 中門 / 本殿
function segDist(px,pz,ax,az,bx_,bz){ const vx=bx_-ax, vz=bz-az; const t=Math.max(0,Math.min(1,((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz))); return Math.hypot(px-ax-vx*t,pz-az-vz*t); }
function polyDist(px,pz,P){ let d=1e9; for(let i=0;i<P.length-1;i++){ const q=segDist(px,pz,P[i][0],P[i][1],P[i+1][0],P[i+1][1]); if(q<d) d=q; } return d; }
function polyX(P,z){ for(let i=0;i<P.length-1;i++){ const [ax,az]=P[i],[bx_,bz]=P[i+1]; if(z>=az&&z<=bz) return ax+(bx_-ax)*(z-az)/(bz-az); } return P[z<P[0][1]?0:P.length-1][0]; }
const streamHW=z=>z<4?0.95:(z<130?1.05+0.25*Math.sin(z*0.07):1.25+0.45*Math.sin(z*0.043)+0.2*Math.sin(z*0.17));
function streamInfo(x,z){ let d=1e9,zz=0; for(let i=0;i<STREAM.length-1;i++){ const [ax,az]=STREAM[i],[bx_,bz]=STREAM[i+1]; const q=segDist(x,z,ax,az,bx_,bz); if(q<d){ d=q; zz=az+(bz-az)*Math.max(0,Math.min(1,((x-ax)*(bx_-ax)+(z-az)*(bz-az))/((bx_-ax)**2+(bz-az)**2))); } } return [d,streamHW(zz)]; }
const pondE=(x,z)=>Math.hypot((x-MITA_POND.x)/MITA_POND.rx,(z-MITA_POND.z)/MITA_POND.rz)/(1+0.05*Math.sin(Math.atan2(z-MITA_POND.z,x-MITA_POND.x)*3));
function riverH(d,w){ const hw=w/2; if(d<hw) return -3.4+0.5*sm(0,hw,d); if(d<hw+2) return -2.9+1.0*sm(hw,hw+2,d); if(d<hw+15) return -1.9; return -1.9+1.95*sm(hw+15,hw+18,d); }
const kamoD=(x,z)=>polyDist(x,z,KAMO), takaD=(x,z)=>polyDist(x,z,TAKA);
const KAMO_W=z=>z>690?50:36, TAKA_W=28;
function baseH(x,z){
  let h=0.16*Math.sin(x*0.05+z*0.031)+0.12*Math.sin(z*0.071-x*0.023)+0.08*Math.sin(x*0.13+z*0.11)+0.05*Math.sin(x*0.37-z*0.29);
  return Math.max(-0.12,h)+0.08;
}
function H(x,z){
  let h=baseH(x,z);
  const pd=Math.min(polyDist(x,z,APPROACH)-3.4,polyDist(x,z,KAWAI_P)-1.8);
  const flat=Math.max(sm(3,0,pd), (x>PREC.x0&&x<PREC.x1&&z>PREC.z0&&z<PREC.z1)?1:0, (Math.abs(x-BABA.x)<BABA.w/2+1.5&&z>BABA.z0-4&&z<BABA.z1+4)?1:0, (Math.abs(x-KAWAI.x)<15&&Math.abs(z-KAWAI.z)<14)?1:0);
  h=h*(1-flat)+0.06*flat;
  // stream channel (bed below WATER_Y, low earthen banks)
  const [ds,hw]=streamInfo(x,z);
  if(ds<hw+1.8){ const t=ds<hw?WATER_Y-0.5+0.36*sm(0,hw,ds):WATER_Y-0.14+(h-WATER_Y+0.14)*sm(hw,hw+1.8,ds); h=Math.min(h,t); }
  // 御手洗池
  const pe=pondE(x,z); if(pe<1.25){ const t=pe<1?WATER_Y-0.45+0.25*sm(0.2,1,pe):WATER_Y-0.1+(h-WATER_Y+0.1)*sm(1,1.25,pe); h=Math.min(h,t); }
  // 泉川: stone-lined, steep sides
  const di=polyDist(x,z,IZUMI); if(di<1.9) h=Math.min(h,-1.45+1.45*sm(1.25,1.6,di));
  if(onRoad(x,z)&&kamoD(x,z)>KAMO_W(z)/2+17&&takaD(x,z)>TAKA_W/2+17) h=0.1;
  // 鴨川 / 高野川
  h=Math.min(h,riverH(kamoD(x,z),KAMO_W(z)),riverH(takaD(x,z),TAKA_W));
  return h;
}
function pathD(x,z){ return Math.min(polyDist(x,z,APPROACH)-3.2,polyDist(x,z,KAWAI_P)-1.6,polyDist(x,z,SIDE)-0.9); }
const inPrec=(x,z,p=0)=>x>PREC.x0-p&&x<PREC.x1+p&&z>PREC.z0-p&&z<PREC.z1+p;
const inBaba=(x,z,p=0)=>Math.abs(x-BABA.x)<BABA.w/2+p&&z>BABA.z0-p&&z<BABA.z1+p;
const inKawai=(x,z,p=0)=>Math.abs(x-KAWAI.x)<13+p&&Math.abs(z-KAWAI.z)<11+p;
const roadX=z=>polyX(KAMO,z)+KAMO_W(z)/2+27;   // centre of 下鴨本通 along the forest's west side; it turns west onto 葵橋 at z≈455
const AOI_Z=455;
function onRoad(x,z){ if(z<AOI_Z+6&&Math.abs(x-roadX(Math.min(z,AOI_Z)))<6) return true; if(Math.abs(z-AOI_Z)<6&&x<roadX(AOI_Z)&&x>polyX(KAMO,AOI_Z)-60) return true; return Math.abs(z-640)<7; }
/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3a2a20',{roughness:.75}),
  woodMid:std('#6b4c33'),
  woodLight:std('#9b7a55',{roughness:.7}),
  woodNat:std('#7d6248',{roughness:.78}),
  woodFloor:std('#6f5139'),
  woodRed:std('#a8321f',{roughness:.6}),
  plaster:std('#ece5d4',{roughness:.95}),
  paper:std('#f4eedf',{roughness:.9,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  roof_tile:std('#4f5156',{roughness:.62,side:THREE.DoubleSide}),
  roof_shingle:std('#5e4a3a',{roughness:.9,side:THREE.DoubleSide}),
  roof_thatch:std('#7d6a4c',{roughness:1,side:THREE.DoubleSide}),
  fas_shingle:std('#4a3a2e',{roughness:.95}),
  fas_thatch:std('#6c5a3e',{roughness:1}),
  soffit:std('#5a3f2c',{roughness:.85,side:THREE.DoubleSide}),
  roofDark:std('#33353a',{roughness:.6}),
  shingleCap:std('#3e3128',{roughness:.9}),
  stone:std('#8f8b83',{roughness:.95}),
  stoneDark:std('#615e58',{roughness:.95}),
  granite:std('#a8a49a',{roughness:.9}),
  foundation:std('#77726a'),
  gold:std('#ffcf5e',{roughness:.3,metalness:0.88,side:THREE.DoubleSide,emissive:new THREE.Color('#b07818'),emissiveIntensity:0.3}),
  lacquer:std('#141210',{roughness:.3}),
  interior:std('#140f0c',{roughness:1}),
  bronze:std('#5c6a58',{roughness:.55,metalness:.6}),
  copper:std('#4f7a68',{roughness:.6,metalness:.4}),
  bark:std('#4a3b30',{roughness:1}),
  pineBark:std('#5a4334',{roughness:1}),
  lanternGlow:std('#d8c9a0',{emissive:new THREE.Color('#ffb24d'),emissiveIntensity:0}),
  chochin:std('#c8321f',{roughness:.8,emissive:new THREE.Color('#ff7744'),emissiveIntensity:0.05}),
  black:std('#1d1b19',{roughness:.6}),
  white:std('#f2f0ea',{roughness:.7}),
  rope:std('#c9b27a',{roughness:1}),
  bamboo:std('#a8955f',{roughness:.6}),
  felt:std('#b4241c',{roughness:1}),
  steel:std('#9aa1a6',{roughness:.35,metalness:.8}),
  asphalt:std('#46474a',{roughness:.9}),
  shu:std('#c43a22',{roughness:.55}),
  goldF:std('#e8b85a',{roughness:.35,metalness:.85}),
  roof_hiwada:std('#5a4232',{roughness:.92,side:THREE.DoubleSide}),
  fas_hiwada:std('#3e2e24',{roughness:.95}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);

function patchMat(mat,o){

    sh.uniforms.uTime=U.uTime; sh.uniforms.uDusk=U.uDusk; sh.uniforms.uSnow=U.uSnow; Object.assign(sh.uniforms,o.uniforms||{});

    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>

    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );

      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75*gust;

/* ---- batched boxes: every box becomes one instance of an InstancedMesh per material ---- */
const BX={}, IDQ=new THREE.Quaternion();
function bxM(key,m){ (BX[key]??=[]).push(m); }
function bx(key,x0,x1,y0,y1,z0,z1){ bxM(key,new THREE.Matrix4().compose(new V3((x0+x1)/2,(y0+y1)/2,(z0+z1)/2),IDQ,new V3(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0)))); }
function bxT(key,P,x0,x1,y0,y1,z0,z1){ const m=new THREE.Matrix4().compose(new V3((x0+x1)/2,(y0+y1)/2,(z0+z1)/2),IDQ,new V3(Math.abs(x1-x0),Math.abs(y1-y0),Math.abs(z1-z0))); m.premultiply(P); bxM(key,m); }

const boxMeshes={};

// local frame of one side of a rectangular building: x along the side, y up, z outward. k: 0=+z(south) 1=+x 2=-z 3=-x

}
function lattice(key,F,x0,x1,y0,y1,step,w=0.03,z=0){

// rectangular railing (高欄) around a deck
function railing(cx,cz,ex,ez,y,key,h=0.62,skip){

    bxT(key,F,-L,L,y,y+0.08,-0.05,0.05);

    for(let x=-L+0.25;x<L;x+=0.36) bxT(key,F,x-0.012,x+0.012,y+0.08,y+h*0.55,-0.015,0.015);

/* ---------------- curved roofs: tile / 杮葺 shingle / thatch buckets (concave slopes, upturned corners) ---------------- */
const RB={}, RAFT=[];
function rbk(k){ return RB[k]??={top:{p:[],t:[],i:[]},bot:{p:[],i:[]},fas:{p:[],t:[],i:[]}}; }
function roofPatch(A,B,C,D,o={}){
  const nu=o.nu||10, nv=o.nv||7, sag=o.sag??0.3, lift=o.lift??0.3, th=o.th??0.22, bk=rbk(o.b||'tile');
  const Le=A.distanceTo(B), Lt=D.distanceTo(C), Ls=A.clone().lerp(B,0.5).distanceTo(D.clone().lerp(C,0.5));
  const P=(u,v)=>{ const e=A.clone().lerp(B,u), t=D.clone().lerp(C,u); const p=e.lerp(t,v);
    p.y-=sag*Math.sin(PI*v)*(1-0.35*v); const cu=Math.abs(2*u-1); p.y+=lift*Math.pow(cu,5)*(1-v)*(1-v)*(o.liftEnds??1); return p; };

  const T=bk.top, base=T.p.length/3, bb=bk.bot.p.length/3;
  for(let j=0;j<=nv;j++) for(let i=0;i<=nu;i++){ const u=i/nu,v=j/nv, p=P(u,v);

    bk.bot.p.push(p.x,p.y-th,p.z); }

  for(let j=0;j<nv;j++) for(let i=0;i<nu;i++){ const a=j*W+i,b=a+1,c=a+W,d=c+1;
    if(!flip){ T.i.push(base+a,base+b,base+c, base+b,base+d,base+c); bk.bot.i.push(bb+a,bb+c,bb+b, bb+b,bb+c,bb+d); }
    else { T.i.push(base+a,base+c,base+b, base+b,base+c,base+d); bk.bot.i.push(bb+a,bb+b,bb+c, bb+b,bb+d,bb+c); } }

  for(let i=0;i<nu;i++){ const a=fb+i*2; F.i.push(a,a+1,a+2, a+1,a+3,a+2); }

function capLine(P,u,v0,v1,w=0.24,h=0.2,n=6,key='roofDark'){ for(let k=0;k<n;k++){ const a=P(u,v0+(v1-v0)*k/n), b=P(u,v0+(v1-v0)*(k+1)/n); a.y+=0.07; b.y+=0.07; beam(key,a,b,w,h); } }

// four-sided roof from an eave rectangle (half ex,ez at y0) to an inner rectangle (half ix,iz at y1) or a point
function hipRoof(cx,cz,y0,ex,ez,y1,ix,iz,o={}){
  const p=(x,y,z)=>new V3(cx+x,y,cz+z); const Ps=[];

 {id:'minami',name:'糺之森·南口',jp:'糺の森 南口 · 表参道',marker:[0,8.5,526],view:{p:E(0,1.65,548),t:[0,6,500]},
  text:`<p>糺之森是下鸭神社的“社叶之森”，位于鸭川与高野川交汇处北侧的三角地带，面积约12.4万平方米。森林作为神社境内的一部分被指定为国家史迹，1994年随下鸭神社一起列入世界遗产“古都京都的文化财”。</p>
  <p>林中以榉树、朴树（椋木）、糙叶树等落叶阔叶树为主，混有樟树、栲树等常绿树，据说保留了京都盆地原有的植被，树龄二百至六百年的古木约有六百棵。“糺”的来历说法不一：一说两河交汇的沙洲古称“只洲”，一说这里是“纠正伪诈”、由神明裁断是非的地方。</p>
  <p>沿表参道向北走，大约十分钟能到楼门。</p>`},
 {id:'kawai',name:'河合神社·镜绘马',jp:'河合神社 · 鏡絵馬 · 方丈',marker:[KAWAI.x-1,8,KAWAI.z-1],view:{p:E(-6,1.65,482),t:[-26,2.4,470]},
  text:`<p>表参道入口西侧的河合神社是下鸭神社的第一摄社，供奉玉依姬命（神武天皇之母），自古被奉为女性的守护神，人们来此祈求美丽、安产与育儿。</p>
  <p>这里最有名的是手镜形的“镜绘马”：用自己的化妆品（或借社务所的彩色铅笔）在绘马的脸上“化妆”，背面写下心愿挂起来。</p>
  <p>院内复原了鸭长明的“方丈庵”。鸭长明是下鸭神社禰宜之子，没能继任河合社的禰宜，后来隐居山中，1212年写成《方丈记》，开篇便是“逝川流水不绝，而水已非原水”。草庵一丈见方（约3米），可以拆开搬走。</p>`,acts:[['挂一个镜绘马',()=>{ hangEma(false); }]]},
 {id:'sando',name:'表参道·古木之森',jp:'糺の森 · 表参道',marker:[0,7,392],view:{p:E(1.5,1.65,410),t:[-3,11,352]},
  text:`<p>表参道两旁的大树多是榉树和朴树，高的有二三十米，树冠在头顶合拢，阳光只从缝隙里漏下来，形成一束束光柱。下层是栲、樫、椿、杨桐等常绿小树，再往下是青木、蕨类和厚厚的落叶，层次分明。</p>
  <p>森林也会受伤：大风会刮倒老树，林中可以看到倒木和老树桩，以及围着注连绳的古树。新绿在5月前后；红叶比京都其他地方晚，一般在11月下旬到12月中旬。</p>
  <p>右上角可以切换“季节”和“时间”，清晨有薄雾，黄昏会亮起石灯笼。</p>`,acts:[['抬头看树冠',()=>lookUp()]]},
 {id:'semi',name:'濑见小川',jp:'瀬見の小川',marker:[13,3.5,276],view:{p:[10.6,2.0,301.6],t:[13,0,276]},
  text:`<p>表参道东侧这条清浅的小溪叫“濑见小川”。它与上游的“奈良小川”“御手洗川”其实是同一股水：从神社深处的御手洗池涌出，一路向南穿过森林。</p>
  <div class="quote">石川や 瀬見の小川の 清ければ 月も流れを 尋ねてぞすむ<br><span style="font-size:12px">（石川濑见小川清澈，连月亮也循着流水来此栖居）——鸭长明，《新古今和歌集》</span></div>
  <p>点一下水面看看涟漪。溪中常有白鹭觅食，点它会飞起来。</p>`},
 {id:'baba',name:'马场·流镝马',jp:'糺の森 馬場 · 流鏑馬神事',marker:[BABA.x,4,250],view:{p:E(-14,1.9,262),t:[-24,1.4,226]},
  text:`<p>表参道西侧这条笔直的沙道是马场。每年5月3日，这里举行“流镝马神事”，作为葵祭（5月15日）的前仪之一：骑手穿着狩装束、戴绫蔺笠，策马疾驰，在奔跑中依次射击沿途的三块木靶，祈求葵祭平安。</p>
  <p>每年8月盂兰盆前后，马场还会摆满书摊，举办“下鸭纳凉旧书市”。</p>`,acts:[['观看流镝马',()=>startYabusame()]]},
 {id:'nara',name:'奈良小川·萤火',jp:'奈良の小川 · 蛍火の茶会',marker:[17,3.5,118],view:{p:E(6,1.6,140),t:[16,0.2,116]},
  text:`<p>神社流出的溪水在这一段叫“奈良小川”，再往南就成了濑见小川。溪边湿润，蕨类长得格外茂盛。</p>
  <p>每年6月，下鸭神社会举办“萤火茶会”：傍晚在御手洗川与糺之森一带放飞萤火虫，人们在林中品茶赏萤。夏季黄昏时来这里，能看到溪面上一明一灭的萤光。</p>`,acts:[['夏夜看萤火',()=>fireflyNight()]]},
 {id:'torii',name:'南口鸟居',jp:'南口鳥居 · 賀茂御祖神社',marker:[0,12.5,48],view:{p:E(0,1.65,86),t:[0,6.5,48]},
  text:`<p>走出森林，朱红的大鸟居立在楼门前。下鸭神社的正式名称是“贺茂御祖神社”，与上贺茂神社（贺茂别雷神社）合称“贺茂社”，是京都最古老的神社之一，也是山城国一之宫。</p>
  <p>“御祖”是祖先的意思：这里供奉上贺茂祭神贺茂别雷命的母亲玉依媛命，以及她的父亲贺茂建角身命。京都三大祭之一的葵祭（5月15日），行列从京都御所出发，经下鸭神社前往上贺茂神社。神社每21年举行一次“式年迁宫”，修缮社殿。</p>`},
 {id:'aioi',name:'相生社·连理贤木',jp:'相生社 · 連理の賢木',marker:[-16,6.5,24],view:{p:E(-6,1.65,36),t:[-17,2.2,24]},
  text:`<p>楼门前西侧的小社是相生社，供奉产灵之神，主管缘结。旁边的“连理贤木”是两棵树在半腰处长成一体的神木，象征夫妻和合、家庭圆满，现在已是第四代。据说老树将要枯死时，糺之森中就会自然长出下一代。</p>
  <p>参拜方法是写好缘结绘马，绕相生社与连理贤木三圈（男女方向相反），再把绘马挂上。</p>`,acts:[['绕连理贤木三圈',()=>circleRenri()]]},
 {id:'romon',name:'楼门',jp:'楼門 · 東西回廊',marker:[0,16,0],view:{p:E(0,1.65,24),t:[0,6.8,0]},
  text:`<p>朱漆的两层楼门，左右连着东西回廊，屋顶用桧树皮层层铺成（桧皮葺），是国家重要文化财。下鸭神社现存的社殿大多是江户初期式年迁宫时造替的，本殿以外共有三十余栋列为重要文化财。</p>
  <p>楼门开门时间大约是早上6点半到下午5点。穿过门洞，就进入神社的中心区域。</p>`},
 {id:'maidono',name:'舞殿·桥殿·细殿',jp:'舞殿 · 橋殿 · 細殿',marker:[0,10,-17],view:{p:E(-3,1.65,-6.5),t:[6,2.8,-17]},
  text:`<p>楼门内正中的是舞殿。葵祭当天的“社头之仪”，敕使在这里奏上御祭文，并奉纳“东游”等舞乐。</p>
  <p>东侧跨在御手洗川上的是桥殿，西侧是细殿，三者都没有墙或只有部分墙，是举行神事与奉纳的建筑。新年、节分、名月等节日时，这里会有各种奉纳演出。</p>`},
 {id:'rinbashi',name:'轮桥·光琳之梅',jp:'御手洗川 · 輪橋 · 光琳の梅',marker:[26,5,-49],view:{p:E(36,1.7,-35.5),t:[27.5,1.4,-48]},via:[[10,2,-10],[14,2,-30],[26,2,-35]],
  text:`<p>御手洗川上这座朱红的拱桥叫“轮桥”，是举行仪式用的桥，平时不能通行。桥畔那株红梅叫“光琳之梅”：据说尾形光琳的国宝《红白梅图屏风》（藏于热海MOA美术馆），画中两株梅树与中间的流水，就是以这里为灵感。</p>
  <p>花期大约在2月下旬到3月中旬。切换到“冬雪”季节可以看到梅花开放。</p>`,acts:[['看梅花',()=>{ seasonIdx=3; applySeason(); toast('早春二月，光琳之梅开了'); }]]},
 {id:'mitarashi',name:'御手洗社·御手洗池',jp:'御手洗社（井上社）· 御手洗池',marker:[30,6.5,-66],view:{p:E(36,1.65,-52),t:[30,0.4,-63]},via:[[30,2,-42]],
  text:`<p>御手洗川的源头御手洗池上方，立着御手洗社（井上社），供奉祓除罪秽的濑织津姬命。</p>
  <p>每年夏季土用丑日前后举行“御手洗祭（足浸神事）”：人们赤脚走进冰凉的池水，点一支蜡烛供上，祈求无病息灾。传说池底会不断涌出水泡，名吃“御手洗团子”（みたらし団子）就是模仿水泡的样子做成的；也有说法认为一串五颗代表人的头与四肢。</p>`,acts:[['看水泡涌出',()=>{ bubBurst=6; toast('咕嘟咕嘟——水泡从池底涌了上来'); }]]},
 {id:'gensha',name:'言社·本殿',jp:'中門 · 言社 · 東西本殿（国宝）',marker:[0,9,-60],view:{p:E(0,2.3,-43.6),t:[0,3.4,-68]},via:[[30,2,-40],[12,2,-33],[0,2,-34]],
  text:`<p>进入中门，左右两排七座小社叫“言社”，供奉大国主命的七个名字，按十二生肖分别守护：子—大国主命，丑与亥—大物主命，寅与戌—大己贵命，卯与酉—志固男命，辰与申—大国魂命，巳与未—显国魂命，午—八千矛命。点下面的生肖，找到自己的守护社。</p>
  <p>最深处瑞垣内并立着东、西两座本殿，都是国宝：西殿供奉贺茂建角身命，东殿供奉玉依媛命。两座都是三间社流造，屋顶为桧皮葺，现在的建筑造替于1863年（文久3年）。参拜在本殿前的祝词舍一带进行，礼法是二拜、二拍手、一拜。</p>`,acts:[['参拜（二拜二拍手一拜）',()=>sanpai()]],eto:true},
];
const OVERVIEW={name:'下鸭神社 全景',jp:'賀茂御祖神社 · 京都市左京区下鴨泉川町',view:{p:[250,300,760],t:[-5,0,250]},
  text:`<p><b>贺茂御祖神社</b>，通称下鸭神社，坐落在鸭川与高野川汇流处的北侧，南面是绵延约五百米的糺之森。社传称其起源早于平安京建都，奈良时代以前已有祭祀；平安时代起作为王城镇护之神受到朝廷崇敬。1994年作为“古都京都的文化财”之一列入世界遗产。</p>
  <p>参拜路线由南向北：<b>糺之森南口 → 河合神社 → 表参道 → 濑见小川 → 马场 → 奈良小川 → 南口鸟居 → 相生社 → 楼门 → 舞殿 → 轮桥 → 御手洗池 → 言社·本殿</b>。金色线为路线。</p>
  <p style="font-size:12px;color:#7a6f63">注：场景依据公开资料做示意复原。各建筑与溪流、马场的相对位置大致符合实际，尺寸为推定；言社的排列、树木种类与数量、周边街区为示意。</p>`};
// keep the forest clear of every camera position and its line of sight
const VIEWPTS=[], VIEWLANES=[];
for(const h of HS){ const c=h.view.p, t=h.view.t; VIEWPTS.push([c[0],c[2]]); VIEWLANES.push([c[0],c[2],c[0]+(t[0]-c[0])*0.85,c[2]+(t[2]-c[2])*0.85]);
  let best=null, bd=1e9; for(const [x,z] of APPROACH){ const d=Math.hypot(x-c[0],z-c[2]); if(d<bd){ bd=d; best=[x,z]; } } if(bd<40) VIEWLANES.push([c[0],c[2],best[0],best[1]]); }

/* ================= 糺の森 ================= */
// Instanced meshes are split into bands along z so the camera and the sun's shadow camera cull most of the forest.
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const CHUNKED=[];
function makeChunks(geo,mat,items,o={}){
  const band=o.band??80, groups={}; items.forEach((it,i)=>{ const k=Math.floor(it.p[2]/band)+'_'+Math.floor(it.p[0]/(o.bandX??400)); (groups[k]??=[]).push(i); });
  const list=[]; for(const k in groups){ const idx=shuffle(groups[k]); const im=makeInst(geo,mat,idx.map(i=>items[i]),o.shadow??true); im.userData.idx=idx; im.userData.full=idx.length; list.push(im); }
  const ch={list,items,lod:o.lod??1}; CHUNKED.push(ch); return ch;
}
function recolor(ch,fn){ for(const im of ch.list){ im.userData.idx.forEach((ii,j)=>im.setColorAt(j,fn(ch.items[ii],ii))); if(im.instanceColor) im.instanceColor.needsUpdate=true; } }
function setChunkVisible(ch,v){ for(const im of ch.list) im.visible=v; }

/* ---- bark: grey zelkova, fissured muku / enoki, furrowed camphor; moss creeps up the damp north side ---- */
M.fbark=std('#ffffff',{roughness:1});
patchMat(M.fbark,{snow:[0.75,0.95,0.7],
  color:`vec2 bq=vec2(atan(vWN.z,vWN.x)*2.0,vW.y*0.55); float fis=vnoise(vec3(bq.x*2.2,bq.y*1.2,vW.x*0.3+vW.z*0.3));
    float fl=smoothstep(0.35,0.7,vnoise(vec3(bq*3.5,2.0)));
    diffuseColor.rgb*=0.62+0.5*smoothstep(0.25,0.62,fis)+0.12*fl;
    diffuseColor.rgb*=0.85+0.25*fbm(vW*1.4);
    float moss=smoothstep(3.5,0.0,vW.y-0.0)*0.85+smoothstep(0.1,-0.7,vWN.z)*0.45*smoothstep(9.0,2.0,vW.y);
    moss*=smoothstep(0.4,0.65,fbm(vW*1.9+3.0)+0.15);
    diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.25,0.33,0.13)*(0.8+0.4*vnoise(vW*9.0)),clamp(moss,0.,0.9));`,
  normal:bumpH('smoothstep(0.25,0.62,vnoise(vec3(atan(vWN.z,vWN.x)*4.4,vW.y*0.66,vW.x*0.3+vW.z*0.3)))*0.05+vnoise(vW*7.0)*0.012',1.0)});
const FB=[];   // forest branches: [a,b,r,colour]
function fbranch(a,b,r,c){ FB.push([a.clone(),b.clone(),r,c]); }
function flushForestBranches(){
  const mkGeo=(rs,hs,open)=>{ const g=new THREE.CylinderGeometry(1,1,1,rs,hs,open); g.translate(0,0.5,0); const pp=g.attributes.position;
    for(let i=0;i<pp.count;i++){ const y=pp.getY(i); pp.setX(i,pp.getX(i)*(1-0.3*y)); pp.setZ(i,pp.getZ(i)*(1-0.3*y)); } g.computeVertexNormals(); return g; };
  const up=new V3(0,1,0), thick=[], thin=[];
  for(const [a,b,r,c] of FB){ const d=b.clone().sub(a), len=d.length(); if(len<1e-3) continue; _q.setFromUnitVectors(up,d.normalize()); _e.setFromQuaternion(_q);
    (r>0.16?thick:thin).push({p:[a.x,a.y,a.z],r:[_e.x,_e.y,_e.z],s:[r,len*1.03,r],c}); }
  makeChunks(mkGeo(11,4,false),M.fbark,thick); makeChunks(mkGeo(5,1,true),M.fbark,thin,{lod:0.6});
}
// buttress flare at the foot of the old trunks
const flareGeo=(()=>{ const pts=[]; for(let i=0;i<=10;i++){ const t=i/10; pts.push(new THREE.Vector2(1+1.9*Math.pow(1-t,3),t*2.4)); } const g=new THREE.LatheGeometry(pts,22); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i), a=Math.atan2(z,x), k=1+0.35*Math.pow(Math.max(0,Math.sin(a*5+0.7)),2)*Math.pow(1-y/2.4,2); p.setX(i,x*k); p.setZ(i,z*k); p.setY(i,y-0.25); } g.computeVertexNormals(); return g; })();
const FLARES=[];

/* ---- leaf shapes ---- */
function ovalLeafGeo(len,w,tipK=0.3){ const s=new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(w,len*0.15,w*1.05,len*0.6,0,len); s.bezierCurveTo(-w*1.05,len*0.6,-w,len*0.15,0,0); return new THREE.ShapeGeometry(s,3); }
function heartLeafGeo(r){ const s=new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(r*0.9,-r*0.1,r*1.2,r*0.9,0,r*1.25); s.bezierCurveTo(-r*1.2,r*0.9,-r*0.9,-r*0.1,0,0); return new THREE.ShapeGeometry(s,4); }
function spray(geo,n,spread){ const g=leafCluster(geo,n,spread,0.6,0.3); return canopyNormals(g,0.6); }

/* ---- species ---- */
const SP={
  keyaki:{trunk:[5.5,8],r:[0.42,0.7],limbs:[5,7],up:[0.95,1.25],len:[8,11],blob:[2.2,2.9],flat:0.55,leaf:spray(ovalLeafGeo(0.11,0.035),8,0.34)},
  muku:  {trunk:[4,6.5],r:[0.4,0.62],limbs:[4,6],up:[0.55,0.9],len:[7,10],blob:[2.4,3.1],flat:0.62,leaf:spray(ovalLeafGeo(0.12,0.05),7,0.36)},
  kusu:  {trunk:[2.6,4.2],r:[0.5,0.85],limbs:[5,7],up:[0.45,0.8],len:[6.5,9.5],blob:[2.6,3.3],flat:0.72,leaf:spray(ovalLeafGeo(0.11,0.045),8,0.34),ever:true},
  shii:  {trunk:[1.6,3],r:[0.14,0.26],limbs:[3,4],up:[0.6,1.0],len:[2.2,3.6],blob:[1.2,1.8],flat:0.8,leaf:spray(ovalLeafGeo(0.1,0.045),7,0.3),ever:true},
};
const TREES={}; for(const k in SP) TREES[k]={blobs:[],cards:[],tips:[]};
const BARKC={keyaki:['#8a857a','#7d786d','#938d80'],muku:['#7a7266','#6e675c','#827a6c'],kusu:['#5f4a3a','#6a5444','#56443a'],shii:['#4e4a42','#5a554b']};
const BIG=[];   // {x,z,r,kind}
function tree(kind,x,z,s,detail){
  const sp=SP[kind], st=TREES[kind], bc=pickA(BARKC[kind]);
  const y0=H(x,z)-0.12, b0=new V3(x,y0,z);
  const th=R(...sp.trunk)*s, r0=R(...sp.r)*s, lean=R(0,6.28), lk=R(0,0.1);
  const t1=b0.clone().add(new V3(Math.cos(lean)*lk*th*0.5,th*0.55,Math.sin(lean)*lk*th*0.5));
  const t2=t1.clone().add(new V3(Math.cos(lean)*lk*th*0.45+R(-0.25,0.25),th*0.45,Math.sin(lean)*lk*th*0.45+R(-0.25,0.25)));
  fbranch(b0,t1,r0,bc); fbranch(t1,t2,r0*0.82,bc);
  if(kind!=='shii'){ FLARES.push({p:[x,y0,z],r:[0,R(0,6.28),0],s:[r0,r0*R(0.8,1.15),r0],c:bc}); BIG.push({x,z,r:r0,kind,top:t2}); }
  if(detail&&kind!=='shii'){ const nr=Math.floor(R(3,6)); for(let k=0;k<nr;k++){ const a=k/nr*6.28+R(-0.4,0.4), L=R(1.6,3.4)*s; fbranch(b0.clone().add(new V3(Math.cos(a)*r0*0.9,0.25,Math.sin(a)*r0*0.9)),new V3(x+Math.cos(a)*L,H(x+Math.cos(a)*L,z+Math.sin(a)*L)-0.1,z+Math.sin(a)*L),r0*0.36,bc); } }
  const nl=Math.round(R(...sp.limbs)), tips=[];
  for(let i=0;i<nl;i++){
    const a=i/nl*6.28+R(-0.35,0.35), el=R(...sp.up), L=R(...sp.len)*s;
    const base=(kind==='keyaki')?t2.clone().add(new V3(R(-0.2,0.2),R(-0.6,0),R(-0.2,0.2))):t1.clone().lerp(t2,R(0.35,1));
    const dv=new V3(Math.cos(a)*Math.cos(el),Math.sin(el),Math.sin(a)*Math.cos(el));
    const mid=base.clone().addScaledVector(dv,L*0.52).add(new V3(R(-0.4,0.4),R(-0.2,0.4),R(-0.4,0.4)));
    const dv2=dv.clone().add(new V3(0,kind==='keyaki'?0.15:-0.12,0)).normalize();
    const tip=mid.clone().addScaledVector(dv2,L*0.48);
    fbranch(base,mid,r0*0.5,bc); fbranch(mid,tip,r0*0.34,bc);
    tips.push(tip);
    if(detail){ for(let j=0;j<3;j++){ const p=mid.clone().lerp(tip,R(0,0.8)); const d3=dv.clone().add(new V3(R(-0.7,0.7),R(0,0.6),R(-0.7,0.7))).normalize(); const q=p.clone().addScaledVector(d3,L*R(0.25,0.4)); fbranch(p,q,r0*0.15,bc); tips.push(q);
        for(let k=0;k<2;k++) fbranch(q,q.clone().add(new V3(R(-1,1),R(0.2,0.9),R(-1,1)).multiplyScalar(s*1.1)),0.035*s,bc); } }
  }
  const c=new V3(); tips.forEach(t=>c.add(t)); c.multiplyScalar(1/tips.length);
  const nb=detail?tips.length:Math.min(tips.length,8);

function flyTo(view,via){

  const p0=camera.position.clone(), t0=controls.target.clone(), p1=V(view.p), t1=V(view.t);
  const d=p0.distanceTo(p1); const pts=[p0];
  const ground=p0.y-H(p0.x,p0.z)<6&&p1.y-H(p1.x,p1.z)<6;
  if(via&&ground) via.forEach(v=>{ if(p0.distanceTo(V(v))>3) pts.push(V(v)); });
  else if(ground&&d>15){ const lo=Math.min(p0.z,p1.z)+7, hi=Math.max(p0.z,p1.z)-7; const P=APPROACH.filter(([x,z])=>z>lo&&z<hi).map(([x,z])=>new V3(x+(p0.x+p1.x)*0.04,H(x,z)+1.9,z)); P.sort((a,b)=>p1.z<p0.z?b.z-a.z:a.z-b.z); pts.push(...P); }
  else if(d>6){ const mid=p0.clone().lerp(p1,0.5); mid.y+=Math.min(60,d*0.25); mid.y=Math.max(mid.y,Math.min(p0.y,p1.y)); pts.push(mid); }
  pts.push(p1);
  const curve=pts.length>2?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null; const L=curve?curve.getLength():d;
  fly={curve,p0,p1,t0,t1,start:performance.now(),dur:Math.min(ground?11000:6000,Math.max(1400,900+L*(ground?42:30))),ground};

}
