<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都诗仙堂 3D 导览</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f1e6; --paper2:#fffaf0; --gold:#c8962e; --red:#9e2b1e; --mute:#7a6f63;
  --glass:rgba(250,246,236,.92); --line:rgba(60,45,30,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1a17;color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun","Hiragino Mincho ProN",serif;}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
button{font:inherit;cursor:pointer}
#brand{position:fixed;left:18px;top:14px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:28px;letter-spacing:.35em;font-weight:600}
#brand small{display:block;font-size:12px;letter-spacing:.18em;opacity:.9;margin-top:2px}
#toolbar{position:fixed;right:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:6;max-width:calc(100% - 200px)}
.tb{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb:hover{background:#fff}
.tb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:rgba(30,24,18,.72);color:#fff;font-size:12px;padding:3px 9px 3px 4px;border-radius:999px;border:1px solid rgba(255,220,150,.55);
  transition:opacity .2s, background .2s;display:flex;align-items:center;gap:5px}
.lbl b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px}
.lbl:hover,.lbl.cur{background:var(--red)}
#panel{position:fixed;right:14px;top:62px;width:360px;max-height:calc(100% - 160px);overflow:auto;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.28);
  transition:transform .35s, opacity .35s}
#panel.hidden{opacity:0;transform:translateX(30px);pointer-events:none}
#pClose{position:absolute;right:10px;top:8px;border:0;background:none;font-size:22px;color:var(--mute)}
#pNum{font-size:12px;color:var(--red);letter-spacing:.2em}
#pTitle{margin:4px 0 2px;font-size:22px;letter-spacing:.12em}
#pJp{font-size:12px;color:var(--mute);margin-bottom:10px;letter-spacing:.08em}
#pBody{font-size:14px;line-height:1.85;text-align:justify}
#pBody p{margin:.4em 0}
#pExtra{margin-top:10px}
.poets{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px}
.poets button{border:1px solid var(--line);background:var(--paper2);border-radius:6px;padding:4px 0;font-size:12px}
.poets button:hover,.poets button.on{background:var(--red);color:#fff}
.quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--gold);background:rgba(200,150,46,.08);font-size:14px}
#pGo{margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px}
#tour{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:6;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:calc(100% - 20px)}
#tour .nav{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
#tour .nav.play.on{background:var(--red)}
#dots{display:flex;gap:5px;align-items:center;overflow-x:auto;padding:2px}
#dots button{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:11px;color:var(--ink);padding:0}
#dots button.cur{background:var(--red);color:#fff;border-color:var(--red)}
#dots button.done{background:#e8dcc4}
#stopName{font-size:13px;min-width:92px;text-align:center;white-space:nowrap}
#tip{position:fixed;left:18px;bottom:20px;color:#fff;font-size:12px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;pointer-events:none}
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(20,16,12,.55),rgba(10,8,6,.88));color:#f3ead8;transition:opacity .8s}
#intro.gone{opacity:0;pointer-events:none}
#intro .card{text-align:center;max-width:560px;padding:24px}
#intro h2{font-size:54px;letter-spacing:.4em;margin:0 0 4px;font-weight:600;padding-left:.4em}
#intro .sub{letter-spacing:.3em;font-size:13px;opacity:.85}
#intro p{line-height:1.9;font-size:14px;opacity:.92;margin:18px 0 22px}
#intro .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#intro button{border:1px solid #e8d6ae;background:transparent;color:#f3ead8;padding:10px 22px;border-radius:999px;font-size:15px;letter-spacing:.15em}
#intro button.main{background:#9e2b1e;border-color:#9e2b1e}
#loading{margin-top:16px;font-size:12px;opacity:.7}
@media (max-width:720px){
  #brand h1{font-size:20px}
  #toolbar{max-width:calc(100% - 130px);top:10px}
  .tb{padding:5px 10px;font-size:12px}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:70px;max-height:46%}
  #tip{display:none}
  #brand small{display:none}
  #stopName{display:none}
  #intro h2{font-size:38px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<body>
<div id="app"></div>
<div id="labels"></div>
<header id="brand"><h1>诗仙堂</h1><small>SHISENDŌ · 凹凸窠 · 京都一乗寺</small></header>
<div id="toolbar">
  <button class="tb" id="bOverview">总览布局</button>
  <button class="tb" id="bRoute">游览路线</button>
  <button class="tb on" id="bLabels">标签</button>
  <button class="tb" id="bSeason">季节：红叶</button>
  <button class="tb" id="bTime">时间：白昼</button>
  <button class="tb" id="bSound">声音：关</button>
  <button class="tb" id="bQuality">画质：高</button>
</div>
<aside id="panel" class="hidden">
  <button id="pClose" aria-label="关闭">×</button>
  <div id="pNum"></div>
  <h2 id="pTitle"></h2>
  <div id="pJp"></div>
  <div id="pBody"></div>
  <div id="pExtra"></div>
  <button id="pGo">前往此处</button>
</aside>
<nav id="tour">
  <button class="nav" id="tPrev">‹ 上一处</button>
  <div id="dots"></div>
  <span id="stopName">—</span>
  <button class="nav" id="tNext">下一处 ›</button>

<div id="tip">拖动旋转 · 滚轮缩放 · 右键平移 · 点击金色标记或建筑查看介绍 · ← → 切换景点</div>
<div id="intro">
  <div class="card">
    <h2>诗仙堂</h2>
    <div class="sub">詩仙堂 · 石川丈山の山荘 · 1641</div>
    <p>江户初期文人石川丈山在京都东北的一乘寺山麓，依坡筑起隐居之所“凹凸窠”。<br>
    从门口的“小有洞”出发，沿竹林石阶穿过“老梅关”，进入悬挂三十六诗仙像的诗仙之间，<br>再走进白砂与皋月杜鹃的庭园，听一听僧都敲石的声音。</p>
    <div class="btns">
      <button class="main" id="iTour">从门口开始参观</button>
      <button id="iFree">先看整体布局</button>
    </div>
    <div id="loading">正在生成场景……</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(20241113);
const R = (a,b)=>a+(b-a)*rand();
const PI = Math.PI;

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('#app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.08, 1500);
camera.position.set(52,48,62);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = PI*0.64; controls.minDistance = 0.3; controls.maxDistance = 260;
controls.target.set(-8,0,8);

const U = { uTime:{value:0} };

/* ---------------- terrain height ---------------- */
const sm=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const PATH=[[-62,4],[-46.5,4],[-38,2],[-30,-2],[-24,-4],[-14,-4]];
function pathZ(x){
  if(x<=PATH[0][0]) return PATH[0][1];
  for(let i=1;i<PATH.length;i++){const [x0,z0]=PATH[i-1],[x1,z1]=PATH[i]; if(x<=x1) return z0+(z1-z0)*(x-x0)/(x1-x0);}
  return PATH[PATH.length-1][1];
}
const boxMask=(x,z,x0,x1,z0,z1,f)=>sm(x0-f,x0,x)*sm(x1+f,x1,x)*sm(z0-f,z0,z)*sm(z1+f,z1,z);
function baseH(x,z){
  let h=-3.5+3.5*sm(20,13,z);
  const w=sm(-17,-24,x);
  const ap=-3.5+3.5*sm(-47,-21,x);
  h=h*(1-w)+ap*w;
  if(z<-12) h+=Math.pow(-z-12,1.25)*0.45;
  if(x>26) h+=(x-26)*0.32;
  if(z>42) h+=(z-42)*0.35;
  if(x<-64) h+=(-64-x)*0.3;
  return h;
}
function core(x,z){
  return Math.max(
    boxMask(x,z,-16,16,-12,14,3),
    boxMask(x,z,-15,24,17,39,3),
    sm(4,1.8,Math.abs(z-pathZ(x)))*sm(-68,-62,x),
    boxMask(x,z,-70,-48,-30,30,2)
  );
}
function Hb(x,z){
  const n=Math.sin(x*0.21+1.3)*Math.cos(z*0.17)*0.9+Math.sin(x*0.53+z*0.41)*0.35+Math.sin(x*1.3-z*1.1)*0.12;
  return baseH(x,z)+n*(1-core(x,z));
}
// stream course, densified; terrain is carved along it so the water runs in a real bed
const STREAM_PTS=[[-13,19.3],[-11.2,21.3],[-8,22.6],[-4,23.6],[-1.2,25.5],[2,27.4],[4.8,27.2],[7.6,25.6],[10.6,24.6],[14,24.4],[19,25],[24,26.3],[29,28.6]];
const STREAM_D=new THREE.CatmullRomCurve3(STREAM_PTS.map(([x,z])=>new THREE.Vector3(x,0,z))).getSpacedPoints(300).map(v=>[v.x,v.z]);
function streamDist(x,z){ if(x<-16||x>32||z<17||z>32) return 99; let m=1e9; for(let i=0;i<STREAM_D.length;i++){ const a=x-STREAM_D[i][0], b=z-STREAM_D[i][1], d=a*a+b*b; if(d<m) m=d; } return Math.sqrt(m); }
const POND={x:2,z:28,rx:3.6,rz:2.8};
const pondE=(x,z)=>Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz);
function carve(x,z){
  const d=streamDist(x,z); if(d>3) return 0;
  const e=pondE(x,z), f=Math.hypot((x+13)/1.5,(z-19.6)/1.2);
  return Math.max(0.38*sm(1.0,0.32,d), 0.72*sm(1.08,0.45,e), 0.55*sm(1.05,0.3,f));
}
function H(x,z){ return Hb(x,z)-carve(x,z); }

/* ---------------- materials ---------------- */
const std=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.85,metalness:0},o));
const M={
  woodDark:std('#3b2a1f',{roughness:.75}),
  woodMid:std('#6e4f34'),
  woodLight:std('#9b7a55',{roughness:.7}),
  woodFloor:std('#7a5c3e'),
  plaster:std('#e6dcc6',{roughness:.95}),
  plasterOut:std('#cfbf9f',{roughness:.95}),
  fusuma:std('#efe6cf',{roughness:.9}),
  paper:std('#f4eedf',{roughness:.9,emissive:new THREE.Color('#ffcf88'),emissiveIntensity:0}),
  tatami:std('#c2b277',{roughness:.95}),
  tatamiEdge:std('#2b3526'),
  roof:std('#45464a',{roughness:.7,side:THREE.DoubleSide,flatShading:true}),
  roofDark:std('#2f3033',{roughness:.7}),
  thatch:std('#80653f',{roughness:1,side:THREE.DoubleSide,flatShading:true}),
  stone:std('#8c8880',{roughness:.95,flatShading:true}),
  stoneDark:std('#5d5a54',{roughness:.95,flatShading:true}),
  foundation:std('#6b665c'),
  gravel:std('#4d4a45',{roughness:1}),
  bamboo:std('#ffffff',{roughness:.6}),
  bambooLeaf:std('#ffffff',{roughness:.8,side:THREE.DoubleSide}),
  bambooDry:std('#a88d58',{roughness:.8}),
  bark:std('#4a3a2e',{roughness:1}),
  foliage:std('#ffffff',{roughness:.9,flatShading:true}),
  frame:std('#24170f',{roughness:.6}),
  silk:std('#e9dcb9',{roughness:.9}),
  lanternGlow:std('#d8c9a0',{emissive:new THREE.Color('#ffb24d'),emissiveIntensity:0}),
};
const NOISE_GLSL=`
float hash3(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=0.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;
let _pk=0;
// one generic onBeforeCompile patcher; every patched material gets its own program cache key
function patchMat(mat,o){
  const key='pm'+(_pk++); mat.customProgramCacheKey=()=>key;
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime=U.uTime; Object.assign(sh.uniforms,o.uniforms||{});
    let v=sh.vertexShader, f=sh.fragmentShader;
    v=v.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+(o.vHead||''));
    v=v.replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 dwp=vec4(transformed,1.0); vec3 dwn=objectNormal;
      #ifdef USE_INSTANCING
        dwp=instanceMatrix*dwp; dwn=mat3(instanceMatrix)*dwn;
      #endif
      vW=(modelMatrix*dwp).xyz; vWN=normalize(mat3(modelMatrix)*dwn);
      ${o.vBegin||''}`);
    if(o.sway) v=v.replace('#include <project_vertex>',`
      vec4 mvPosition = vec4( transformed, 1.0 );
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
      #endif
      float swk=${o.sway};
      mvPosition.x += sin(uTime*1.3+mvPosition.x*0.35+mvPosition.z*0.21)*swk;
      mvPosition.z += cos(uTime*1.05+mvPosition.z*0.31+mvPosition.x*0.1)*swk*0.75;
      mvPosition.y += sin(uTime*2.1+mvPosition.x*1.7)*swk*0.15;
      mvPosition = modelViewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
    f=f.replace('#include <common>','#include <common>\nuniform float uTime;\nvarying vec3 vW; varying vec3 vWN;\n'+NOISE_GLSL+(o.fHead||''));
    if(o.color) f=f.replace('#include <color_fragment>','#include <color_fragment>\n'+o.color);
    if(o.rough) f=f.replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\n'+o.rough);
    if(o.normal) f=f.replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n'+o.normal);
    if(o.emissive) f=f.replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n'+o.emissive);
    sh.vertexShader=v; sh.fragmentShader=f;
  };
  return mat;
}
const bumpGLSL=(freq,amt)=>`{ vec3 q=vW*${freq.toFixed(2)}; vec3 pn=vec3(vnoise(q),vnoise(q+17.1),vnoise(q+31.7))-0.5; normal=normalize(normal+pn*${amt.toFixed(2)}); }`;
// leafy surface: clumps of small leaves read through noise in colour + normal, darker underneath
function leafy(mat,freq,amt,ca,trans=0.12){
  return patchMat(mat,{
    color:`float ln=fbm(vW*${freq.toFixed(2)}); diffuseColor.rgb*=(1.0-${ca.toFixed(2)})+${(ca*2).toFixed(2)}*ln;
           diffuseColor.rgb*=mix(0.55,1.05,smoothstep(-0.5,0.7,vWN.y));`,
    normal:bumpGLSL(freq*2.3,amt),
    emissive:`totalEmissiveRadiance+=diffuseColor.rgb*${trans.toFixed(2)};`});
}
function woodGrain(mat,amp){ return patchMat(mat,{color:`diffuseColor.rgb*=1.0-${amp.toFixed(2)}+${(amp*2).toFixed(2)}*fbm(vec3(vW.x*1.5,vW.y*9.0,vW.z*1.5)+vec3(vW.z*3.0,0.,vW.x*3.0));`}); }
function legacyRoofStripes(mat,freq,amp){
  mat.onBeforeCompile=(sh)=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vW; varying vec3 vWN;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvW=(modelMatrix*vec4(transformed,1.0)).xyz; vWN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vW; varying vec3 vWN;')
      .replace('#include <color_fragment>',`#include <color_fragment>
        float cc = abs(vWN.x)>abs(vWN.z) ? vW.z : vW.x;
        float s = smoothstep(0.35,0.5,fract(cc*${freq.toFixed(2)}));
        diffuseColor.rgb *= 1.0-${amp.toFixed(2)}*s;`);
  };
}
patchMat(M.roof,{color:`float cc=abs(vWN.x)>abs(vWN.z)?vW.z:vW.x; float rs=smoothstep(0.3,0.5,fract(cc*3.6)); diffuseColor.rgb*=1.0-0.25*rs;
  float along=abs(vWN.x)>abs(vWN.z)?vW.x:vW.z; diffuseColor.rgb*=0.9+0.12*smoothstep(0.85,0.95,fract(along*3.2+vnoise(vec3(cc*3.6))*0.3));
  diffuseColor.rgb*=0.82+0.3*fbm(vW*0.9); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.28,0.31,0.22),smoothstep(0.62,0.8,fbm(vW*0.6+4.0))*0.35);`,
  normal:`{ float cc=abs(vWN.x)>abs(vWN.z)?vW.z:vW.x; float g=cos(fract(cc*3.6)*6.2832); vec3 tn=abs(vWN.x)>abs(vWN.z)?vec3(0.,0.,1.):vec3(1.,0.,0.); normal=normalize(normal+(viewMatrix*vec4(tn*g*0.35,0.)).xyz); }`});
patchMat(M.thatch,{color:`diffuseColor.rgb*=0.75+0.45*fbm(vec3(vW.x*6.0,vW.y*30.0,vW.z*6.0)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.25,0.28,0.16),smoothstep(0.55,0.75,fbm(vW*1.2))*0.5);`, normal:bumpGLSL(14.0,0.6)});
for(const k of ['woodDark','woodMid','woodLight','woodFloor','bark','frame']) woodGrain(M[k],k==='bark'?0.3:0.16);
for(const k of ['plaster','plasterOut','fusuma']) patchMat(M[k],{color:`diffuseColor.rgb*=0.93+0.1*fbm(vW*1.7);`});

}

function mapleLeafGeo(size){
  const pts=[], lobes=[[-150,0.42],[-100,0.66],[-50,0.9],[0,1.0],[50,0.9],[100,0.66],[150,0.42]];

}

// merge rotated copies of a leaf into one card, with per-leaf vertex colour variation
function leafCluster(leafGeo,n,spread,tilt,shade=0.25){
  const parts=[]; const qq=new THREE.Quaternion(), ee=new THREE.Euler(), mm=new THREE.Matrix4();
  for(let i=0;i<n;i++){
    const g=leafGeo.clone(); const a=i/n*6.283+R(-0.3,0.3), r=R(0.25,1)*spread;
    ee.set(-PI/2+R(-tilt,tilt),R(-0.4,0.4),a); qq.setFromEuler(ee);
    mm.compose(new THREE.Vector3(Math.cos(a)*r,R(-0.03,0.05),Math.sin(a)*r),qq,new THREE.Vector3(1,1,1)); g.applyMatrix4(mm);
    const k=1-shade+R(0,shade*1.6), cnt=g.attributes.position.count, ca=new Float32Array(cnt*3);
    for(let j=0;j<cnt;j++){ ca[j*3]=k*R(0.95,1.08); ca[j*3+1]=k; ca[j*3+2]=k*0.95; }
    g.setAttribute('color',new THREE.BufferAttribute(ca,3)); if(g.index) parts.push(g.toNonIndexed()); else parts.push(g);
  }
  const out=mergeGeometries(parts); out.computeVertexNormals(); return out;
}

    fHead:'varying vec2 vFlow; varying float vFoam; varying float vEdge; float gFoam=0.0; uniform float uDusk;',
    uniforms:{uDusk:uD},
    color:`
      float fn=fbm(vec3(vW.xz*3.2-vFlow*uTime*1.3,uTime*0.25));
      gFoam=smoothstep(0.62,0.85,fn+vFoam*0.45)*clamp(vFoam*1.3,0.,1.);

 {id:'shixian',name:'诗仙之间',jp:'詩仙の間（しせんのま）',marker:[-5,4.9,3.0],view:{p:[-5,1.62,-0.25],t:[-5,2.25,-6]},via:[-5,1.8,6],

 {id:'study',name:'读书之间',jp:'読書の間（躍淵軒）',marker:[2,4.4,2.8],view:{p:[2.4,1.55,3.4],t:[1.6,1.3,-4]},

 {id:'sozu',name:'僧都（添水）',jp:'僧都（そうず）· 鹿おどし',marker:[10.3,-1.6,23.1],view:{p:[12.6,-2.2,26.6],t:[10.2,-3.0,23.2]},

let fly=null;
const V=a=>new THREE.Vector3(...a);
function flyTo(view,via){
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=V(view.p), t1=V(view.t);
  const d=p0.distanceTo(p1);
  const pts=[p0];
  const mid=p0.clone().lerp(p1,0.5); mid.y+=Math.min(16,d*0.22);
  if(d>6) pts.push(mid);
  if(via && p0.distanceTo(V(via))>3) pts.push(V(via));
  pts.push(p1);
  fly={curve:pts.length>2?new THREE.CatmullRomCurve3(pts,false,'centripetal'):null,p0,p1,t0,t1,start:performance.now(),dur:Math.min(4200,Math.max(1300,900+d*45))};
  controls.enabled=false;
}
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------------- sound (WebAudio, synthesized) ---------------- */
let actx=null, soundOn=false, waterGain=null;
function initAudio(){
  if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)();
  const len=actx.sampleRate*2, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0); let last=0;
  for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
  const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
  waterGain=actx.createGain(); waterGain.gain.value=0; src.connect(f).connect(waterGain).connect(actx.destination); src.start();
}
function knock(vol){
  if(!soundOn||!actx) return; const t=actx.currentTime;
  const o=actx.createOscillator(), g=actx.createGain(); o.type='sine';
  o.frequency.setValueAtTime(640,t); o.frequency.exponentialRampToValueAtTime(420,t+0.18);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9*vol,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.6);
  const o2=actx.createOscillator(), g2=actx.createGain(); o2.type='triangle'; o2.frequency.value=1580;
  g2.gain.setValueAtTime(0.35*vol,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.08); o2.connect(g2).connect(actx.destination); o2.start(t); o2.stop(t+0.1);
}
$('#bSound').onclick=()=>{ initAudio(); actx.resume(); soundOn=!soundOn; $('#bSound').textContent='声音：'+(soundOn?'开':'关'); $('#bSound').classList.toggle('on',soundOn); };

/* ---------------- sozu animation ---------------- */
function triggerSozu(){ if(sozu.state==='fill'){ sozu.state='tip'; sozu.t=0; } }
function updateSozu(dt){
  const S=sozu; S.t+=dt;
  if(S.state==='fill'){ S.angle=-0.32+Math.min(1,S.t/6.5)*0.2; S.drip.visible=true; if(S.t>6.5){S.state='tip';S.t=0;} }
  else if(S.state==='tip'){ const k=Math.min(1,S.t/0.35); S.angle=-0.12+(0.62)*ease(k); if(S.t>0.95){S.state='back';S.t=0;} }
  else if(S.state==='back'){ const k=Math.min(1,S.t/0.22); S.angle=0.5-0.82*k*k; if(k>=1){ S.state='bounce'; S.t=0; const d=camera.position.distanceTo(S.pos); knock(Math.max(0.05,1-d/90)); } }
  else if(S.state==='bounce'){ S.angle=-0.32+Math.sin(Math.min(1,S.t/0.3)*PI)*0.05; if(S.t>0.3){S.state='fill';S.t=0;} }
  S.pivot.rotation.x=S.angle;
}

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downPos=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos||Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>6) return;
  const hit=pick(e); if(!hit) return;
  if(hit.poet!=null){ selectPoet(hit.poet,false); return; }
  const h=byId[hit.hs]; if(!h) return;
  if(h.id==='sozu') triggerSozu();

});

function pick(e){
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(clickables,true);
  for(const h of hits){ let o=h.object; if(o.parent===markerGroup||o.parent?.parent===markerGroup){ if(!markerGroup.visible) continue; }
    if(o.userData.poet!=null) return {poet:o.userData.poet}; if(o.userData.hs) return {hs:o.userData.hs}; }
  return null;
}

/* ---------------- main loop ---------------- */
const clock=new THREE.Clock(); const tmp=new THREE.Vector3();
let composer=null, gtao=null, quality='high';
function buildComposer(){
  const rt=new THREE.WebGLRenderTarget(innerWidth,innerHeight,{type:THREE.HalfFloatType,samples:4});
  composer=new EffectComposer(renderer,rt);
  composer.addPass(new RenderPass(scene,camera));
  gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);
  gtao.updateGtaoMaterial({radius:0.9,distanceExponent:1.2,thickness:1.2,scale:1.1,samples:12});
  gtao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:5,rings:2,samples:12});
  gtao.blendIntensity=0.85;
  composer.addPass(gtao);
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.28,0.55,0.95));
  composer.addPass(new OutputPass());
  composer.setSize(innerWidth,innerHeight);
}
function setQuality(q){
  quality=q; $('#bQuality').textContent='画质：'+(q==='high'?'高':'标准');
  if(q==='high'&&!composer) buildComposer();
  const ms=q==='high'?4096:2048; if(sun.shadow.mapSize.x!==ms){ sun.shadow.mapSize.set(ms,ms); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } }
  grassMesh.visible=true;
}
$('#bQuality').onclick=()=>setQuality(quality==='high'?'std':'high');
let fpsAcc=0,fpsN=0,fpsChecked=false;
let shadowSpan=0;
function frame(){
  const dt=Math.min(0.05,clock.getDelta()); const t=clock.elapsedTime; U.uTime.value=t;
  // flight
  if(fly){
    const k=Math.min(1,(performance.now()-fly.start)/fly.dur), e=ease(k);
    if(fly.curve) camera.position.copy(fly.curve.getPoint(e)); else camera.position.lerpVectors(fly.p0,fly.p1,e);
    controls.target.lerpVectors(fly.t0,fly.t1,e);
    if(k>=1){ fly=null; controls.enabled=true; if(playing) scheduleNext(); }
  }
  controls.update();
  const gh=H(camera.position.x,camera.position.z)+0.4; if(camera.position.y<gh) camera.position.y=gh;
  sky.position.copy(camera.position);
  // shadow frustum follows the area being looked at (crisp shadows close up, wide in overview)
  { const span=Math.round(Math.min(85,Math.max(26,camera.position.distanceTo(controls.target)*1.15))/4)*4;
    const tx=Math.round(controls.target.x), tz=Math.round(controls.target.z);
    sun.target.position.set(tx,H(tx,tz),tz); sun.position.copy(sun.target.position).addScaledVector(SUN_DIR,170);
    if(span!==shadowSpan){ shadowSpan=span; const sc=sun.shadow.camera; sc.left=-span; sc.right=span; sc.top=span; sc.bottom=-span; sc.updateProjectionMatrix(); } }
  // mist at the foot of the waterfall
  for(let i=0;i<MIST_N;i++){ const m=mist[i]; m.t+=dt; if(m.t>2.5){ m.t=0; m.x=R(-0.6,0.6); m.z=R(-0.3,0.5); m.s=R(0.08,0.22); }
    const k=m.t/2.5; _m.compose(_v.set(-13+m.x*(1+k),-3.55+k*1.1,19.0+m.z+k*0.4),_q.identity(),_s.setScalar(m.s*0.7*(1+k*2.0))); mistMesh.setMatrixAt(i,_m); }
  mistMesh.instanceMatrix.needsUpdate=true;
  // leaves
  for(let i=0;i<LEAF_N;i++){ const l=leaves[i];
    if(!l.on){ _m.makeScale(0,0,0); leafMesh.setMatrixAt(i,_m); continue; }
    const g=H(l.p.x,l.p.z)+0.03;
    if(l.p.y>g){ l.p.y-=l.v*dt; l.p.x+=Math.sin(t*1.3+l.ph)*0.5*dt+0.12*dt; l.p.z+=Math.cos(t*1.1+l.ph)*0.35*dt; l.rot.x+=l.spin*dt; l.rot.y+=l.spin*0.7*dt; }
    else { l.p.y=g; l.rest+=dt; l.rot.x=-PI/2; if(l.rest>8) spawnLeaf(l,false); }
    _q.setFromEuler(l.rot); const nearCam=l.p.distanceToSquared(camera.position)<2.2; _m.compose(l.p,_q,_s.setScalar(nearCam?0:1)); leafMesh.setMatrixAt(i,_m);
  }
  leafMesh.instanceMatrix.needsUpdate=true;
  updateSozu(dt);
  if(actx&&waterGain){ const d=Math.min(camera.position.distanceTo(sozu.pos),camera.position.distanceTo(tmp.set(-13,-1.5,17))); waterGain.gain.value=soundOn?Math.max(0,0.12*(1-d/45)):0; }
  // markers & labels
  HS.forEach(h=>{
    if(!h.markerObj) return; const g=h.markerObj; const d=camera.position.distanceTo(g.position);
    g.position.y=g.userData.base+Math.sin(t*2+h.idx)*0.12; g.children[0].rotation.y=t*1.2;
    const s=Math.max(0.6,Math.min(4,d*0.035)); g.scale.setScalar(s); g.visible=d>2.5;
    const el=h.label; tmp.copy(g.position); tmp.y+=0.6*s; tmp.project(camera);
    const aerial=camera.position.y-H(camera.position.x,camera.position.z)>18;
    if(!labelsOn||tmp.z>1||d<2.5||d>170||(!aerial&&d>34&&!(cur>=0&&HS[cur]===h))){ el.style.display='none'; return; }
    el.style.display='flex'; el.style.left=((tmp.x+1)/2*innerWidth)+'px'; el.style.top=((1-tmp.y)/2*innerHeight)+'px';
    el.style.opacity=d>110?0.55:1;
  });
  if(quality==='high'&&composer) composer.render(); else renderer.render(scene,camera);
  if(!fpsChecked&&!window.__noAutoQuality&&$('#intro').classList.contains('gone')){ fpsAcc+=dt; fpsN++; if(fpsAcc>5){ fpsChecked=true; if(fpsN/fpsAcc<24&&quality==='high') setQuality('std'); } }
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); if(composer) composer.setSize(innerWidth,innerHeight); });

for(const k of ['fusuma','tatami','tatamiEdge','silk','plaster']) M[k].envMapIntensity=0.35;
scene.traverse(o=>{ const m=o.material; if(m&&m.isMeshStandardMaterial&&m.envMapIntensity===1) m.envMapIntensity=0.8; });
setQuality('high');
applySeason(); applyTime();
frame();
$('#loading').textContent='场景已就绪';
$('#iTour').onclick=()=>{ $('#intro').classList.add('gone'); goStop(0); };
$('#iFree').onclick=()=>{ $('#intro').classList.add('gone'); showOverview(); };
window.__shisendo={HS,goStop,showOverview,scene,renderer,setQuality};
</script>
